<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARKING 회귀 검사</title>
<style>body{font:14px system-ui;background:#16181d;color:#eee;margin:16px}button{padding:10px 16px;border-radius:8px}iframe{width:390px;max-width:100%;height:70vh;border:1px solid #777;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;background:#222;padding:12px;border-radius:8px}.pass{color:#7fe2a0}.fail{color:#ff9a9a}</style></head>
<body><h2>MARKING 자동 회귀 검사</h2><p>검사 대상은 정식 진입점 <code>index.html</code>입니다. 실제 화면 크기에서 실행되며 사진은 임시 생성됩니다.</p>
<label for="viewport">검사 화면: </label><select id="viewport"><option value="390">모바일 390px</option><option value="375">모바일 375px</option><option value="320">모바일 320px</option><option value="1280">PC 1280px</option></select> <button id="run">검사 다시 실행</button><pre id="report">준비 중…</pre><iframe id="app" title="MARKING 테스트"></iframe>
<script>
const frame=document.getElementById('app'),report=document.getElementById('report');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,cx:r.x+r.width/2}};
const lines=[];const viewport=document.getElementById('viewport');
function setViewport(){const width=Number(viewport.value);frame.style.width=width+'px';frame.style.maxWidth='none';frame.parentElement.style.overflowX='auto';}
viewport.onchange=run;
function check(name,ok,detail=''){lines.push((ok?'PASS ':'FAIL ')+name+(detail?' — '+detail:''));report.textContent=lines.join('\n');}
function waitLoad(){return new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=reject;frame.src='../index.html?regression='+Date.now();});}
let runSequence=0;
async function run(){
const thisRun=++runSequence;
report.dataset.runStarted=String(thisRun);
lines.length=0;report.textContent='검사 시작…';setViewport();
try{
await waitLoad();const w=frame.contentWindow,d=w.document;
check('도구막대 존재',!!d.querySelector('#toolbar'));
const c=d.createElement('canvas');c.width=960;c.height=640;const ctx=c.getContext('2d');ctx.fillStyle='#ccc';ctx.fillRect(0,0,960,640);
const blob=await new Promise(r=>c.toBlob(r,'image/png'));const file=new File([blob],'regression.png',{type:'image/png'});
const dt=new DataTransfer();dt.items.add(file);const input=d.querySelector('#fileInput');input.files=dt.files;input.dispatchEvent(new w.Event('change',{bubbles:true}));
const photo=d.querySelector('#view-canvas');
let loaded=false;
for(let attempt=0;attempt<40;attempt++){
  if(photo.classList.contains('ready')&&d.querySelector('#btn-save')?.disabled===false){loaded=true;break;}
  await sleep(100);
}
check('사진 로드',loaded,photo.width+'×'+photo.height+' / ready='+photo.classList.contains('ready'));
if(!loaded)throw new Error('사진 로드 대기 4초 초과');
const circleTool=d.querySelector('#btn-circle');circleTool.click();await sleep(100);
check('도형 도구 활성화',circleTool.classList.contains('active'),'class='+circleTool.className);
const panel=d.querySelector('#options-bar');
check('도형 설정창 표시',!panel.classList.contains('hidden')&&!!panel.querySelector('.option-shape'),'layout='+panel.dataset.layout+', hidden='+panel.classList.contains('hidden'));
if(!panel.querySelector('.option-shape'))throw new Error('도형 설정창 없음: layout='+panel.dataset.layout);
const shape=panel.querySelector('.option-shape');const buttons=[...shape.querySelectorAll('button')];
const palette=()=>[...panel.querySelectorAll('.palette-swatch')].map(e=>rect(e).cx);
const snapshot=()=>({p:rect(panel),colors:palette(),stroke:rect(panel.querySelector('.option-stroke>span')),shape:rect(shape)});
const circleButton=buttons.find(b=>b.textContent.includes('원'));
if(!circleButton)throw new Error('원/타원 버튼 없음');
circleButton.click();await sleep(80);const circle=snapshot();
const beforeReselect=panel.querySelector('.option-shape');
const selectedCircle=[...beforeReselect.querySelectorAll('button')].find(b=>b.textContent.includes('원'));
selectedCircle.click();
check('같은 도형 재선택 시 설정창 DOM 보존',panel.querySelector('.option-shape')===beforeReselect);
buttons.length=0;buttons.push(...panel.querySelectorAll('.option-shape button'));buttons.find(b=>b.textContent.includes('네모')).click();await sleep(80);const square=snapshot();
check('원·네모 색상 수 동일',circle.colors.length===square.colors.length);
const drift=Math.max(0,...circle.colors.map((x,i)=>Math.abs(x-square.colors[i])));
if(Number(viewport.value)<=640)check('원·네모 색상 X좌표 차이 1px 이하',drift<=1,'최대 '+drift.toFixed(2)+'px');
else check('PC 색상 팔레트 표시 유지',circle.colors.length>0&&square.colors.length>0,'PC 좌표 차이 '+drift.toFixed(2)+'px (정보)');
if(Number(viewport.value)<=640)check('굵기 라벨과 도형 버튼 비겹침',circle.stroke.x>=circle.shape.x+circle.shape.w-1&&square.stroke.x>=square.shape.x+square.shape.w-1);
if(Number(viewport.value)<=640)check('설정창 폭 변화 1px 이하',Math.abs(circle.p.w-square.p.w)<=1,'차이 '+Math.abs(circle.p.w-square.p.w).toFixed(2)+'px');
else check('PC 설정창 폭 유효',circle.p.w>0&&square.p.w>0,'폭 차이 '+Math.abs(circle.p.w-square.p.w).toFixed(2)+'px (정보)');
d.querySelector('#btn-blur').click();await sleep(80);
check('가림 설정창 표시',panel.dataset.layout==='effect'&&!panel.classList.contains('hidden'));
const target=panel.querySelector('.effect-target-label');
if(Number(viewport.value)<=640)check('얼굴 기본 라벨',target&&target.textContent==='얼굴');
const rectBtn=[...panel.querySelectorAll('.option-target button')].find(b=>b.textContent==='사각형');
check('영역 선택 버튼 존재',!!rectBtn);
if(rectBtn){rectBtn.click();await sleep(80);}
if(Number(viewport.value)<=640)check('영역 전환 라벨',panel.querySelector('.effect-target-label')?.textContent==='영역');
if(Number(viewport.value)<=640){
const controls=panel.querySelector('.effect-controls');const groups=controls?[...controls.querySelectorAll(':scope > .opt-group')]:[];
const label=panel.querySelector('.effect-target-label');
if(label&&groups.length===2){
const lr=rect(label),left=rect(groups[0]),right=rect(groups[1]);
const gapCenter=(left.x+left.w+right.x)/2;
check('얼굴·영역 라벨 중앙 정렬 오차 2px 이하',Math.abs(lr.cx-gapCenter)<=2,'오차 '+Math.abs(lr.cx-gapCenter).toFixed(2)+'px');
}else check('얼굴·영역 라벨 측정 요소 존재',false);
}else{check('PC에서 모바일 전용 정렬 검사 생략',true);}
}catch(e){check('검사 실행 중 오류',false,String(e.stack||e));}
report.textContent+='\n\n완료: '+lines.filter(x=>x.startsWith('PASS')).length+'/'+lines.length+' 통과';
report.dataset.runCompleted=String(thisRun);
}
document.getElementById('run').onclick=run;run();
</script></body></html>
