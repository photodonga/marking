      const nat=dispToNat(dp), c=drag.center;
      let angle=drag.startRotation+Math.atan2(nat.y-c.y,nat.x-c.x)-drag.startAngle;
      if(e.shiftKey){ const step=Math.PI/12; angle=Math.round(angle/step)*step; }
      drag.obj.rotation=angle;
      redraw();
    } else if(drag.mode==="resize"){
      const nat = dispToNat(dp);
      const o = drag.obj;
      if(o.type==="rect" && (o.rotation||0)!==0){
        const snap=drag.snapshot, opposite={nw:"se",ne:"sw",sw:"ne",se:"nw"}[drag.handle];
        const anchor=rectCornerNatural(snap,opposite), a=snap.rotation||0;
        let local=rotatePoint(nat,anchor,-a);
        local={x:local.x-anchor.x,y:local.y-anchor.y};
        const sx=drag.handle.includes("e")?1:-1, sy=drag.handle.includes("s")?1:-1;
        let lw=sx*Math.max(4,sx*local.x), lh=sy*Math.max(4,sy*local.y);
        if(rectLocked){ const size=Math.max(Math.abs(lw),Math.abs(lh)); lw=sx*size; lh=sy*size; }
        const localCenter={x:anchor.x+lw/2,y:anchor.y+lh/2};
        const worldCenter=rotatePoint(localCenter,anchor,a);
        o.w=Math.abs(lw);o.h=Math.abs(lh);o.x=worldCenter.x-o.w/2;o.y=worldCenter.y-o.h/2;
      } else if(o.type==="circle" || o.type==="rect"){
        const b = objectBoundsNatural(o);
        const x0=b.x, y0=b.y, x1=b.x+b.w, y1=b.y+b.h;
        let ax, ay, mx=nat.x, my=nat.y;
        if(drag.handle==="nw"){ ax=x1; ay=y1; }
        else if(drag.handle==="ne"){ ax=x0; ay=y1; }
        else if(drag.handle==="sw"){ ax=x1; ay=y0; }
        else { ax=x0; ay=y0; } // se
        let mvx=mx, mvy=my;
        const shapeLocked=o.type==="rect"?rectLocked:circleLocked;
        if(shapeLocked){
          const size = Math.max(Math.abs(mx-ax), Math.abs(my-ay), 4);
          const signX = mx>=ax?1:-1, signY = my>=ay?1:-1;
          mvx = ax+signX*size; mvy = ay+signY*size;
        }
        const nx = Math.min(ax,mvx), ny=Math.min(ay,mvy);
        const nw = Math.max(4,Math.abs(mvx-ax)), nh = Math.max(4,Math.abs(mvy-ay));
        if(o.type==="circle"){ o.cx = nx+nw/2; o.cy = ny+nh/2; o.rx = nw/2; o.ry = nh/2; }
        else { o.x=nx; o.y=ny; o.w=nw; o.h=nh; }
      } else {
        if(drag.handle==="p1"){ o.x1=nat.x; o.y1=nat.y; }
        else { o.x2=nat.x; o.y2=nat.y; }
      }
      redraw();
    }
  }

  function onPointerUp(e){
    if(!drag) return;
    const finishedDrag = drag;
    drag = null;

    if(finishedDrag.mode==="create"){
      const dp0 = finishedDrag.startDisp, dp1 = finishedDrag.curDisp;
      const moved = Math.hypot(dp1.x-dp0.x, dp1.y-dp0.y) > 3;

      if(activeTool==="blur"){
        if(moved){
          const r = normRect(dispToNat(dp0), dispToNat(dp1));
          if(r.w>2 && r.h>2){
            // 얼굴 모드는 얼굴을 찾아 비율에 맞는 타원으로 보정하고,
            // 사각형 모드는 사용자가 그린 영역을 그대로 즉시 가린다.
            if(blurShape==="rect"){
              const eff={
                id:genId(), type:'effect', rect:Object.assign({},r), faceRects:[],
                autoFace:false, mode:blurMode, shape:'rect', rotation:0, intensity:intensity, feather:feather
              };
              effects.push(eff); selectedId=eff.id;
              pushHistory(); buildOptionsBar(); redraw();
              showToast("사각형 영역 가림",900);
              return;
            }
            const eff={id:genId(),type:'effect',rect:Object.assign({},r),faceRects:[],autoFace:false,
              mode:blurMode,shape:'ellipse',rotation:0,intensity:intensity,feather:feather};
            effects.push(eff);selectedId=eff.id;pushHistory();buildOptionsBar();redraw();
            const generation=imageGeneration;
            const initial=JSON.stringify(eff);
            const historyEntry=history[historyIndex];
            runFaceDetectionInBox(r,function(faces,points){
              if(generation!==imageGeneration || history[historyIndex]!==historyEntry ||
                effects.find(e=>e.id===eff.id)!==eff || JSON.stringify(eff)!==initial) return;
              faceDebugPoints=points||[];clearTimeout(faceDebugTimer);
              if(faceDebugPoints.length)faceDebugTimer=setTimeout(()=>{faceDebugPoints=[];redraw();},1100);
              const faceRects=(faces||[]).map(face=>({x:face.x,y:face.y,w:face.w,h:face.h}));
              if(faceRects.length){eff.rect=Object.assign({},faceRects[0]);eff.faceRects=faceRects;eff.autoFace=true;}
              history[historyIndex]={objects:deepCloneObjects(objects),effects:deepCloneObjects(effects)};
              redraw();
              if(faceRects.length)showToast("얼굴 위치 보정",1000);
              else if(faceDetectorLoadError)showToast("얼굴 인식 모듈 로드 실패 · 지정 영역 사용",1600);
              else showToast("지정한 영역 그대로 가림",1100);
            });
          }
        }
        redraw();
        return;
      }

      if(activeTool==="circle"){
        if(moved){
          const n0 = dispToNat(dp0), n1 = dispToNat(dp1);
          let r;
          const shapeLocked=shapeKind==="rect"?rectLocked:circleLocked;
          if(shapeLocked){
            const size = Math.max(Math.abs(n1.x-n0.x), Math.abs(n1.y-n0.y));
            const signX = n1.x>=n0.x?1:-1, signY = n1.y>=n0.y?1:-1;
            r = normRect(n0, {x:n0.x+signX*size, y:n0.y+signY*size});
          } else {
            r = normRect(n0, n1);
          }
          if(r.w>3 && r.h>3){
            const obj = shapeKind==="rect"
              ? {id:genId(), type:"rect", x:r.x, y:r.y, w:r.w, h:r.h, rotation:0, strokePx:strokePxCurrent, strokeMult:strokeMultCurrent, color:strokeColorCurrent, dashed:dashedCurrent}
              : {id:genId(), type:"circle", cx:r.x+r.w/2, cy:r.y+r.h/2, rx:r.w/2, ry:r.h/2, strokePx:strokePxCurrent, strokeMult:strokeMultCurrent, color:strokeColorCurrent, dashed:dashedCurrent};
            objects.push(obj);
            selectedId = obj.id;
            pushHistory();
            buildOptionsBar();
          }
        }
        redraw();
        return;
      }

      if(activeTool==="arrow"){
        if(moved){
          const n0 = dispToNat(dp0), n1 = dispToNat(dp1);
          if(!meetsMinimumAnnotationLength(n0,n1)){ redraw(); return; }
          const obj = {id:genId(), type:"arrow", x1:n0.x, y1:n0.y, x2:n1.x, y2:n1.y, strokePx:strokePxCurrent, strokeMult:strokeMultCurrent, color:strokeColorCurrent, dashed:dashedCurrent};
          objects.push(obj);
          selectedId = obj.id;
          pushHistory();
          buildOptionsBar();
        }
        redraw();
        return;
      }

      if(activeTool==="line"){
        if(moved){
          const n0 = dispToNat(dp0), n1 = dispToNat(dp1);
          if(!meetsMinimumAnnotationLength(n0,n1)){ redraw(); return; }
          const obj = {id:genId(), type:"line", x1:n0.x, y1:n0.y, x2:n1.x, y2:n1.y, strokePx:strokePxCurrent, strokeMult:strokeMultCurrent, color:strokeColorCurrent, dashed:dashedCurrent};
          objects.push(obj);
          selectedId = obj.id;
          pushHistory();
          buildOptionsBar();
        }
        redraw();
        return;
      }
    } else if(finishedDrag.mode==="move" || finishedDrag.mode==="resize" || finishedDrag.mode==="rotate" || finishedDrag.mode==="effectMove" || finishedDrag.mode==="effectResize" || finishedDrag.mode==="effectRotate"){
      pushHistory();
    }
  }

  // ---------------- 박스 안 얼굴 자동 인식 ----------------
  // 얼굴 위치 보정은 Face Detector(BlazeFace full-range)를 1차로 사용한다.
  // Face Landmarker보다 '얼굴이 있는지/어디 있는지' 찾는 목적에 맞고, 작은 얼굴·사선 얼굴에도 유리하다.
  // 사용자가 직접 그린 영역이 항상 기준이며 자동 검출 실패 시 수동 영역을 그대로 사용한다.
  const TASKS_VISION_VERSION = "0.10.35";
  const TASKS_VISION_BUNDLE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${TASKS_VISION_VERSION}/vision_bundle.mjs`;
  const TASKS_VISION_WASM = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${TASKS_VISION_VERSION}/wasm`;
  const FACE_DETECTOR_MODEL = "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_full_range/float16/1/blaze_face_full_range.tflite";
  const FACE_LANDMARKER_MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

  let visionRuntimePromise = null;
  let faceDetectorPromise = null;
  let faceLandmarkerPromise = null;
  let faceDetectorLoadError = false;

  function loadVisionRuntime(){
    if(visionRuntimePromise) return visionRuntimePromise;
    visionRuntimePromise = (async()=>{
      try{
        // jsDelivr의 +esm 변환본 대신 MediaPipe가 배포한 원본 ESM bundle을 직접 사용한다.
        const vision = await import(TASKS_VISION_BUNDLE);
        const fileset = await vision.FilesetResolver.forVisionTasks(TASKS_VISION_WASM);
        faceDetectorLoadError = false;
        return {vision, fileset};
      }catch(err){
        console.warn("MediaPipe runtime load failed.", err);
        faceDetectorLoadError = true;
        visionRuntimePromise = null; // 다음 시도에서 재시도
        return null;
      }
    })();
    return visionRuntimePromise;
  }

  function resetFaceDetector(instance){
    try{ if(instance && typeof instance.close === "function") instance.close(); }catch(_){ }
    faceDetectorPromise = null;
  }
  function resetFaceLandmarker(instance){
    try{ if(instance && typeof instance.close === "function") instance.close(); }catch(_){ }
    faceLandmarkerPromise = null;
  }

  function ensureFaceDetector(){
    if(faceDetectorPromise) return faceDetectorPromise;
    faceDetectorPromise = (async()=>{
      const rt = await loadVisionRuntime();
      if(!rt){faceDetectorPromise=null;return null;}
      try{
        // 사진 한 장씩 처리하는 도구라 CPU 우선이 가장 예측 가능하다.
        const detector = await rt.vision.FaceDetector.createFromOptions(rt.fileset,{
          baseOptions:{ modelAssetPath:FACE_DETECTOR_MODEL, delegate:"CPU" },
          runningMode:"IMAGE",
          minDetectionConfidence:0.25,
          minSuppressionThreshold:0.30
        });
        faceDetectorLoadError = false;
        return detector;
      }catch(err){
        console.warn("Face Detector init failed.", err);
        faceDetectorLoadError = true;
        faceDetectorPromise = null;
        return null;
      }
    })();
    return faceDetectorPromise;
  }

  function ensureFaceLandmarker(){
    if(faceLandmarkerPromise) return faceLandmarkerPromise;
    faceLandmarkerPromise = (async()=>{
      const rt = await loadVisionRuntime();
      if(!rt){faceLandmarkerPromise=null;return null;}
      try{
        const landmarker = await rt.vision.FaceLandmarker.createFromOptions(rt.fileset,{
          baseOptions:{ modelAssetPath:FACE_LANDMARKER_MODEL, delegate:"CPU" },
          runningMode:"IMAGE",
          // 수동으로 한 얼굴을 지정한 crop만 검사하므로 1명이 가장 안정적이고 빠르다.
          numFaces:1,
          minFaceDetectionConfidence:0.25,
          minFacePresenceConfidence:0.25,
          minTrackingConfidence:0.25,
          outputFaceBlendshapes:false,
          outputFacialTransformationMatrixes:false
        });
        return landmarker;
      }catch(err){
        console.warn("Face Landmarker fallback init failed.", err);
        faceLandmarkerPromise = null;
        return null;
      }
    })();
    return faceLandmarkerPromise;
  }

  async function detectFacesPrimary(crop){
    const detector = await ensureFaceDetector();
    if(!detector) return [];
    try{
      const result = detector.detect(crop);
      return (result && result.detections) || [];
    }catch(err){
      console.warn("Face Detector detect failed.", err);
      resetFaceDetector(detector);
      return [];
    }
  }

  async function detectLandmarksFallback(crop){
    const landmarker = await ensureFaceLandmarker();
    if(!landmarker) return [];
    try{
      const result = landmarker.detect(crop);
      return (result && result.faceLandmarks) || [];
    }catch(err){
      console.warn("Face Landmarker fallback detect failed.", err);
      resetFaceLandmarker(landmarker);
      return [];
    }
  }

  // 얼굴 외곽선을 그대로 마스크로 쓰지 않고, 랜드마크는 얼굴의 실제 가로/세로 비율과 중심만 계산하는 데 사용한다.
  // 최종 가림 모양은 항상 매끈한 타원형이다.
  const FACE_OVAL_BOUNDS_INDICES = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

  function adaptiveFaceEllipseFromLandmarks(landmarkFaces, sx, sy, cw, ch, targetCx, targetCy){
    let best=null;
    for(const lm of (landmarkFaces||[])){
      const pts=FACE_OVAL_BOUNDS_INDICES.map(i=>lm[i]).filter(Boolean).map(pt=>({x:sx+pt.x*cw,y:sy+pt.y*ch}));
      if(pts.length<24) continue;
      const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
      const x1=Math.min(...xs), x2=Math.max(...xs), y1=Math.min(...ys), y2=Math.max(...ys);
      const w=Math.max(8,x2-x1), h=Math.max(8,y2-y1);
      const cx=(x1+x2)/2, cy=(y1+y2)/2;
      const dist=Math.hypot(cx-targetCx,cy-targetCy);
      if(!best || dist<best.dist) best={x1,x2,y1,y2,w,h,cx,cy,dist};
    }
    if(!best) return null;

    // 실제 얼굴 비율은 유지하되 타원이 피부에 너무 딱 붙지 않도록 소폭 확장한다.
    // 좌우보다 위쪽을 조금 더 확보해 이마까지 자연스럽게 가린다.
    const padX=best.w*0.090;
    const padTop=best.h*0.120;
    const padBottom=best.h*0.070;
    const x1=clamp(best.x1-padX,0,naturalW);
    const y1=clamp(best.y1-padTop,0,naturalH);
    const x2=clamp(best.x2+padX,0,naturalW);
    const y2=clamp(best.y2+padBottom,0,naturalH);
    return {x:x1,y:y1,w:Math.max(4,x2-x1),h:Math.max(4,y2-y1),center:{x:best.cx,y:best.cy}};
  }

  function runFaceDetectionInBox(natRect, cb){
    (async()=>{
      // 얼굴 일부만 대충 둘러도 detector가 머리 전체를 볼 수 있게 탐지용 crop만 크게 확장한다.
      const marginX=natRect.w*0.55, marginY=natRect.h*0.55;
      const sx=clamp(Math.floor(natRect.x-marginX),0,naturalW), sy=clamp(Math.floor(natRect.y-marginY),0,naturalH);
      const ex=clamp(Math.ceil(natRect.x+natRect.w+marginX),0,naturalW), ey=clamp(Math.ceil(natRect.y+natRect.h+marginY),0,naturalH);
      const cw=Math.max(1,ex-sx), ch=Math.max(1,ey-sy);
      if(cw<20||ch<20){ cb([],[]); return; }

      // 단체사진의 작은 얼굴은 충분히 크게 확대해 detector 입력에 전달한다.
      const detectMin=640, detectMax=1280, long=Math.max(cw,ch);
      const ds=Math.min(4, detectMax/long, Math.max(1,detectMin/long));
      const dw=Math.max(128,Math.round(cw*ds)), dh=Math.max(128,Math.round(ch*ds));
      const crop=document.createElement("canvas"); crop.width=dw; crop.height=dh;
      const cctx=crop.getContext("2d",{willReadFrequently:true});
      cctx.imageSmoothingEnabled=true; cctx.imageSmoothingQuality="high";
      cctx.drawImage(rasterCanvas,sx,sy,cw,ch,0,0,dw,dh);

      const selCx=natRect.x+natRect.w/2, selCy=natRect.y+natRect.h/2;
      const selDiag=Math.max(1,Math.hypot(natRect.w,natRect.h));

      // 1) 얼굴 위치 전용 Face Detector를 우선 사용한다.
      const detections=await detectFacesPrimary(crop);
      const candidates=[];
      for(const det of detections){
        const b=det && det.boundingBox;
        if(!b) continue;
        // FaceDetector boundingBox는 입력 crop 픽셀 좌표이므로 원본 사진 좌표로 환산한다.
        const bx=sx+(Number(b.originX)||0)*cw/dw;
        const by=sy+(Number(b.originY)||0)*ch/dh;
        const bw=Math.max(4,(Number(b.width)||0)*cw/dw);
        const bh=Math.max(4,(Number(b.height)||0)*ch/dh);
        const cx=bx+bw/2, cy=by+bh/2;

        const centerInside=cx>=natRect.x&&cx<=natRect.x+natRect.w&&cy>=natRect.y&&cy<=natRect.y+natRect.h;
        const dist=Math.hypot(cx-selCx,cy-selCy);
        const centerNear=dist<=selDiag*0.70;
        if(!centerInside && !centerNear) continue;

        const ix1=Math.max(bx,natRect.x), iy1=Math.max(by,natRect.y);
        const ix2=Math.min(bx+bw,natRect.x+natRect.w), iy2=Math.min(by+bh,natRect.y+natRect.h);
        const overlap=Math.max(0,ix2-ix1)*Math.max(0,iy2-iy1);
        const overlapRatio=overlap/Math.max(1,bw*bh);
        if(!centerInside && overlapRatio<0.08) continue;

        const score=(det.categories&&det.categories[0]&&Number(det.categories[0].score))||0;
        candidates.push({bx,by,bw,bh,cx,cy,score:dist/selDiag-overlapRatio*0.35-score*0.08});
      }

      candidates.sort((a,b)=>a.score-b.score);
      if(candidates.length){
        const f=candidates[0];

        // Detector는 얼굴 위치를 잡고, Landmarker는 얼굴형의 가로/세로 비율만 얻는다.
        // 외곽선을 따는 polygon은 사용하지 않는다. 결과는 언제나 단순한 타원형이다.
        const landmarkFaces=await detectLandmarksFallback(crop);
        const adaptive=adaptiveFaceEllipseFromLandmarks(landmarkFaces,sx,sy,cw,ch,f.cx,f.cy);
        if(adaptive && adaptive.center && Math.hypot(adaptive.center.x-f.cx,adaptive.center.y-f.cy)<=Math.max(f.bw,f.bh)*0.65){
          cb([{x:adaptive.x,y:adaptive.y,w:adaptive.w,h:adaptive.h}],[{x:f.cx,y:f.cy}]);
          return;
        }

        // Landmarker가 실패하면 Detector 박스 비율을 그대로 살린 타원형으로 폴백한다.
        const padX=f.bw*0.100, padTop=f.bh*0.185, padBottom=f.bh*0.100;
        const x1=clamp(f.bx-padX,0,naturalW), y1=clamp(f.by-padTop,0,naturalH);
        const x2=clamp(f.bx+f.bw+padX,0,naturalW), y2=clamp(f.by+f.bh+padBottom,0,naturalH);
        cb([{x:x1,y:y1,w:Math.max(4,x2-x1),h:Math.max(4,y2-y1)}],[{x:f.cx,y:f.cy}]);
        return;
      }

      // 2) Detector가 놓친 경우에도 Landmarker의 얼굴 외곽 '범위'만 이용해 타원 비율을 정한다.
      const faces=await detectLandmarksFallback(crop);
      const adaptive=adaptiveFaceEllipseFromLandmarks(faces,sx,sy,cw,ch,selCx,selCy);
      if(adaptive && adaptive.center && Math.hypot(adaptive.center.x-selCx,adaptive.center.y-selCy)<=selDiag*0.90){
        cb([{x:adaptive.x,y:adaptive.y,w:adaptive.w,h:adaptive.h}],[adaptive.center]);
        return;
      }

      cb([],[]);
    })().catch(err=>{
      console.warn("Face detection pipeline failed; manual region will be used.",err);
      cb([],[]);
    });
  }

  // ---------------- blur / mosaic engine ----------------
  // 마스크 페더 등 범용 용도로 쓰는 기본 blur helper.
  function boxBlurCanvas(srcCanvas, radiusPx){
    const w = srcCanvas.width, h = srcCanvas.height;
    if(!(radiusPx>0.5)){
      const c0 = document.createElement("canvas"); c0.width=w; c0.height=h;
      c0.getContext("2d").drawImage(srcCanvas,0,0);
      return c0;
    }
    // 최신 브라우저에서는 Canvas 2D blur를 한 번만 적용한다.
    // 이 helper는 페더에도 사용되므로 과도한 다중 패스를 하지 않는다.
    const nativeOut = document.createElement("canvas"); nativeOut.width=w; nativeOut.height=h;
    const nctx = nativeOut.getContext("2d");
    if(nctx && "filter" in nctx){
      try{
        nctx.filter = `blur(${Math.max(0.6, radiusPx)}px)`;
        nctx.drawImage(srcCanvas,0,0);
        nctx.filter = "none";
        return nativeOut;
      }catch(_e){}
    }

    // 폴백: 전체적으로 줄여야 하는 배율(강도에 비례). 한 번에 과도하게 축소하면
    // 얼룩/줄무늬가 생기므로 단계별 최대 축소량을 제한한다.
    const totalFactor = Math.max(1.3, radiusPx/3.2);
    const passes = Math.max(1, Math.min(8, Math.ceil(Math.log2(totalFactor))));
    const perStep = Math.pow(totalFactor, 1/passes);
    let curW = w, curH = h, cur = srcCanvas;
    for(let i=0;i<passes;i++){
      const nw = Math.max(1, Math.round(curW/perStep));
      const nh = Math.max(1, Math.round(curH/perStep));
      const small = document.createElement("canvas"); small.width=nw; small.height=nh;
      const sctx = small.getContext("2d");
      sctx.imageSmoothingEnabled = true;
      sctx.imageSmoothingQuality = "high";
      sctx.drawImage(cur, 0,0,curW,curH, 0,0,nw,nh);
      cur = small; curW = nw; curH = nh;
    }
    const out = document.createElement("canvas"); out.width=w; out.height=h;
    const octx = out.getContext("2d");
    octx.imageSmoothingEnabled = true;
    octx.imageSmoothingQuality = "high";
    octx.drawImage(cur, 0,0,curW,curH, 0,0,w,h);
    return out;
  }

  // Safari/iOS에서도 결과가 동일한 얼굴 익명화 블러.
  // CanvasRenderingContext2D.filter 지원 여부에 기대지 않고, 작은 작업 캔버스에서
  // 2-pass box blur를 여러 번 수행한 뒤 고품질로 확대한다.
  // → 눈/코/입의 고주파 정보는 확실히 제거하면서 얼굴의 전체 명암/색 분포는 보존한다.
  function cpuBoxBlurCanvas(srcCanvas, radiusPx, passes){
    const w=srcCanvas.width, h=srcCanvas.height;
    const r=Math.max(1, Math.round(radiusPx));
    const count=r*2+1;
    const ctx=srcCanvas.getContext("2d", {willReadFrequently:true});
    const img=ctx.getImageData(0,0,w,h);
    let a=new Uint8ClampedArray(img.data);
    let b=new Uint8ClampedArray(a.length);

    function horiz(input, output){
      for(let y=0;y<h;y++){
        const row=y*w*4;
        let sr=0,sg=0,sb=0,sa=0;
        for(let k=-r;k<=r;k++){
          const x=Math.max(0,Math.min(w-1,k));
          const i=row+x*4; sr+=input[i]; sg+=input[i+1]; sb+=input[i+2]; sa+=input[i+3];
        }
        for(let x=0;x<w;x++){
          const o=row+x*4;
          output[o]=sr/count; output[o+1]=sg/count; output[o+2]=sb/count; output[o+3]=sa/count;
          const oldX=Math.max(0,x-r), newX=Math.min(w-1,x+r+1);
          const oi=row+oldX*4, ni=row+newX*4;
          sr+=input[ni]-input[oi]; sg+=input[ni+1]-input[oi+1];
          sb+=input[ni+2]-input[oi+2]; sa+=input[ni+3]-input[oi+3];
        }
      }
    }
    function vert(input, output){
      for(let x=0;x<w;x++){
        let sr=0,sg=0,sb=0,sa=0;
        for(let k=-r;k<=r;k++){
          const y=Math.max(0,Math.min(h-1,k));
          const i=(y*w+x)*4; sr+=input[i]; sg+=input[i+1]; sb+=input[i+2]; sa+=input[i+3];
        }
        for(let y=0;y<h;y++){
          const o=(y*w+x)*4;
          output[o]=sr/count; output[o+1]=sg/count; output[o+2]=sb/count; output[o+3]=sa/count;
          const oldY=Math.max(0,y-r), newY=Math.min(h-1,y+r+1);
          const oi=(oldY*w+x)*4, ni=(newY*w+x)*4;
          sr+=input[ni]-input[oi]; sg+=input[ni+1]-input[oi+1];
          sb+=input[ni+2]-input[oi+2]; sa+=input[ni+3]-input[oi+3];
        }
      }
    }

    const n=Math.max(1,Math.min(3,passes||2));
    for(let pass=0;pass<n;pass++){
      horiz(a,b);
      vert(b,a);
    }
    img.data.set(a);
    const out=document.createElement("canvas"); out.width=w; out.height=h;
    out.getContext("2d").putImageData(img,0,0);
    return out;
  }

  function anonymizeBlurCanvas(srcCanvas, radiusPx, intensityValue){
    const w=srcCanvas.width, h=srcCanvas.height;
    const t=clamp((Number.isFinite(intensityValue)?intensityValue:50)/100,0,1);
    if(t<=0 || !(radiusPx>0.25)){
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(srcCanvas,0,0);
      return c;
    }

    // 강도 50은 '보도용 기본 익명화'가 되도록 약 3.7배 축소한다.
    // 강도를 높여도 지나치게 단색 덩어리가 되지 않도록 최대 축소폭은 제한한다.
    const downFactor = 1.65 + 4.15*Math.pow(t,0.92); // 50≈3.84x, 100≈5.8x
    const smallW=Math.max(12,Math.round(w/downFactor));
    const smallH=Math.max(12,Math.round(h/downFactor));
    const small=document.createElement("canvas"); small.width=smallW; small.height=smallH;
    const sctx=small.getContext("2d", {willReadFrequently:true});
    sctx.imageSmoothingEnabled=true;
    sctx.imageSmoothingQuality="high";
    sctx.drawImage(srcCanvas,0,0,w,h,0,0,smallW,smallH);

    // 원본 좌표에서 계산된 블러 반경을 축소 캔버스 좌표로 환산한다.
    // 최소값을 보장해 iOS에서도 '효과가 안 먹는' 상태가 생기지 않게 한다.
    const scaleDown=smallW/Math.max(1,w);
    const smallRadius=Math.max(1.5, radiusPx*scaleDown*1.35);
    const blurredSmall=cpuBoxBlurCanvas(small, smallRadius, t>=0.72?3:2);

    const out=document.createElement("canvas"); out.width=w; out.height=h;
    const octx=out.getContext("2d");
    octx.imageSmoothingEnabled=true;
    octx.imageSmoothingQuality="high";
    octx.drawImage(blurredSmall,0,0,smallW,smallH,0,0,w,h);
    return out;
  }

  // 보도사진용 모자이크: 블록을 과도하게 키우지 않고, 픽셀화 직전에 아주 약한
  // 사전 블러를 넣어 눈/입/콧구멍 같은 고대비 부분이 검은 사각형으로 튀는 현상을 줄인다.
  function privacyMosaicCanvas(srcCanvas, blockSize, intensityValue){
    const w=srcCanvas.width, h=srcCanvas.height;
    const t=clamp((Number.isFinite(intensityValue)?intensityValue:50)/100,0,1);
    if(t<=0){
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(srcCanvas,0,0);
      return c;
    }

    const b=Math.max(2, blockSize);
    // 블록을 키운 만큼 사전 블러는 과해지지 않게 제한한다.
    // 픽셀 경계는 선명하게 남기면서 눈·입 같은 고대비 디테일만 살짝 평균화한다.
    const preRadius=Math.max(0.7, Math.min(b*0.32, b*(0.14 + 0.16*t)));
    const prepared=cpuBoxBlurCanvas(srcCanvas, preRadius, 1);

    const smallW=Math.max(1, Math.ceil(w/b));
    const smallH=Math.max(1, Math.ceil(h/b));
    const small=document.createElement("canvas"); small.width=smallW; small.height=smallH;
    const smctx=small.getContext("2d");
    smctx.imageSmoothingEnabled=true;
    smctx.imageSmoothingQuality="high";
    smctx.drawImage(prepared,0,0,w,h,0,0,smallW,smallH);

    const out=document.createElement("canvas"); out.width=w; out.height=h;
    const octx=out.getContext("2d");
    octx.imageSmoothingEnabled=false;
    octx.drawImage(small,0,0,smallW,smallH,0,0,w,h);
    return out;
  }

  // natRect 영역에 대해 현재 shape/mode/intensity 기준으로 처리된 결과 조각을 계산만 하고,
  // 원본 rasterCanvas에는 아직 반영하지 않는다 (실시간 미리보기/재조정을 위해 분리).
  // 가림 효과의 모든 값은 인자로 받는다. 렌더 중 전역 편집 상태를 바꾸지 않는다.
  function computeEffectRegion(natRect, shape, mode, rotation, options){
    rotation=rotation||0;
    const effectIntensity = options && Number.isFinite(options.intensity) ? options.intensity : intensity;
    const effectFeather = options && Number.isFinite(options.feather) ? options.feather : feather;
    const radiusOrBlock = mode==="blur" ? blurRadiusNatural(natRect, effectIntensity) : mosaicBlockNatural(natRect, effectIntensity);
    const base = Math.max(8, Math.min(natRect.w, natRect.h));
    const ft = clamp(effectFeather/100,0,1);
    // 페더는 익명화 강도를 낮추지 않고 가장자리 전환 폭만 넓힌다.
    // 기존 값은 변화가 너무 미세해 얼굴 타원의 경계가 보였으므로,
    // 블러는 최대 20%, 모자이크는 최대 7%까지 넓게 퍼지도록 조정한다.
    const featherRatio = mode==="mosaic"
      ? (0.07 * (1 - 0.55 * (1-clamp((base*referenceFitScale-24)/96,0,1))))
      : 0.20;
    const featherPx = effectFeather>0 ? base * featherRatio * Math.pow(ft,1.05) : 0;
    const pad = Math.ceil((mode==="blur" ? radiusOrBlock*2.6 : 2) + featherPx*2 + 8);
    const center={x:natRect.x+natRect.w/2,y:natRect.y+natRect.h/2};
    const corners=[[natRect.x,natRect.y],[natRect.x+natRect.w,natRect.y],[natRect.x+natRect.w,natRect.y+natRect.h],[natRect.x,natRect.y+natRect.h]].map(([x,y])=>rotatePoint({x,y},center,rotation));
    const bx1=Math.min(...corners.map(p=>p.x)),by1=Math.min(...corners.map(p=>p.y));
    const bx2=Math.max(...corners.map(p=>p.x)),by2=Math.max(...corners.map(p=>p.y));
    const sx = clamp(Math.floor(bx1-pad),0,naturalW);
    const sy = clamp(Math.floor(by1-pad),0,naturalH);
    const ex = clamp(Math.ceil(bx2+pad),0,naturalW);
    const ey = clamp(Math.ceil(by2+pad),0,naturalH);
    const sw = Math.max(1, ex-sx), sh = Math.max(1, ey-sy);

    const src = document.createElement("canvas"); src.width=sw; src.height=sh;
    const sctx = src.getContext("2d");
    sctx.drawImage(rasterCanvas, sx,sy,sw,sh, 0,0,sw,sh);

    let processed;
    if(mode==="blur"){
      processed = anonymizeBlurCanvas(src, radiusOrBlock, effectIntensity);
    } else {
      processed = privacyMosaicCanvas(src, radiusOrBlock, effectIntensity);
    }

    // 마스크 생성 (선택 영역 모양 + 블러는 가장자리 페더)
    const mask = document.createElement("canvas"); mask.width=sw; mask.height=sh;
    const mctx = mask.getContext("2d");
    const rx0 = natRect.x-sx, ry0 = natRect.y-sy;
    mctx.fillStyle = "#fff";
    mctx.save();
    mctx.translate(center.x-sx,center.y-sy);
    mctx.rotate(rotation);
    if(shape==="ellipse"){
      // 얼굴 중앙은 항상 100% 효과. 페더는 외곽의 얇은 링에서만 작동한다.
      // 타원은 원형 radialGradient를 비율 변환해서 정확한 타원 그라데이션으로 만든다.
      const rx=Math.max(1,natRect.w/2), ry=Math.max(1,natRect.h/2);
      const edgeFrac = featherPx>0 ? clamp(featherPx/Math.max(1,Math.min(rx,ry)),0.02,0.45) : 0;
      mctx.save();mctx.scale(rx,ry);
      if(edgeFrac>0){
        const g=mctx.createRadialGradient(0,0,0,0,0,1);
        g.addColorStop(0,"rgba(255,255,255,1)");
        g.addColorStop(Math.max(0,1-edgeFrac),"rgba(255,255,255,1)");
        g.addColorStop(1,"rgba(255,255,255,0)");
        mctx.fillStyle=g;
      }
      mctx.beginPath(); mctx.arc(0,0,1,0,Math.PI*2); mctx.fill();
      mctx.restore();
    } else {
      mctx.fillRect(-natRect.w/2,-natRect.h/2,natRect.w,natRect.h);
    }
    mctx.restore();
    let finalMask = mask;
    // 사각형만 기존 방식의 좁은 경계 페더를 사용한다. 타원은 위에서 불투명 중심을 보장했다.
    if(shape!=="ellipse" && featherPx>0.5){
      const fm=document.createElement("canvas"); fm.width=sw; fm.height=sh;
      const fctx=fm.getContext("2d");
      if("filter" in fctx){
        fctx.filter=`blur(${featherPx}px)`; fctx.drawImage(mask,0,0); fctx.filter="none"; finalMask=fm;
      }else finalMask=boxBlurCanvas(mask, featherPx);
    }

    const pctx = processed.getContext("2d");
    pctx.globalCompositeOperation = "destination-in";
    pctx.drawImage(finalMask,0,0);
    pctx.globalCompositeOperation = "source-over";

    return { canvas: processed, sx, sy };
  }

  // 가림 결과 캐시: 블러/모자이크는 픽셀 연산이라 비싸므로, 효과의 위치·크기·설정이
  // 바뀌었을 때만 다시 계산한다. 화살표 이동이나 선택 변경 같은 일반 redraw에서는 재사용한다.
  const effectCache = new Map(); // effect id -> {key, result}
  function effectCacheKey(eff){
    return JSON.stringify([eff.rect, eff.faceRects, eff.autoFace, eff.shape, eff.mode, eff.rotation||0, eff.intensity, eff.feather, naturalW, naturalH]);
  }
  function renderEffectObject(eff){
    const key = effectCacheKey(eff);
    const hit = effectCache.get(eff.id);
    if(hit && hit.key===key) return hit.result;
    const result = renderEffectObjectUncached(eff);
    effectCache.set(eff.id, {key, result});
    // 삭제되었거나 되돌리기로 사라진 효과의 캐시는 정리한다.
    if(effectCache.size > effects.length + 4){
      const alive = new Set(effects.map(e=>e.id));
      for(const id of effectCache.keys()) if(!alive.has(id)) effectCache.delete(id);
    }
    return result;
  }
  function renderEffectObjectUncached(eff){
    const effectOptions={intensity:eff.intensity, feather:eff.feather};
    const rs=eff.faceRects&&eff.faceRects.length?eff.faceRects:[eff.rect];
    let result;
    if(rs.length===1){ result=computeEffectRegion(rs[0], eff.autoFace?'ellipse':eff.shape, eff.mode, eff.rotation||0, effectOptions); }
    else {
      const overlay=document.createElement('canvas'); overlay.width=naturalW; overlay.height=naturalH;
      const oc=overlay.getContext('2d'); rs.forEach(r=>{const z=computeEffectRegion(r,'ellipse',eff.mode,eff.rotation||0,effectOptions);oc.drawImage(z.canvas,z.sx,z.sy);});
      result={canvas:overlay,sx:0,sy:0};
    }
    return result;
  }

  // ---------------- keyboard shortcuts ----------------
  function handleEditorKeydown(e){
    const meta = e.ctrlKey || e.metaKey;
    if(meta && e.key.toLowerCase()==="o"){
      e.preventDefault();
      openImagePicker();
      return;
    }
    if(meta && !e.shiftKey && e.key.toLowerCase()==="z"){
      e.preventDefault(); undo(); return;
    }
    if(meta && e.shiftKey && e.key.toLowerCase()==="z"){
      e.preventDefault(); redo(); return;
    }
    if((e.key==="Delete" || e.key==="Backspace") && selectedId!=null){
      const tag = document.activeElement && document.activeElement.tagName;
      if(tag==="INPUT" || tag==="SELECT") return;
      e.preventDefault();
      deleteSelected();
      return;
    }
    if(e.key==="Escape"){
      if(!lineToolMenu.hidden){ closeLineMenu(); lineMenuButton.focus(); return; }
      if(drag){ drag=null; redraw(); return; }
      if(selectedId!=null){ selectedId=null; buildOptionsBar(); redraw(); return; }
      if(activeTool){ setActiveTool(null); }
    }
  }
  window.addEventListener("keydown", handleEditorKeydown);

  // ---------------- save ----------------
  let sourceImageFilename = "";
  let exportSequence = 0;
  let lastExportSecond = "";
  function safeExportFilename(extension){
    const originalBase = sourceImageFilename.replace(/\.[^.]*$/, "");
    const lower = originalBase.toLowerCase();
    const clean = /^[a-z0-9_]+$/.test(lower);
    const now = new Date();
    const pad = n => String(n).padStart(2,"0");
    const second = String(now.getFullYear())+pad(now.getMonth()+1)+pad(now.getDate())+
      "_"+pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds());
    if(second===lastExportSecond) exportSequence++;
    else {lastExportSecond=second;exportSequence=0;}
    // Always add a per-save suffix so even an unchanged source name is collision-resistant.
    const suffix = "_" + second + "_" + String(exportSequence).padStart(2,"0");
    return (clean ? lower : "marking") + suffix + "." + extension;
  }
  let claudeDownloadsPromise = null;
  function getDownloads(){
    if(!claudeDownloadsPromise){
      claudeDownloadsPromise = (window.claude && typeof window.claude.use === "function")
        ? window.claude.use("downloads").catch(()=>null)
        : Promise.resolve(null);
    }
    return claudeDownloadsPromise;
  }

  async function handleSaveClick(){
    if(!naturalW) return;
    const format = formatSelect.value;
    const outCanvas = document.createElement("canvas");
    outCanvas.width = naturalW; outCanvas.height = naturalH;
    const octx = outCanvas.getContext("2d");
    octx.drawImage(rasterCanvas,0,0);
    effects.forEach(eff=>{ const r=renderEffectObject(eff); if(r&&r.canvas) octx.drawImage(r.canvas,r.sx,r.sy); });
    objects.forEach(o=> drawObjectOnCtx(octx, o, 1));

    const mime = format==="png" ? "image/png" : "image/jpeg";
    const quality = format==="png" ? undefined : 0.92;
    const ext = format==="png" ? "png" : "jpg";
    const filename = safeExportFilename(ext);

    outCanvas.toBlob(async (blob)=>{
      if(!blob){ showToast("저장에 실패했습니다."); return; }
      // On iOS/Android prefer the system share sheet with Save Image / Save to Files.
      if(window.matchMedia('(max-width:640px)').matches && navigator.share && navigator.canShare){
        try{
          const file=new File([blob],filename,{type:mime});
          if(navigator.canShare({files:[file]})){
            await navigator.share({files:[file]});
            showToast('저장 또는 공유할 위치를 선택하세요.');
            return;
          }
        }catch(err){
          if(err && err.name==='AbortError')return;
          // Share failed or unsupported: fall through to browser download.
        }
      }
      const downloads = await getDownloads();
      if(!downloads){
        // Claude 아티팩트 환경이 아닐 때(예: 독립 실행, GitHub Pages)는
        // 표준 브라우저 다운로드 방식으로 저장한다.
        try{
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(()=>URL.revokeObjectURL(url), 5000);
          showToast("저장되었습니다.");
        }catch(err){
          showToast("저장할 수 없습니다.");
        }
        return;
      }
      try{
        const res = await downloads.save({ filename, data: blob });
        if(res && res.status==="saved"){ showToast("저장되었습니다."); }
        else { showToast("전달되었습니다."); }
      }catch(err){
        const code = err && err.code;
        if(code==="declined"){ /* 조용히 무시 */ }
        else if(code==="too_large"){ showToast("파일이 너무 큽니다."); }
        else if(code==="rate_limited"){ showToast("잠시 후 다시 시도해주세요."); }
        else { showToast("저장할 수 없습니다."); }
      }
    }, mime, quality);
  }

    closeSaveFormatMenu();optionsBar.classList.remove('mobile-menu-suspended');
  }));
  document.addEventListener('pointerdown',e=>{
    if(!saveFormatMenu.hidden&&!saveFormatMenu.contains(e.target)&&!saveFormatWrap.contains(e.target)){
      closeSaveFormatMenu();optionsBar.classList.remove('mobile-menu-suspended');
    }
  });
  window.addEventListener('resize',()=>{if(!saveFormatMenu.hidden)positionReplacementMenu(saveFormatMenu);},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!saveFormatMenu.hidden){closeSaveFormatMenu();saveFormatWrap.focus();e.stopImmediatePropagation();}},true);
  btnSave.addEventListener("click", handleSaveClick);

  // ---------------- init ----------------
  fitCanvas();
})();
</script>
</body>
</html>
