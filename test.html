<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="마킹 테스트">
<meta name="theme-color" content="#1c1c1e">
<link rel="manifest" href="./marking-test.webmanifest">
<title>마킹 — 테스트 모바일 서브툴바 정돈</title>

<style>
  :root{
    --bg-1:#e9edf5;
    --bg-2:#dfe6f5;
    --bg-3:#eef1fb;
    --ink:#1b2233;
    --ink-soft:#5b6478;
    --ink-faint:#8a92a3;
    --accent:#0a6cff;
    --accent-ink:#ffffff;
    --accent-soft:rgba(10,108,255,0.12);
    --glass:rgba(255,255,255,0.58);
    --glass-strong:rgba(255,255,255,0.78);
    --glass-border:rgba(255,255,255,0.75);
    --glass-shadow:rgba(31,41,64,0.14);
    --chip-bg:rgba(255,255,255,0.55);
    --chip-border:rgba(27,34,51,0.10);
    --danger:#ff453a;
    --radius-lg:24px;
    --radius-md:16px;
    --radius-sm:12px;
    --canvas-bg:#1c1c1e;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-1:#14151c; --bg-2:#1b1f2e; --bg-3:#101319;
      --ink:#eef0f6; --ink-soft:#a7adbd; --ink-faint:#6b7182;
      --accent:#3d8bff; --accent-soft:rgba(61,139,255,0.18);
      --glass:rgba(36,40,54,0.55); --glass-strong:rgba(40,44,58,0.78);
      --glass-border:rgba(255,255,255,0.08); --glass-shadow:rgba(0,0,0,0.4);
      --chip-bg:rgba(255,255,255,0.07); --chip-border:rgba(255,255,255,0.10);
      --canvas-bg:#1c1c1e;
    }
  }
  :root[data-theme="dark"]{
    --bg-1:#14151c; --bg-2:#1b1f2e; --bg-3:#101319;
    --ink:#eef0f6; --ink-soft:#a7adbd; --ink-faint:#6b7182;
    --accent:#3d8bff; --accent-soft:rgba(61,139,255,0.18);
    --glass:rgba(36,40,54,0.55); --glass-strong:rgba(40,44,58,0.78);
    --glass-border:rgba(255,255,255,0.08); --glass-shadow:rgba(0,0,0,0.4);
    --chip-bg:rgba(255,255,255,0.07); --chip-border:rgba(255,255,255,0.10);
    --canvas-bg:#1c1c1e;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    touch-action:none;
    background:var(--canvas-bg);
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  #app, #app *{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  #app{
    position:relative;
    touch-action:none;
    height:100%;
    overflow:hidden;
    padding-left:var(--safe-l);
    padding-right:var(--safe-r);
  }

  /* ---------- floating glass chrome ---------- */
  #chrome{
    position:absolute;
    top:calc(12px + var(--safe-t));
    left:12px;
    right:12px;
    z-index:20;
    display:flex;
    flex-direction:column;
    gap:8px;
    pointer-events:none;
  }
  #toolbar, #options-bar{ pointer-events:auto; }
  button, select, input, label{ touch-action:manipulation; }

  #toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    background:linear-gradient(135deg, rgba(255,255,255,.72), rgba(255,255,255,.48));
    backdrop-filter:blur(28px) saturate(190%);
    -webkit-backdrop-filter:blur(28px) saturate(190%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-lg);
    box-shadow:0 12px 34px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.55);
    overflow-x:auto;
    scrollbar-width:none;
  }
  #toolbar::-webkit-scrollbar{display:none;}
  .brand{
    font-size:17px;
    font-weight:750;
    letter-spacing:-0.01em;
    white-space:nowrap;
    padding:0 8px 0 8px;
    color:var(--ink);
  }
  .tools{display:flex;align-items:center;gap:4px;flex:1;min-width:0;}
  .sep{width:1px;height:20px;background:var(--chip-border);margin:0 4px;flex:0 0 auto;}
  .tool-btn{
    display:flex;align-items:center;gap:6px;
    border:1px solid transparent;
    background:transparent;
    color:var(--ink);
    font-size:13.5px;
    font-family:inherit;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .tool-btn .glyph{font-size:14px;line-height:1;}
  .tool-btn:hover{background:var(--chip-bg);border-color:var(--chip-border);}
  .tool-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .icon-btn{
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--chip-border);
    background:var(--chip-bg);
    color:var(--ink-soft);
    font-size:15px;
    border-radius:50%;
    cursor:pointer;
    flex:0 0 auto;
  }
  .icon-btn:hover{background:var(--accent-soft);color:var(--accent);}
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn:disabled{opacity:.32;cursor:default;}
  .icon-btn:disabled:hover{background:var(--chip-bg);color:var(--ink-soft);}

  /* 상단 툴바는 다크모드에서도 밝은 Liquid Glass를 쓰므로
     아이콘/텍스트 색은 시스템 테마와 분리해 충분한 대비를 유지한다. */
  #toolbar .tool-btn:not(.active){color:#20283a;}
  #toolbar .icon-btn{
    color:#344054;
    background:rgba(255,255,255,.52);
    border-color:rgba(31,41,55,.12);
  }
  #toolbar .icon-btn:hover:not(:disabled){
    color:#0a6cff;
    background:rgba(10,108,255,.10);
    border-color:rgba(10,108,255,.18);
  }
  #toolbar .icon-btn:disabled{
    opacity:1;
    color:rgba(32,40,58,.28);
    background:rgba(255,255,255,.22);
    border-color:rgba(32,40,58,.07);
  }
  #toolbar .icon-btn:disabled:hover{
    color:rgba(32,40,58,.28);
    background:rgba(255,255,255,.22);
  }
  #toolbar #btn-clear-photo:not(:disabled){
    color:#fff;
    background:#ff453a;
    border-color:rgba(180,28,22,.22);
    box-shadow:0 5px 14px rgba(255,69,58,.28), inset 0 1px 0 rgba(255,255,255,.28);
  }
  #toolbar #btn-clear-photo:hover:not(:disabled){
    color:#fff;
    background:#e83b32;
    border-color:rgba(180,28,22,.30);
    box-shadow:0 6px 16px rgba(255,69,58,.34), inset 0 1px 0 rgba(255,255,255,.24);
  }
  #toolbar #btn-clear-photo:not(:disabled) svg{
    width:18px;
    height:18px;
    stroke-width:2;
  }
  #toolbar #format-select{color:#20283a;background:rgba(255,255,255,.52);}
  .save-group{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  #format-select{
    border:1px solid var(--chip-border);
    background:var(--chip-bg);
    color:var(--ink);
    font-size:13px;
    font-family:inherit;
    padding:7px 9px;
    border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .save-btn{
    border:none;
    background:linear-gradient(135deg, var(--accent), #5aa2ff);
    color:#fff;
    font-size:13.5px;
    font-weight:650;
    font-family:inherit;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 8px 20px rgba(10,108,255,0.30);
  }
  .save-btn:hover{filter:brightness(1.05);}
  .save-btn:disabled{opacity:.35;cursor:default;filter:none;box-shadow:none;}
  .save-btn:active{transform:scale(0.98);}

  /* ---------- options bar ---------- */
  #options-bar{
    display:flex;
    align-items:center;
    gap:18px;
    padding:9px 16px;
    background:var(--glass);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-md);
    box-shadow:0 8px 22px var(--glass-shadow);
    font-size:12.5px;
    color:var(--ink-soft);
    overflow-x:auto;
    scrollbar-width:none;
  }
  #options-bar::-webkit-scrollbar{display:none;}
  #options-bar.hidden{display:none;}
  .opt-group{display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .seg{
    display:flex;
    background:var(--chip-bg);
    border:1px solid var(--chip-border);
    border-radius:var(--radius-sm);
    padding:3px;
    gap:3px;
  }
  .seg button{
    border:none;background:transparent;color:var(--ink-soft);
    font-family:inherit;font-size:12.5px;font-weight:600;
    padding:6px 12px;cursor:pointer;
    border-radius:9px;
  }
  .seg button.active{background:var(--accent);color:var(--accent-ink);}
  input[type="range"]{
    -webkit-appearance:none;appearance:none;
    width:110px;height:3px;border-radius:2px;
    background:var(--chip-border);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    border:2px solid var(--glass-strong);
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  input[type="range"]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:2px solid var(--glass-strong);
  }
  input[type="color"]{
    -webkit-appearance:none;appearance:none;
    width:26px;height:26px;
    padding:0;
    border:1px solid var(--chip-border);
    border-radius:var(--radius-sm);
    cursor:pointer;
    background:none;
  }
  input[type="color"]::-webkit-color-swatch-wrapper{padding:3px;}
  input[type="color"]::-webkit-color-swatch{border:none;border-radius:8px;}
  input[type="color"]::-moz-color-swatch{border:none;border-radius:8px;}
  .check-opt{cursor:pointer;}
  .check-opt input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;}

  /* ---------- work area ---------- */
  #workarea{
    position:absolute;
    inset:0;
    background:var(--canvas-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:none;
  }
  #placeholder{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    color:#8a8a90;
    cursor:pointer;
  }
  #placeholder .ph-icon{
    width:56px;height:56px;border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:1.5px solid rgba(255,255,255,0.18);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#b7b7bc;
    font-family:inherit;
    -webkit-appearance:none;appearance:none;
    cursor:pointer;
    touch-action:manipulation;
  }
  /* The empty-state copy is instructional, never selectable or draggable. */
  #placeholder, #placeholder p, #placeholder .ph-sub{
    -webkit-user-select:none!important;user-select:none!important;
    -webkit-touch-callout:none;-webkit-user-drag:none;
  }
  #placeholder p{pointer-events:none;}
  #placeholder p{margin:0;font-size:14px;letter-spacing:.2px;}
  #placeholder .ph-sub{margin:0;font-size:12.5px;color:#6f6f76;letter-spacing:.1px;}
  @media(max-width:640px){
    #placeholder{cursor:default;}
    #placeholder .ph-instruction{pointer-events:none;}
    #placeholder .ph-icon{cursor:pointer;}
  }
  #placeholder.hidden{display:none;}
  #placeholder.dragover .ph-icon{border-color:var(--accent);color:var(--accent);background:rgba(61,139,255,0.10);}
  #placeholder.dragover p{color:var(--accent);}

  #view-canvas{
    display:none;
    touch-action:none;
    max-width:100%;
    max-height:100%;
  }
  #view-canvas.ready{display:block;}

  #toast{
    position:absolute;
    bottom:calc(24px + var(--safe-b));
    left:50%;
    transform:translateX(-50%) translateY(6px);
    background:rgba(20,22,30,0.9);
    color:#fff;
    font-size:13px;
    font-weight:600;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    white-space:nowrap;
    z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .glyph{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;line-height:0;}
  .glyph svg,.icon-btn svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .icon-btn svg{width:18px;height:18px;}

  /* ---------- desktop: toolbar + tool options in one glass row ---------- */
  @media (min-width:641px){
    #chrome{gap:0;}
    #toolbar{overflow-x:auto;}
    #toolbar #options-bar{
      flex:0 1 auto;
      min-width:0;
      gap:12px;
      padding:0 4px;
      margin-left:2px;
      background:transparent;
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
      border:0;
      border-radius:0;
      box-shadow:none;
      overflow:visible;
    }
    #toolbar #options-bar:not(.hidden){display:flex;}
    #toolbar #options-bar .opt-group{gap:6px;}
    #toolbar #options-bar .seg{padding:2px;gap:2px;}
    #toolbar #options-bar .seg button{padding:5px 9px;font-size:12px;}
    #toolbar #options-bar input[type="range"]{width:86px;}
    #toolbar .save-group{margin-left:auto;}
  }

  @media (max-width:640px){
    #chrome{top:calc(6px + var(--safe-t));left:6px;right:6px;gap:4px;}
    .brand{display:none;}
    #toolbar{gap:4px;padding:5px 6px;border-radius:20px;}
    .tools{gap:1px;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
    .tools::-webkit-scrollbar{display:none;}
    .tools>.tool-btn{flex:1 1 28px;min-width:28px;padding:6px 4px;font-size:12px;}
    .tool-btn .label{display:none;}
    .tools>.icon-btn{flex:0 1 30px;min-width:28px;width:30px;height:30px;}
    .tools>.sep{flex:0 0 1px;margin:0 1px;}
    #toolbar{gap:3px;}
    .save-group{gap:5px;flex:0 0 auto;}
    #format-select{padding:6px 7px;font-size:12px;}
    .save-btn{padding:7px 12px;font-size:12.5px;}
    #options-bar{gap:3px;padding:6px 5px;border-radius:14px;font-size:10px;width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;}
    #options-bar .opt-group{gap:3px;flex:0 1 auto;min-width:0;}
    #options-bar .seg{padding:2px;gap:1px;flex:0 0 auto;}
    #options-bar .seg button{padding:5px 5px;font-size:10px;white-space:nowrap;}
    #options-bar input[type="range"]{width:36px;min-width:28px;max-width:42px;flex:1 1 36px;}
    #options-bar .opt-group>span{white-space:nowrap;}
  }
  /* ---------- footer notice ---------- */
  #footer-note{
    position:absolute;
    left:50%;
    bottom:calc(10px + var(--safe-b));
    transform:translateX(-50%);
    z-index:12;
    width:min(94vw, 980px);
    text-align:center;
    color:rgba(255,255,255,.50);
    font-size:10.5px;
    line-height:1.55;
    letter-spacing:-.01em;
    pointer-events:none;
  }
  #footer-note .guide{margin-bottom:2px;}
  #footer-note .shortcut{color:rgba(255,255,255,.40);}
  #footer-note .privacy{margin-top:2px;color:rgba(255,255,255,.40);}
  #footer-note .copyright{color:rgba(255,255,255,.30);}
  /* Wide desktop: keep the controls together instead of stretching them edge-to-edge.
     Medium/tablet layouts keep the flexible behavior above so nothing gets crushed. */
  @media (min-width:900px){
    #toolbar{
      justify-content:center;
    }
    #toolbar .tools{
      flex:0 0 auto;
      min-width:max-content;
    }
    #toolbar #options-bar{
      flex:0 1 auto;
    }
    #toolbar .save-group{
      margin-left:8px;
      flex:0 0 auto;
    }
  }

  @media (max-width:640px){
    #footer-note{bottom:calc(6px + var(--safe-b));font-size:9.5px;line-height:1.45;width:96vw;}
    #footer-note .desktop-guide{display:none;}
  }


  /* ===== Phase 1: responsive layout stabilization (visual theme unchanged) ===== */
  :root { --editor-top: 84px; --editor-bottom: 0px; }
  #workarea { top:var(--editor-top); bottom:var(--editor-bottom); }
  #chrome { min-width:0; }
  #toolbar { min-width:0; max-width:100%; }
  #options-bar { min-width:0; max-width:100%; }
  #options-bar .opt-group { flex-shrink:0; }
  #options-bar .seg button { min-height:34px; }
  @media (min-width:641px) {
    #chrome { gap:8px; }
    #toolbar { overflow-x:auto; overflow-y:hidden; justify-content:flex-start; }
    #toolbar .tools { flex:0 0 auto; min-width:max-content; }
    #toolbar .save-group { margin-left:auto; }
    #options-bar { width:max-content; max-width:100%; overflow-x:auto; overflow-y:hidden; }
    #options-bar input[type="range"] { width:110px; }
  }
  @media (max-width:640px) {
    #chrome {
      top:auto;
      bottom:calc(8px + var(--safe-b));
      left:calc(8px + var(--safe-l));
      right:calc(8px + var(--safe-r));
      gap:6px;
      flex-direction:column-reverse;
    }
    #toolbar {
      display:grid;
      grid-template-columns:minmax(0,1fr);
      gap:5px;
      padding:7px;
      overflow:visible;
      border-radius:20px;
    }
    #toolbar .tools {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr)) repeat(3,44px);
      gap:3px;
      width:100%;
      min-width:0;
      overflow:visible;
      align-items:center;
    }
    #toolbar .tools > .tool-btn {
      display:flex;
      justify-content:center;
      align-items:center;
      width:100%;
      min-width:0;
      min-height:44px;
      padding:8px 0;
    }
    #toolbar .tools > .icon-btn {
      width:44px;
      height:44px;
      min-width:44px;
      justify-self:center;
    }
    #toolbar .tools > .sep { display:none; }
    #toolbar .save-group {
      display:flex;
      justify-content:flex-end;
      gap:8px;
      width:100%;
      min-width:0;
    }
    #toolbar #format-select { min-height:40px; padding:8px 12px; }
    #toolbar .save-btn { min-height:40px; padding:8px 20px; }
    #options-bar {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      gap:7px 10px;
      width:100%;
      max-width:100%;
      max-height:min(38dvh,190px);
      overflow-x:hidden;
      overflow-y:auto;
      touch-action:pan-y;
      overscroll-behavior:contain;
      padding:9px 10px;
      font-size:12px;
    }
    #options-bar.hidden { display:none; }
    #options-bar .opt-group { flex:0 0 auto; gap:6px; min-width:0; }
    #options-bar .seg button { font-size:12px; padding:7px 10px; min-height:36px; }
    #options-bar input[type="range"] {
      width:clamp(84px,24vw,132px);
      min-width:84px;
      max-width:132px;
      height:4px;
      flex:0 0 auto;
    }
    #options-bar input[type="color"] { width:34px; height:34px; }
    #footer-note { display:none; }
  }
  @media (max-width:390px) {
    #toolbar .tools { grid-template-columns:repeat(4,minmax(0,1fr)); }
    #toolbar .tools > .icon-btn { width:100%; }
    #toolbar .tools > #btn-undo { grid-column:1; }
    #toolbar .tools > #btn-redo { grid-column:2; }
    #toolbar .tools > #btn-clear-photo { grid-column:3; }
  }
  /* Slider drag stability: numeric labels must not change flex widths at 9→10→100. */
  #options-bar .effect-value-label {
    display:inline-block;
    flex:0 0 7.5ch;
    width:7.5ch;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  #options-bar .opt-group > input[type="range"] { flex-shrink:0; }
  #toolbar, #options-bar { overflow-anchor:none; }
  @media (min-width:641px) {
    #options-bar .effect-value-label { flex-basis:7.5ch; }
  }
  @media (prefers-reduced-motion:reduce) {
    #toolbar *, #options-bar * { transition:none !important; }
  }

  /* Stable save controls and keyboard-visible focus across browsers. */
  .save-group{align-items:center;min-width:max-content;}

        <button class="tool-btn" data-tool="circle" id="btn-circle"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3"/></svg></span><span class="label">도형</span></button>
        <div class="line-tool-combo" id="line-tool-combo" role="group" aria-label="선 도구">
          <button class="tool-btn" data-tool="arrow" id="btn-arrow" aria-label="화살표 도구" title="화살표 도구"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13"/><path d="m14 7 5 5-5 5"/></svg></span><span class="label">화살표</span></button>
          <button class="line-tool-chevron" id="btn-line-menu" type="button" aria-label="선 도구 종류 선택" aria-haspopup="menu" aria-expanded="false" aria-controls="line-tool-menu"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
        </div>
        </div><div class="toolbar-history">
        <button class="icon-btn" id="btn-undo" title="실행 취소 (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7-4 4 4 4M5 11h8a6 6 0 0 1 6 6"/></svg></button>
        <button class="icon-btn" id="btn-redo" title="다시 실행 (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 4 4-4 4M19 11h-8a6 6 0 0 0-6 6"/></svg></button>
        </div><div class="toolbar-delete"><button class="icon-btn" id="btn-clear-photo" title="사진 삭제" aria-label="사진 삭제" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9 7V5.5h6V7M7 7l.8 12h8.4L17 7M10 10.5v5M14 10.5v5"/></svg></button>
        </div>
      </div>
      <div class="save-group" role="group" aria-label="사진 저장">
        <button class="save-btn" id="btn-save" disabled>저장</button>
        <label class="save-format-wrap" aria-label="저장 형식">
          <select id="format-select" aria-label="저장 형식">
            <option value="jpeg">JPG</option>
            <option value="png">PNG</option>
          </select>
          <svg class="save-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </label>
      </div>
    </header>

    <div id="options-bar" class="hidden"></div>
  </div>

  <div id="save-format-menu" class="save-format-menu" role="menu" aria-label="저장 형식 선택" hidden><button type="button" role="menuitemradio" data-format="jpeg">JPG <span class="save-menu-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button><button type="button" role="menuitemradio" data-format="png">PNG <span class="save-menu-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></div>
  <main id="workarea">
    <div id="placeholder">
      <button class="ph-icon" id="btn-pick-photo" type="button" aria-label="사진 선택">＋</button>

  </div>

  <input accept="image/*" hidden id="fileInput" multiple type="file">
</div>
