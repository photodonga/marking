<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="마킹 테스트">
<meta name="theme-color" content="#1c1c1e">
<link rel="manifest" href="./marking-test.webmanifest">
<title>마킹 — 테스트 모바일 서브툴바 정돈</title>

<style>
  :root{
    --bg-1:#e9edf5;
    --bg-2:#dfe6f5;
    --bg-3:#eef1fb;
    --ink:#1b2233;
    --ink-soft:#5b6478;
    --ink-faint:#8a92a3;
    --accent:#0a6cff;
    --accent-ink:#ffffff;
    --accent-soft:rgba(10,108,255,0.12);
    --glass:rgba(255,255,255,0.58);
    --glass-strong:rgba(255,255,255,0.78);
    --glass-border:rgba(255,255,255,0.75);
    --glass-shadow:rgba(31,41,64,0.14);
    --chip-bg:rgba(255,255,255,0.55);
    --chip-border:rgba(27,34,51,0.10);
    --danger:#ff453a;
    --radius-lg:24px;
    --radius-md:16px;
    --radius-sm:12px;
    --canvas-bg:#1c1c1e;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-1:#14151c; --bg-2:#1b1f2e; --bg-3:#101319;
      --ink:#eef0f6; --ink-soft:#a7adbd; --ink-faint:#6b7182;
      --accent:#3d8bff; --accent-soft:rgba(61,139,255,0.18);
      --glass:rgba(36,40,54,0.55); --glass-strong:rgba(40,44,58,0.78);
      --glass-border:rgba(255,255,255,0.08); --glass-shadow:rgba(0,0,0,0.4);
      --chip-bg:rgba(255,255,255,0.07); --chip-border:rgba(255,255,255,0.10);
      --canvas-bg:#1c1c1e;
    }
  }
  :root[data-theme="dark"]{
    --bg-1:#14151c; --bg-2:#1b1f2e; --bg-3:#101319;
    --ink:#eef0f6; --ink-soft:#a7adbd; --ink-faint:#6b7182;
    --accent:#3d8bff; --accent-soft:rgba(61,139,255,0.18);
    --glass:rgba(36,40,54,0.55); --glass-strong:rgba(40,44,58,0.78);
    --glass-border:rgba(255,255,255,0.08); --glass-shadow:rgba(0,0,0,0.4);
    --chip-bg:rgba(255,255,255,0.07); --chip-border:rgba(255,255,255,0.10);
    --canvas-bg:#1c1c1e;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    touch-action:none;
    background:var(--canvas-bg);
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  #app, #app *{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  #app{
    position:relative;
    touch-action:none;
    height:100%;
    overflow:hidden;
    padding-left:var(--safe-l);
    padding-right:var(--safe-r);
  }

  /* ---------- floating glass chrome ---------- */
  #chrome{
    position:absolute;
    top:calc(12px + var(--safe-t));
    left:12px;
    right:12px;
    z-index:20;
    display:flex;
    flex-direction:column;
    gap:8px;
    pointer-events:none;
  }
  #toolbar, #options-bar{ pointer-events:auto; }
  button, select, input, label{ touch-action:manipulation; }

  #toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    background:linear-gradient(135deg, rgba(255,255,255,.72), rgba(255,255,255,.48));
    backdrop-filter:blur(28px) saturate(190%);
    -webkit-backdrop-filter:blur(28px) saturate(190%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-lg);
    box-shadow:0 12px 34px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.55);
    overflow-x:auto;
    scrollbar-width:none;
  }
  #toolbar::-webkit-scrollbar{display:none;}
  .brand{
    font-size:17px;
    font-weight:750;
    letter-spacing:-0.01em;
    white-space:nowrap;
    padding:0 8px 0 8px;
    color:var(--ink);
  }
  .tools{display:flex;align-items:center;gap:4px;flex:1;min-width:0;}
  .sep{width:1px;height:20px;background:var(--chip-border);margin:0 4px;flex:0 0 auto;}
  .tool-btn{
    display:flex;align-items:center;gap:6px;
    border:1px solid transparent;
    background:transparent;
    color:var(--ink);
    font-size:13.5px;
    font-family:inherit;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .tool-btn .glyph{font-size:14px;line-height:1;}
  .tool-btn:hover{background:var(--chip-bg);border-color:var(--chip-border);}
  .tool-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .icon-btn{
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--chip-border);
    background:var(--chip-bg);
    color:var(--ink-soft);
    font-size:15px;
    border-radius:50%;
    cursor:pointer;
    flex:0 0 auto;
  }
  .icon-btn:hover{background:var(--accent-soft);color:var(--accent);}
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn:disabled{opacity:.32;cursor:default;}
  .icon-btn:disabled:hover{background:var(--chip-bg);color:var(--ink-soft);}

  /* 상단 툴바는 다크모드에서도 밝은 Liquid Glass를 쓰므로
     아이콘/텍스트 색은 시스템 테마와 분리해 충분한 대비를 유지한다. */
  #toolbar .tool-btn:not(.active){color:#20283a;}
  #toolbar .icon-btn{
    color:#344054;
    background:rgba(255,255,255,.52);
    border-color:rgba(31,41,55,.12);
  }
  #toolbar .icon-btn:hover:not(:disabled){
    color:#0a6cff;
    background:rgba(10,108,255,.10);
    border-color:rgba(10,108,255,.18);
  }
  #toolbar .icon-btn:disabled{
    opacity:1;
    color:rgba(32,40,58,.28);
    background:rgba(255,255,255,.22);
    border-color:rgba(32,40,58,.07);
  }
  #toolbar .icon-btn:disabled:hover{
    color:rgba(32,40,58,.28);
    background:rgba(255,255,255,.22);
  }
  #toolbar #btn-clear-photo:not(:disabled){
    color:#fff;
    background:#ff453a;
    border-color:rgba(180,28,22,.22);
    box-shadow:0 5px 14px rgba(255,69,58,.28), inset 0 1px 0 rgba(255,255,255,.28);
  }
  #toolbar #btn-clear-photo:hover:not(:disabled){
    color:#fff;
    background:#e83b32;
    border-color:rgba(180,28,22,.30);
    box-shadow:0 6px 16px rgba(255,69,58,.34), inset 0 1px 0 rgba(255,255,255,.24);
  }
  #toolbar #btn-clear-photo:not(:disabled) svg{
    width:18px;
    height:18px;
    stroke-width:2;
  }
  #toolbar #format-select{color:#20283a;background:rgba(255,255,255,.52);}
  .save-group{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  #format-select{
    border:1px solid var(--chip-border);
    background:var(--chip-bg);
    color:var(--ink);
    font-size:13px;
    font-family:inherit;
    padding:7px 9px;
    border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .save-btn{
    border:none;
    background:linear-gradient(135deg, var(--accent), #5aa2ff);
    color:#fff;
    font-size:13.5px;
    font-weight:650;
    font-family:inherit;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 8px 20px rgba(10,108,255,0.30);
  }
  .save-btn:hover{filter:brightness(1.05);}
  .save-btn:disabled{opacity:.35;cursor:default;filter:none;box-shadow:none;}
  .save-btn:active{transform:scale(0.98);}

  /* ---------- options bar ---------- */
  #options-bar{
    display:flex;
    align-items:center;
    gap:18px;
    padding:9px 16px;
    background:var(--glass);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-md);
    box-shadow:0 8px 22px var(--glass-shadow);
    font-size:12.5px;
    color:var(--ink-soft);
    overflow-x:auto;
    scrollbar-width:none;
  }
  #options-bar::-webkit-scrollbar{display:none;}
  #options-bar.hidden{display:none;}
  .opt-group{display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .seg{
    display:flex;
    background:var(--chip-bg);
    border:1px solid var(--chip-border);
    border-radius:var(--radius-sm);
    padding:3px;
    gap:3px;
  }
  .seg button{
    border:none;background:transparent;color:var(--ink-soft);
    font-family:inherit;font-size:12.5px;font-weight:600;
    padding:6px 12px;cursor:pointer;
    border-radius:9px;
  }
  .seg button.active{background:var(--accent);color:var(--accent-ink);}
  input[type="range"]{
    -webkit-appearance:none;appearance:none;
    width:110px;height:3px;border-radius:2px;
    background:var(--chip-border);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    border:2px solid var(--glass-strong);
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  input[type="range"]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:2px solid var(--glass-strong);
  }
  input[type="color"]{
    -webkit-appearance:none;appearance:none;
    width:26px;height:26px;
    padding:0;
    border:1px solid var(--chip-border);
    border-radius:var(--radius-sm);
    cursor:pointer;
    background:none;
  }
  input[type="color"]::-webkit-color-swatch-wrapper{padding:3px;}
  input[type="color"]::-webkit-color-swatch{border:none;border-radius:8px;}
  input[type="color"]::-moz-color-swatch{border:none;border-radius:8px;}
  .check-opt{cursor:pointer;}
  .check-opt input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;}

  /* ---------- work area ---------- */
  #workarea{
    position:absolute;
    inset:0;
    background:var(--canvas-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:none;
  }
  #placeholder{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    color:#8a8a90;
    cursor:pointer;
  }
  #placeholder .ph-icon{
    width:56px;height:56px;border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:1.5px solid rgba(255,255,255,0.18);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#b7b7bc;
    font-family:inherit;
    -webkit-appearance:none;appearance:none;
    cursor:pointer;
    touch-action:manipulation;
  }
  /* The empty-state copy is instructional, never selectable or draggable. */
  #placeholder, #placeholder p, #placeholder .ph-sub{
    -webkit-user-select:none!important;user-select:none!important;
    -webkit-touch-callout:none;-webkit-user-drag:none;
  }
  #placeholder p{pointer-events:none;}
  #placeholder p{margin:0;font-size:14px;letter-spacing:.2px;}
  #placeholder .ph-sub{margin:0;font-size:12.5px;color:#6f6f76;letter-spacing:.1px;}
  @media(max-width:640px){
    #placeholder{cursor:default;}
    #placeholder .ph-instruction{pointer-events:none;}
    #placeholder .ph-icon{cursor:pointer;}
  }
  #placeholder.hidden{display:none;}
  #placeholder.dragover .ph-icon{border-color:var(--accent);color:var(--accent);background:rgba(61,139,255,0.10);}
  #placeholder.dragover p{color:var(--accent);}

  #view-canvas{
    display:none;
    touch-action:none;
    max-width:100%;
    max-height:100%;
  }
  #view-canvas.ready{display:block;}

  #toast{
    position:absolute;
    bottom:calc(24px + var(--safe-b));
    left:50%;
    transform:translateX(-50%) translateY(6px);
    background:rgba(20,22,30,0.9);
    color:#fff;
    font-size:13px;
    font-weight:600;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    white-space:nowrap;
    z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .glyph{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;line-height:0;}
  .glyph svg,.icon-btn svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .icon-btn svg{width:18px;height:18px;}

  /* ---------- desktop: toolbar + tool options in one glass row ---------- */
  @media (min-width:641px){
    #chrome{gap:0;}
    #toolbar{overflow-x:auto;}
    #toolbar #options-bar{
      flex:0 1 auto;
      min-width:0;
      gap:12px;
      padding:0 4px;
      margin-left:2px;
      background:transparent;
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
      border:0;
      border-radius:0;
      box-shadow:none;
      overflow:visible;
    }
    #toolbar #options-bar:not(.hidden){display:flex;}
    #toolbar #options-bar .opt-group{gap:6px;}
    #toolbar #options-bar .seg{padding:2px;gap:2px;}
    #toolbar #options-bar .seg button{padding:5px 9px;font-size:12px;}
    #toolbar #options-bar input[type="range"]{width:86px;}
    #toolbar .save-group{margin-left:auto;}
  }

  @media (max-width:640px){
    #chrome{top:calc(6px + var(--safe-t));left:6px;right:6px;gap:4px;}
    .brand{display:none;}
    #toolbar{gap:4px;padding:5px 6px;border-radius:20px;}
    .tools{gap:1px;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
    .tools::-webkit-scrollbar{display:none;}
    .tools>.tool-btn{flex:1 1 28px;min-width:28px;padding:6px 4px;font-size:12px;}
    .tool-btn .label{display:none;}
    .tools>.icon-btn{flex:0 1 30px;min-width:28px;width:30px;height:30px;}
    .tools>.sep{flex:0 0 1px;margin:0 1px;}
    #toolbar{gap:3px;}
    .save-group{gap:5px;flex:0 0 auto;}
    #format-select{padding:6px 7px;font-size:12px;}
    .save-btn{padding:7px 12px;font-size:12.5px;}
    #options-bar{gap:3px;padding:6px 5px;border-radius:14px;font-size:10px;width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;}
    #options-bar .opt-group{gap:3px;flex:0 1 auto;min-width:0;}
    #options-bar .seg{padding:2px;gap:1px;flex:0 0 auto;}
    #options-bar .seg button{padding:5px 5px;font-size:10px;white-space:nowrap;}
    #options-bar input[type="range"]{width:36px;min-width:28px;max-width:42px;flex:1 1 36px;}
    #options-bar .opt-group>span{white-space:nowrap;}
  }
  /* ---------- footer notice ---------- */
  #footer-note{
    position:absolute;
    left:50%;
    bottom:calc(10px + var(--safe-b));
    transform:translateX(-50%);
    z-index:12;
    width:min(94vw, 980px);
    text-align:center;
    color:rgba(255,255,255,.50);
    font-size:10.5px;
    line-height:1.55;
    letter-spacing:-.01em;
    pointer-events:none;
  }
  #footer-note .guide{margin-bottom:2px;}
  #footer-note .shortcut{color:rgba(255,255,255,.40);}
  #footer-note .privacy{margin-top:2px;color:rgba(255,255,255,.40);}
  #footer-note .copyright{color:rgba(255,255,255,.30);}
  /* Wide desktop: keep the controls together instead of stretching them edge-to-edge.
     Medium/tablet layouts keep the flexible behavior above so nothing gets crushed. */
  @media (min-width:900px){
    #toolbar{
      justify-content:center;
    }
    #toolbar .tools{
      flex:0 0 auto;
      min-width:max-content;
    }
    #toolbar #options-bar{
      flex:0 1 auto;
    }
    #toolbar .save-group{
      margin-left:8px;
      flex:0 0 auto;
    }
  }

  @media (max-width:640px){
    #footer-note{bottom:calc(6px + var(--safe-b));font-size:9.5px;line-height:1.45;width:96vw;}
    #footer-note .desktop-guide{display:none;}
  }


  /* ===== Phase 1: responsive layout stabilization (visual theme unchanged) ===== */
  :root { --editor-top: 84px; --editor-bottom: 0px; }
  #workarea { top:var(--editor-top); bottom:var(--editor-bottom); }
  #chrome { min-width:0; }
  #toolbar { min-width:0; max-width:100%; }
  #options-bar { min-width:0; max-width:100%; }
  #options-bar .opt-group { flex-shrink:0; }
  #options-bar .seg button { min-height:34px; }
  @media (min-width:641px) {
    #chrome { gap:8px; }
    #toolbar { overflow-x:auto; overflow-y:hidden; justify-content:flex-start; }
    #toolbar .tools { flex:0 0 auto; min-width:max-content; }
    #toolbar .save-group { margin-left:auto; }
    #options-bar { width:max-content; max-width:100%; overflow-x:auto; overflow-y:hidden; }
    #options-bar input[type="range"] { width:110px; }
  }
  @media (max-width:640px) {
    #chrome {
      top:auto;
      bottom:calc(8px + var(--safe-b));
      left:calc(8px + var(--safe-l));
      right:calc(8px + var(--safe-r));
      gap:6px;
      flex-direction:column-reverse;
    }
    #toolbar {
      display:grid;
      grid-template-columns:minmax(0,1fr);
      gap:5px;
      padding:7px;
      overflow:visible;
      border-radius:20px;
    }
    #toolbar .tools {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr)) repeat(3,44px);
      gap:3px;
      width:100%;
      min-width:0;
      overflow:visible;
      align-items:center;
    }
    #toolbar .tools > .tool-btn {
      display:flex;
      justify-content:center;
      align-items:center;
      width:100%;
      min-width:0;
      min-height:44px;
      padding:8px 0;
    }
    #toolbar .tools > .icon-btn {
      width:44px;
      height:44px;
      min-width:44px;
      justify-self:center;
    }
    #toolbar .tools > .sep { display:none; }
    #toolbar .save-group {
      display:flex;
      justify-content:flex-end;
      gap:8px;
      width:100%;
      min-width:0;
    }
    #toolbar #format-select { min-height:40px; padding:8px 12px; }
    #toolbar .save-btn { min-height:40px; padding:8px 20px; }
    #options-bar {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      gap:7px 10px;
      width:100%;
      max-width:100%;
      max-height:min(38dvh,190px);
      overflow-x:hidden;
      overflow-y:auto;
      touch-action:pan-y;
      overscroll-behavior:contain;
      padding:9px 10px;
      font-size:12px;
    }
    #options-bar.hidden { display:none; }
    #options-bar .opt-group { flex:0 0 auto; gap:6px; min-width:0; }
    #options-bar .seg button { font-size:12px; padding:7px 10px; min-height:36px; }
    #options-bar input[type="range"] {
      width:clamp(84px,24vw,132px);
      min-width:84px;
      max-width:132px;
      height:4px;
      flex:0 0 auto;
    }
    #options-bar input[type="color"] { width:34px; height:34px; }
    #footer-note { display:none; }
  }
  @media (max-width:390px) {
    #toolbar .tools { grid-template-columns:repeat(4,minmax(0,1fr)); }
    #toolbar .tools > .icon-btn { width:100%; }
    #toolbar .tools > #btn-undo { grid-column:1; }
    #toolbar .tools > #btn-redo { grid-column:2; }
    #toolbar .tools > #btn-clear-photo { grid-column:3; }
  }
  /* Slider drag stability: numeric labels must not change flex widths at 9→10→100. */
  #options-bar .effect-value-label {
    display:inline-block;
    flex:0 0 7.5ch;
    width:7.5ch;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  #options-bar .opt-group > input[type="range"] { flex-shrink:0; }
  #toolbar, #options-bar { overflow-anchor:none; }
  @media (min-width:641px) {
    #options-bar .effect-value-label { flex-basis:7.5ch; }
  }
  @media (prefers-reduced-motion:reduce) {
    #toolbar *, #options-bar * { transition:none !important; }
  }

  /* Stable save controls and keyboard-visible focus across browsers. */
  .save-group{align-items:center;min-width:max-content;}

  <main id="workarea">
    <div id="placeholder">
      <button class="ph-icon" id="btn-pick-photo" type="button" aria-label="사진 선택">＋</button>

    <div id="toast"></div>

    <div class="privacy">사진은 서버에 업로드되지 않고 이 기기에서만 처리됩니다.</div>

  <input accept="image/*" hidden id="fileInput" multiple type="file">
</div>

<script>
(function(){
  "use strict";

  // ---------------- constants ----------------
  const STROKE_RATIO = 0.0037;      // legacy objects only
  const STROKE_PRESETS = [[1.5,"얇게"],[2,"보통"],[3,"굵게"]];
  let referenceFitScale = 1; // frozen when a new photo is first fitted
  const HANDLE_SCREEN_SIZE = 9;      // 화면상 핸들 크기(px, 스케일 무관)
  const HIT_TOLERANCE = 10;          // 화면상 클릭 허용 오차(px)
  const MAX_HISTORY = 40;
  const DEFAULT_COLOR = "#E53935";
  const ANNOTATION_COLORS = ["#E53935", "#FFD400", "#FFFFFF", "#111111", "#1976D2"];

  // ---------------- state ----------------
  let naturalW = 0, naturalH = 0;
  let imageGeneration=0, loadGeneration=0;
  let rasterCanvas = document.createElement("canvas");
  let rasterCtx = rasterCanvas.getContext("2d");

  let objects = [];          // {id,type:'circle'|'arrow', ...coords, strokeMult}
  let effects = [];          // 비파괴 가림 효과 {id,type:'effect',rect,faceRects,autoFace,mode,shape,intensity,feather}
  let selectedId = null;
  let nextObjId = 1;

  let activeTool = null;     // 'blur' | 'circle' | 'arrow' | null(선택모드)
  let blurMode = "blur";     // 'blur' | 'mosaic'
  let blurShape = "face"; // 기본 가림은 얼굴 인식 + 얼굴 비율 타원
  // 편집 UI의 중앙(50)은 실제 이미지 처리값과 별개로, 현장용 기준 강도를 뜻한다.
  // 효과 데이터에는 기존과 동일한 0~100 실제 강도/페더를 저장한다.
  const EFFECT_BASELINE = {blur:{intensity:22,feather:82},mosaic:{intensity:58,feather:87}};
  function effectSliderToValue(position, mode, key){
    const mid=EFFECT_BASELINE[mode][key];
    const p=Math.max(0,Math.min(100,Number(position)));
    return p<=50 ? p*mid/50 : mid+(p-50)*(100-mid)/50;
  }
  function effectValueToSlider(value, mode, key){
    const mid=EFFECT_BASELINE[mode][key];
    const v=Math.max(0,Math.min(100,Number(value)));
    return v<=mid ? v*50/mid : 50+(v-mid)*50/(100-mid);
  }
  let intensity = EFFECT_BASELINE.blur.intensity;
  let feather = EFFECT_BASELINE.blur.feather;
  let strokeMultCurrent = 1; // legacy compatibility
  let strokePxCurrent = 2; // 1/2/3 px at initial fit scale
  let strokeColorCurrent = DEFAULT_COLOR; // 새 객체 생성 시 색상
  let dashedCurrent = false; // 새 객체 생성 시 점선 여부
  let circleLocked = true;   // 원/타원은 기본적으로 정원(1:1) 유지
  let rectLocked = false;    // 네모는 기본적으로 자유 비율
  let shapeKind = "circle";    // circle | rect

  let scale = 1;             // base display / natural (export coordinates are unaffected)
  let dispW = 0, dispH = 0;

  // 보기 전용 확대/이동. 편집 좌표와 저장 해상도에는 영향을 주지 않는다.
  let viewZoom = 1;
  let viewPanX = 0, viewPanY = 0;
  const MIN_VIEW_ZOOM = 1, MAX_VIEW_ZOOM = 6;
  const activePointers = new Map();
  let pinchGesture = null;
  let suppressPointerUp = new Set();
  let waitForAllTouchesUp = false;

  // 원본 래스터는 사진을 연 뒤 바뀌지 않으므로(가림은 비파괴) 히스토리에는 마킹 목록만 저장한다.
  let history = [];          // {objects:[...], effects:[...]}
  let historyIndex = -1;

  let drag = null;           // 진행중인 포인터 상호작용 상태
  let faceDebugPoints = [];  // 얼굴 인식 중심점 표시용(원본 좌표)
  let faceDebugTimer = null;

  let rafPending = false;

  // ---------------- dom ----------------
  const workarea = document.getElementById("workarea");
  const placeholder = document.getElementById("placeholder");
  const viewCanvas = document.getElementById("view-canvas");
  const vctx = viewCanvas.getContext("2d");
  const fileInput = document.getElementById("fileInput");
  const optionsBar = document.getElementById("options-bar");
  const toolbarEl = document.getElementById("toolbar");
  const saveGroupEl = toolbarEl.querySelector(".save-group");
  const chromeEl = document.getElementById("chrome");

  // 1차 안정화: 설정 패널은 항상 툴바의 형제로 유지한다.
  // 화면 크기에 따라 DOM을 이동시키면 툴바 폭과 스크롤 위치가 흔들릴 수 있다.
  function syncEditorInsets(){
    const mobile = window.matchMedia("(max-width: 640px)").matches;
    const height = chromeEl.getBoundingClientRect().height;
    const inset = Math.ceil(height + (mobile ? 24 : 24));
    const root = document.documentElement;
    // Desktop dock floats over the image: it must not reserve space above it.
    // Reserving the dock height at the top made the image jump when options opened.
    const top = "0px";
    const bottom = mobile ? inset + "px" : "0px";
    if(root.style.getPropertyValue("--editor-top")===top && root.style.getPropertyValue("--editor-bottom")===bottom) return;
    root.style.setProperty("--editor-top",top);
    root.style.setProperty("--editor-bottom",bottom);
    // Toolbar/option-panel changes must not change the displayed photo scale.
    // Only actual viewport resize events call fitCanvas().
  }
  const chromeObserver = new ResizeObserver(()=>requestAnimationFrame(syncEditorInsets));
  chromeObserver.observe(chromeEl);
  window.addEventListener("resize", syncEditorInsets, {passive:true});
  requestAnimationFrame(syncEditorInsets);
  const btnUndo = document.getElementById("btn-undo");
  const btnRedo = document.getElementById("btn-redo");
  const btnClearPhoto = document.getElementById("btn-clear-photo");
  const btnSave = document.getElementById("btn-save");
  const formatSelect = document.getElementById("format-select");
  const saveFormatWrap = toolbarEl.querySelector(".save-format-wrap");
  function syncSaveFormatIndicator(){saveFormatWrap.dataset.format = formatSelect.value;}
  formatSelect.addEventListener("change", syncSaveFormatIndicator);
  syncSaveFormatIndicator();
  const toastEl = document.getElementById("toast");

  const toolButtons = {
    blur: document.getElementById("btn-blur"),
    circle: document.getElementById("btn-circle"),
    arrow: document.getElementById("btn-arrow"),
    line: document.getElementById("btn-arrow"),
  };

  // ---------------- utils ----------------
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function longSide(){ return Math.max(naturalW, naturalH); }
  function strokeWidthNatural(mult){ return longSide() * STROKE_RATIO * (mult||1); }
  function annotationStrokeNatural(o){ return o.strokePx != null ? o.strokePx/referenceFitScale : strokeWidthNatural(o.strokeMult); }
  function currentStrokeNatural(){ return strokePxCurrent/referenceFitScale; }
  const MIN_ANNOTATION_SCREEN_LENGTH = 16;
  function meetsMinimumAnnotationLength(a,b){
    return Math.hypot(b.x-a.x,b.y-a.y)*referenceFitScale >= MIN_ANNOTATION_SCREEN_LENGTH;
  }
  // 가림 강도는 사진 전체가 아니라 현재 가림 영역의 짧은 변을 기준으로 계산한다.
  // 블러와 모자이크는 같은 0~100 슬라이더를 쓰지만 시각적 특성이 달라 별도 곡선을 사용한다.
  function blurRadiusNatural(rect, intensityValue){
    // 블러 반경을 과도하게 키우면 얼굴 전체가 피부색 한 덩어리처럼 녹아버린다.
    // 반경은 적당히 유지하고, 아래 anonymizeBlurCanvas()의 축소→확대와 함께
    // 고주파 디테일(눈/코/입/안경 안쪽)만 효과적으로 제거한다.
    const base = Math.max(8, Math.min(rect.w, rect.h));
    const t = clamp(intensityValue/100, 0, 1);
    if(t<=0) return 0;

    // 50 = 보도용 기본 익명화. 100에서도 얼굴 명암/색 분포는 남도록 상한을 낮춘다.
    // 큰 얼굴은 아주 약하게만 보정해, 클로즈업에서 다시 과도한 '밀가루 반죽' 효과가 나지 않게 한다.
    const imageShort = Math.max(1, Math.min(naturalW, naturalH));
    const faceShare = clamp(base / imageShort, 0, 1);
    const largeFaceT = clamp((faceShare - 0.24) / 0.36, 0, 1);
    const largeFaceBoost = 1 + 0.14 * Math.pow(largeFaceT, 0.9);

    const ratio = 0.012 + 0.072 * Math.pow(t, 1.18);
    return base * ratio * largeFaceBoost;
  }
  function mosaicBlockNatural(rect, intensityValue){
    // Use the selected face's dimensions, not the whole photo's dimensions.
    // Small regions need fewer, larger relative blocks to obscure facial features.
    const base = Math.max(1, Math.min(rect.w, rect.h));
    const t = clamp(intensityValue/100, 0, 1);
    if(t<=0) return 1;
    const screenShort = base * Math.max(referenceFitScale, 0.000001);
    const smallFace = 1 - clamp((screenShort-24)/96, 0, 1);
    const blocksAcross = (19 - 11*Math.pow(t,0.82)) * (1 - 0.38*smallFace);
    // At least two blocks across even for tiny regions; no spill beyond the mask.
    return Math.max(1, base/Math.max(2,blocksAcross));
  }
  function deepCloneObjects(arr){ return arr.map(o=>Object.assign({},o, o.rect ? {rect:Object.assign({},o.rect)} : {}, o.faceRects ? {faceRects:o.faceRects.map(r=>Object.assign({},r))} : {})); }
  function genId(){ return nextObjId++; }
  function showToast(msg, ms){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toastEl.classList.remove("show"), ms||2200);
  }

  // ---------------- history ----------------
  function pushHistory(){
    history = history.slice(0, historyIndex+1);
    history.push({ objects: deepCloneObjects(objects), effects: deepCloneObjects(effects) });
    if(history.length > MAX_HISTORY){ history.shift(); }
    historyIndex = history.length - 1;
    updateHistoryButtons();
  }

  function restoreHistoryEntry(entry){
    objects = deepCloneObjects(entry.objects);
    effects = deepCloneObjects(entry.effects || []);
    selectedId = null;
    drag = null;
    buildOptionsBar();
    redraw();
  }

  function undo(){
    if(historyIndex<=0) return;
    historyIndex--;
    restoreHistoryEntry(history[historyIndex]);
    updateHistoryButtons();
  }
  function redo(){
    if(historyIndex>=history.length-1) return;
    historyIndex++;
    restoreHistoryEntry(history[historyIndex]);
    updateHistoryButtons();
  }
  function updateHistoryButtons(){
    btnUndo.disabled = historyIndex<=0;
    btnRedo.disabled = historyIndex>=history.length-1;
  }

  // ---------------- image loading ----------------
  function loadImageFile(file){
    if(!file || !file.type || !file.type.startsWith("image/")){
      showToast("지원하는 사진 파일을 선택해주세요.", 1600);
      return;
    }
    const request=++loadGeneration;
    imageGeneration++;
    const reader = new FileReader();
    reader.onerror=()=>showToast("사진을 읽지 못했습니다.");
    reader.onabort=()=>{};
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        if(request!==loadGeneration) return;
        let nextRaster,nextContext;
        try{
          nextRaster=document.createElement("canvas");
          nextRaster.width=img.naturalWidth;nextRaster.height=img.naturalHeight;
          nextContext=nextRaster.getContext("2d");
          if(!nextContext||!img.naturalWidth||!img.naturalHeight) throw new Error("image allocation");
          nextContext.drawImage(img,0,0);
        }catch(err){showToast("사진을 열지 못했습니다. 사진 크기와 메모리를 확인해주세요.");return;}
        naturalW = img.naturalWidth;
        naturalH = img.naturalHeight;
        sourceImageFilename = file.name || "";
        referenceFitScale = Math.min(1, Math.max(0.00001, Math.min((workarea.clientWidth-24)/naturalW,(workarea.clientHeight-24)/naturalH)));
        strokePxCurrent = 2;
        rasterCanvas=nextRaster;
        rasterCtx=nextContext;
        objects = [];
        effects = [];
        effectCache.clear();
        selectedId = null;
        history = [];
        historyIndex = -1;
        pushHistory();
        placeholder.classList.add("hidden");
        viewCanvas.classList.add("ready");
        btnSave.disabled = false;
        btnClearPhoto.disabled = false;
        setActiveTool(null);
        resetView();
        fitCanvas();
        redraw();
      };
      img.onerror = function(){
        showToast("이 사진 형식은 브라우저에서 열 수 없습니다.", 1800);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // 사진 선택은 이음과 같은 고정 file input 흐름을 사용한다.
  // iOS가 선택창을 여는 방식까지 동일하게 맞추고, 마킹에서는 전달된 첫 사진 한 장만 사용한다.
  function openImagePicker(){
    const plus=document.getElementById("btn-pick-photo");
    plus.classList.add("picker-pressed");
    fileInput.click();
    window.setTimeout(()=>plus.classList.remove("picker-pressed"),260);
  }

  document.getElementById("btn-pick-photo").addEventListener("click", (e)=>{
    e.preventDefault();e.stopPropagation();
    openImagePicker();
  });
  // Desktop keeps click-anywhere empty-state behavior; mobile opens only via +.
  placeholder.addEventListener("click", (e)=>{
    if(window.matchMedia("(max-width:640px)").matches) return;
    if(e.target.closest("#btn-pick-photo")) return;
    openImagePicker();
  });
  const instruction=placeholder.querySelector(".ph-instruction");
  function syncPhotoInstruction(){
    instruction.textContent=window.matchMedia("(max-width:640px)").matches
      ? "클릭해서 추가하세요"
      : "클릭하거나 사진을 놓아주세요";
  }
  syncPhotoInstruction();
  window.addEventListener("resize",syncPhotoInstruction);
  fileInput.addEventListener("change", (e)=>{
    const files = e.target.files;
    const file = files && files.length ? files[0] : null;
    if(file) loadImageFile(file);
    fileInput.value = "";
  });

  ["dragenter","dragover"].forEach(ev=>{
    workarea.addEventListener(ev, e=>{
      e.preventDefault();
      placeholder.classList.add("dragover");
    });
  });
  ["dragleave","drop"].forEach(ev=>{
    workarea.addEventListener(ev, e=>{
      e.preventDefault();
      placeholder.classList.remove("dragover");
    });
  });
  workarea.addEventListener("drop", e=>{
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) loadImageFile(f);
  });

  // ---------------- layout ----------------
  function applyViewTransform(){
    // CSS transform만 사용하므로 원본/마킹 좌표와 JPEG·PNG 결과는 변하지 않는다.
    viewCanvas.style.transformOrigin = "50% 50%";
    viewCanvas.style.transform = `translate(${viewPanX}px, ${viewPanY}px) scale(${viewZoom})`;
  }
  function resetView(){
    viewZoom=1; viewPanX=0; viewPanY=0;
    applyViewTransform();
  }
  function clampView(){
    if(viewZoom<=1.001){ viewZoom=1; viewPanX=0; viewPanY=0; return; }
    // 사진이 화면에서 완전히 사라지지 않을 정도로 이동 범위를 제한한다.
    const maxX=Math.max(0,(dispW*viewZoom-workarea.clientWidth)/2 + workarea.clientWidth*0.42);
    const maxY=Math.max(0,(dispH*viewZoom-workarea.clientHeight)/2 + workarea.clientHeight*0.42);
    viewPanX=clamp(viewPanX,-maxX,maxX);
    viewPanY=clamp(viewPanY,-maxY,maxY);
  }
  function setViewZoom(nextZoom, clientX, clientY){
    const old=viewZoom;
    nextZoom=clamp(nextZoom,MIN_VIEW_ZOOM,MAX_VIEW_ZOOM);
    if(Math.abs(nextZoom-old)<0.0001) return;
    // 포인터 아래의 사진 위치가 가능한 한 그대로 남도록 pan을 보정한다.
    const wa=workarea.getBoundingClientRect();
    const cx=clientX==null ? wa.left+wa.width/2 : clientX;
    const cy=clientY==null ? wa.top+wa.height/2 : clientY;
    const centerX=wa.left+wa.width/2, centerY=wa.top+wa.height/2;
    const localX=cx-centerX-viewPanX, localY=cy-centerY-viewPanY;
    const ratio=nextZoom/old;
    viewPanX += localX*(1-ratio);
    viewPanY += localY*(1-ratio);
    viewZoom=nextZoom;
    clampView(); applyViewTransform();
  }
  function fitCanvas(){
    if(!naturalW) return;
    const wrapW = workarea.clientWidth - 24;
    const wrapH = workarea.clientHeight - 24;
    let s = Math.min(wrapW/naturalW, wrapH/naturalH);
    s = Math.min(s, 1);
    if(!isFinite(s) || s<=0) s = 1;
    scale = s;
    dispW = Math.round(naturalW*scale);
    dispH = Math.round(naturalH*scale);
    const dpr = window.devicePixelRatio || 1;
    viewCanvas.width = Math.round(dispW*dpr);
    viewCanvas.height = Math.round(dispH*dpr);
    viewCanvas.style.width = dispW+"px";
    viewCanvas.style.height = dispH+"px";
    vctx.setTransform(dpr,0,0,dpr,0,0);
    clampView(); applyViewTransform();
  }
  // Coalesce bursts of desktop window resize events into a single frame.
  let resizeCanvasFrame=0;
  window.addEventListener("resize", ()=>{
    if(resizeCanvasFrame) cancelAnimationFrame(resizeCanvasFrame);
    resizeCanvasFrame=requestAnimationFrame(()=>{
      resizeCanvasFrame=0;
      if(!naturalW)return;
      const width=workarea.clientWidth-24, height=workarea.clientHeight-24;
      const nextScale=Math.min(1,width/naturalW,height/naturalH);
      const nextW=Math.round(naturalW*nextScale),nextH=Math.round(naturalH*nextScale);
      const dpr=window.devicePixelRatio||1;
      if(nextW===dispW && nextH===dispH && viewCanvas.width===Math.round(nextW*dpr) && viewCanvas.height===Math.round(nextH*dpr))return;
      fitCanvas();redraw();
    });
  });

  // ---------------- drawing helpers ----------------
  // Fit whole dash segments between the origin and the arrowhead clearance.
  function arrowDashPattern(length, sw, headLen){
    const available = Math.max(0, length - headLen*0.62 - sw*1.5);
    const preferred = Math.max(2, sw*2.2);
    if(available < preferred*1.5) return null;
    const count = Math.max(1, Math.round(available/(preferred*1.85)));
    const dash = Math.min(preferred, available/count);
    const gap = count>1 ? (available-count*dash)/(count-1) : 0;
    return {available,count,dash,gap};
  }
  function drawArrowShape(ctx, x1,y1,x2,y2, sw, color){
    const angle = Math.atan2(y2-y1, x2-x1);
    const arrowLen = Math.hypot(x2-x1, y2-y1);
    // 화살촉 크기는 현재 그려지는 선 굵기와 화살표 길이를 기준으로 계산한다.
    // 화면 미리보기에서도 원본 사진의 natural size를 참조하지 않아 과도하게 커지지 않는다.
    // Cap the head in reference-fit screen pixels: long arrows must not grow giant heads.
    // sw and arrowLen are in the SAME rendering coordinate system.
    const headLen = Math.min(Math.max(sw*3.2, sw*4.5), arrowLen*0.28);
    const headHalfAngle = Math.PI/7.2; // 약 25°: 작고 날렵한 화살촉
    if(arrowLen < 0.5) return;
    const shortenX = Math.cos(angle)*headLen*0.62;
    const shortenY = Math.sin(angle)*headLen*0.62;
    ctx.lineWidth = sw;
    ctx.strokeStyle = color;
    ctx.lineCap = "round";
    const dashed = ctx.getLineDash().length > 0;
    const pattern = dashed ? arrowDashPattern(arrowLen, sw, headLen) : null;
    ctx.setLineDash([]);
    if(pattern){
      const ux=Math.cos(angle), uy=Math.sin(angle);
      ctx.beginPath();
      for(let i=0;i<pattern.count;i++){
        const start=i*(pattern.dash+pattern.gap);
        const end=start+pattern.dash;
        ctx.moveTo(x1+ux*start,y1+uy*start);
        ctx.lineTo(x1+ux*end,y1+uy*end);
      }
      ctx.stroke();
    }else{
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2-shortenX, y2-shortenY);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-headLen*Math.cos(angle-headHalfAngle), y2-headLen*Math.sin(angle-headHalfAngle));
    ctx.lineTo(x2-headLen*Math.cos(angle+headHalfAngle), y2-headLen*Math.sin(angle+headHalfAngle));
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }
  function drawCircleShape(ctx, cx,cy,rx,ry, sw, color){
    ctx.lineWidth = sw;
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.ellipse(cx,cy,Math.max(1,rx),Math.max(1,ry),0,0,Math.PI*2);
    ctx.stroke();
  }

  function objectBoundsNatural(o){
    if(o.type==="circle") return {x:o.cx-o.rx, y:o.cy-o.ry, w:o.rx*2, h:o.ry*2};
    if(o.type==="rect") return {x:o.x, y:o.y, w:o.w, h:o.h};
    return {x:Math.min(o.x1,o.x2), y:Math.min(o.y1,o.y2), w:Math.abs(o.x2-o.x1), h:Math.abs(o.y2-o.y1)};
  }

  function rotatePoint(p, c, angle){
    const cos=Math.cos(angle||0), sin=Math.sin(angle||0);
    const dx=p.x-c.x, dy=p.y-c.y;
    return {x:c.x+dx*cos-dy*sin, y:c.y+dx*sin+dy*cos};
  }
  function rectCenter(o){ return {x:o.x+o.w/2,y:o.y+o.h/2}; }
  function rectCornerNatural(o,k){
    const c=rectCenter(o), sx=k.includes("e")?1:-1, sy=k.includes("s")?1:-1;
    return rotatePoint({x:c.x+sx*o.w/2,y:c.y+sy*o.h/2},c,o.rotation||0);
  }
  function rotateHandleDisplay(o,s){
    if(o.type!=="rect") return null;
    const c=rectCenter(o), a=o.rotation||0;
    // 오른쪽 변 중앙에서 화면상 26px 바깥에 회전 손잡이를 둔다.
    const edge=rotatePoint({x:c.x+o.w/2,y:c.y},c,a);
    const outward={x:Math.cos(a),y:Math.sin(a)};
    return {x:edge.x*s+outward.x*26,y:edge.y*s+outward.y*26,edgeX:edge.x*s,edgeY:edge.y*s,k:"rotate"};
  }

  // 점선 간격은 선 굵기에 비례해, 두께가 달라져도 점선 비율이 일정하게 보이도록 한다.
  function dashArrayForStroke(sw){ const d = Math.max(2, sw*2.2); return [d, d*0.85]; }
  function applyDash(ctx, dashed, sw){ ctx.setLineDash(dashed ? dashArrayForStroke(sw) : []); }

  function appendStrokePresets(group, selectedObject){
    const seg=document.createElement("div"); seg.className="seg";
    const current=selectedObject ? (selectedObject.strokePx || 2) : strokePxCurrent;
    STROKE_PRESETS.forEach(([px,name])=>{
      const b=document.createElement("button"); b.type="button"; b.textContent=name;
      b.className=px===current?"active":"";
      b.onclick=()=>{
        strokePxCurrent=px;
        if(selectedObject){ selectedObject.strokePx=px; pushHistory(); redraw(); }
        buildOptionsBar();
      };
      seg.appendChild(b);
    });
    group.appendChild(seg);
  }

  function appendLineStyleControl(container, selectedObject){
    const group=document.createElement("div"); group.className="opt-group option-line-style";
    group.setAttribute("role","group"); group.setAttribute("aria-label","선 스타일");
    const seg=document.createElement("div"); seg.className="seg";
    const current=selectedObject ? !!selectedObject.dashed : dashedCurrent;
    if(window.matchMedia("(max-width:640px)").matches){
      // Mobile: one button cycles solid ↔ dashed; desktop keeps its original two choices.
      const styleLabel=document.createElement("span");
      styleLabel.className="line-style-current-label";
      styleLabel.textContent=current?"점선":"실선";
      group.appendChild(styleLabel);
      const button=document.createElement("button"); button.type="button";
      button.className="active line-style-toggle";
      button.textContent=current?"점선":"실선";
      button.title=current?"점선 — 눌러 실선으로 변경":"실선 — 눌러 점선으로 변경";
      button.setAttribute("aria-label",button.title);
      button.setAttribute("aria-pressed",String(current));
      button.onclick=()=>{
        const dashed=!(selectedObject ? !!selectedObject.dashed : dashedCurrent);
        dashedCurrent=dashed;
        if(selectedObject && selectedObject.dashed!==dashed){
          selectedObject.dashed=dashed;pushHistory();redraw();
        }
        buildOptionsBar();
      };
      seg.appendChild(button);
    }else{
      [["실선",false],["점선",true]].forEach(([label,dashed])=>{
        const button=document.createElement("button"); button.type="button";
        button.textContent=label; button.className=current===dashed?"active":"";
        button.setAttribute("aria-pressed",String(current===dashed));
        button.onclick=()=>{
          dashedCurrent=dashed;
          if(selectedObject && selectedObject.dashed!==dashed){
            selectedObject.dashed=dashed;pushHistory();redraw();
          }
          buildOptionsBar();
        };
        seg.appendChild(button);
      });
    }
    group.appendChild(seg);container.appendChild(group);
  }

  function appendColorPalette(group, current, onSelect){
    const palette=document.createElement("div"); palette.className="annotation-palette"; palette.setAttribute("role","group"); palette.setAttribute("aria-label","표시 색상");
    const labels=["빨강","노랑","흰색","검정","파랑"];
    ANNOTATION_COLORS.forEach((hex,i)=>{
      const button=document.createElement("button"); button.type="button";
      button.className="palette-swatch"+(hex.toLowerCase()===String(current).toLowerCase()?" selected":"");
      button.style.setProperty("--swatch",hex); button.title=labels[i]; button.setAttribute("aria-label",labels[i]);
      button.setAttribute("aria-pressed",hex.toLowerCase()===String(current).toLowerCase()?"true":"false");
      button.onclick=()=>{ onSelect(hex); palette.querySelectorAll("button").forEach(b=>{const yes=b===button;b.classList.toggle("selected",yes);b.setAttribute("aria-pressed",String(yes));}); };
      palette.appendChild(button);
    });
    group.appendChild(palette);
  }

  function drawObjectOnCtx(ctx, o, s){
    const sw = annotationStrokeNatural(o) * s;
    const col = o.color || DEFAULT_COLOR;
    if(o.type==="circle"){
      ctx.save(); applyDash(ctx, o.dashed, sw);
      drawCircleShape(ctx, o.cx*s, o.cy*s, o.rx*s, o.ry*s, sw, col);
      ctx.restore();
    } else if(o.type==="rect"){
      const c=rectCenter(o);
      ctx.save(); ctx.translate(c.x*s,c.y*s); ctx.rotate(o.rotation||0);
      applyDash(ctx, o.dashed, sw);
      ctx.lineWidth=sw; ctx.strokeStyle=col; ctx.lineJoin="round";
      ctx.strokeRect(-o.w*s/2,-o.h*s/2,o.w*s,o.h*s); ctx.restore();
    } else if(o.type==="line"){
      ctx.save();
      const len=Math.hypot((o.x2-o.x1)*s,(o.y2-o.y1)*s);
      const pattern=o.dashed ? arrowDashPattern(len,sw,0) : null;
      ctx.setLineDash(pattern ? [pattern.dash,pattern.gap] : []);
      ctx.lineWidth=sw; ctx.strokeStyle=col; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(o.x1*s,o.y1*s); ctx.lineTo(o.x2*s,o.y2*s); ctx.stroke();
      ctx.restore();
    } else {
      ctx.save(); applyDash(ctx, o.dashed, sw);
      drawArrowShape(ctx, o.x1*s, o.y1*s, o.x2*s, o.y2*s, sw, col);
      ctx.restore();
    }
  }

  function drawHandles(ctx, o, s){
    ctx.save();
    const hs = HANDLE_SCREEN_SIZE;
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = var_accent_blue();
    ctx.lineWidth = 1.5;
    const pts = handlePointsDisplay(o, s);
    pts.forEach(p=>{
      ctx.beginPath();
      ctx.rect(p.x-hs/2, p.y-hs/2, hs, hs);
      ctx.fill();
      ctx.stroke();
    });
    const rp=rotateHandleDisplay(o,s);
    if(rp){
      ctx.beginPath(); ctx.moveTo(rp.edgeX,rp.edgeY); ctx.lineTo(rp.x,rp.y); ctx.stroke();
      ctx.beginPath(); ctx.arc(rp.x,rp.y,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=var_accent_blue(); ctx.font="bold 11px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("↻",rp.x,rp.y+.3);
    }
    ctx.restore();
  }
  function closeButtonMetrics(w,h){
    // 작은 선택 영역에서는 X가 객체를 덮지 않도록 시각 크기만 축소한다.
    // 터치 판정 영역은 별도로 넉넉하게 유지한다.
    const minDim=Math.max(1,Math.min(Math.abs(w),Math.abs(h)));
    const r=clamp(minDim*0.09,5,8);
    return {r, arm:Math.max(2.2,r*0.38), inset:r+1.5, hit:18};
  }
  function objectClosePoint(o){
    // 화살표·직선은 끝점 근처, 도형은 우상단 안쪽에 배치한다.
    if(o.type==="arrow" || o.type==="line"){
      const x1=o.x1*scale,y1=o.y1*scale,x2=o.x2*scale,y2=o.y2*scale;
      const dx=x2-x1,dy=y2-y1,len=Math.max(1,Math.hypot(dx,dy));
      const m=closeButtonMetrics(len, len);
      const margin=m.r+4;
      let cx=x2 + (-dy/len)*margin, cy=y2 + (dx/len)*margin;
      cx=clamp(cx,m.r+3,dispW-m.r-3); cy=clamp(cy,m.r+3,dispH-m.r-3);
      return {x:cx,y:cy,...m};
    }
    const b=objectBoundsNatural(o), x=b.x*scale, y=b.y*scale, w=b.w*scale, h=b.h*scale;
    const m=closeButtonMetrics(w,h);
    if(o.type==="rect" && o.rotation){
      const c=rectCenter(o), p=rotatePoint({x:o.x+o.w-m.inset/scale,y:o.y+m.inset/scale},c,o.rotation);
      return {x:clamp(p.x*scale,m.r+3,dispW-m.r-3),y:clamp(p.y*scale,m.r+3,dispH-m.r-3),...m};
    }
    return {x:clamp(x+w-m.inset,m.r+3,dispW-m.r-3), y:clamp(y+m.inset,m.r+3,dispH-m.r-3), ...m};
  }
  function drawObjectSelection(ctx,o){
    const b=objectBoundsNatural(o), x=b.x*scale,y=b.y*scale,w=b.w*scale,h=b.h*scale;
    ctx.save(); ctx.setLineDash([4,3]); ctx.lineWidth=1.0; ctx.strokeStyle='rgba(255,255,255,.46)';
    if(o.type==="rect" && o.rotation){
      const pts=["nw","ne","se","sw"].map(k=>rectCornerNatural(o,k));
      ctx.beginPath();ctx.moveTo(pts[0].x*scale,pts[0].y*scale);pts.slice(1).forEach(p=>ctx.lineTo(p.x*scale,p.y*scale));ctx.closePath();ctx.stroke();
    }else ctx.strokeRect(x,y,w,h);
    ctx.setLineDash([]);
    const cp=objectClosePoint(o),cx=cp.x,cy=cp.y,r=cp.r,a=cp.arm;
    ctx.fillStyle='rgba(28,28,30,.78)'; ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=Math.max(1.2,r*0.16);ctx.beginPath();ctx.moveTo(cx-a,cy-a);ctx.lineTo(cx+a,cy+a);ctx.moveTo(cx+a,cy-a);ctx.lineTo(cx-a,cy+a);ctx.stroke();ctx.restore();
  }
  function objectCloseHit(dp,o){ const cp=objectClosePoint(o); return Math.hypot(dp.x-cp.x,dp.y-cp.y)<=cp.hit; }

  // 강조색은 CSS 변수에서 한 번만 읽는다(매 프레임 getComputedStyle 호출 방지).
  let accentColorCache = null;
  function var_accent_blue(){
    if(accentColorCache==null) accentColorCache = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#0a6cff";
    return accentColorCache;
  }

  function handlePointsDisplay(o, s){
    if(o.type==="rect"){
      return ["nw","ne","sw","se"].map(k=>{const p=rectCornerNatural(o,k);return {x:p.x*s,y:p.y*s,k};});
    } else if(o.type==="circle"){
      const b = objectBoundsNatural(o);
      return [
        {x:b.x*s, y:b.y*s, k:"nw"},
        {x:(b.x+b.w)*s, y:b.y*s, k:"ne"},
        {x:b.x*s, y:(b.y+b.h)*s, k:"sw"},
        {x:(b.x+b.w)*s, y:(b.y+b.h)*s, k:"se"},
      ];
    } else {
      return [
        {x:o.x1*s, y:o.y1*s, k:"p1"},
        {x:o.x2*s, y:o.y2*s, k:"p2"},
      ];
    }
  }

  function redraw(){
    if(rafPending) return;
    rafPending = true;
    requestAnimationFrame(()=>{
      rafPending = false;
      doRedraw();
    });
  }

  function doRedraw(){
    if(!naturalW) return;
    vctx.clearRect(0,0,dispW,dispH);
    vctx.drawImage(rasterCanvas, 0,0,naturalW,naturalH, 0,0,dispW,dispH);

    // 저장 전까지 가림 효과는 원본에 합치지 않고 비파괴 객체로 렌더링한다.
    effects.forEach(eff=>{
      const rendered = renderEffectObject(eff);
      if(rendered && rendered.canvas){
        vctx.drawImage(rendered.canvas, 0,0,rendered.canvas.width,rendered.canvas.height,
          rendered.sx*scale, rendered.sy*scale, rendered.canvas.width*scale, rendered.canvas.height*scale);
      }
      // 저장하기 전에는 만들어 둔 모든 가림 영역의 경계를 계속 표시한다.
      // 선택된 영역만 X 버튼을 보여 주고, 나머지는 점선 가이드만 남긴다.
      if(eff.id===selectedId) drawEffectSelection(vctx, eff);
      else drawEffectGuide(vctx, eff);
    });

    objects.forEach(o=>{
      drawObjectOnCtx(vctx, o, scale);
      if(o.id===selectedId){
        drawObjectSelection(vctx,o);
        drawHandles(vctx, o, scale);
      }
    });

    // 진행중인 미리보기
    if(drag && drag.mode==="create"){
      vctx.save();
      applyDash(vctx, dashedCurrent, currentStrokeNatural()*scale);
      if(activeTool==="blur"){
        const r = normRect(drag.startDisp, drag.curDisp);
        vctx.setLineDash([5,4]);
        vctx.lineWidth = 1.5;
        vctx.strokeStyle = "#ffffff";
        vctx.fillStyle = "rgba(255,255,255,0.10)";
        if(blurShape==="face"){
          vctx.beginPath();
          vctx.ellipse(r.x+r.w/2, r.y+r.h/2, r.w/2, r.h/2, 0,0,Math.PI*2);
          vctx.fill(); vctx.stroke();
        } else {
          vctx.fillRect(r.x,r.y,r.w,r.h);
          vctx.strokeRect(r.x,r.y,r.w,r.h);
        }
      } else if(activeTool==="circle"){
        vctx.globalAlpha=0.45;
        let r;
        const shapeLocked=shapeKind==="rect"?rectLocked:circleLocked;
        if(shapeLocked){
          const ddx = drag.curDisp.x-drag.startDisp.x, ddy = drag.curDisp.y-drag.startDisp.y;
          const size = Math.max(Math.abs(ddx),Math.abs(ddy));
          const signX = ddx>=0?1:-1, signY = ddy>=0?1:-1;
          const ep = {x:drag.startDisp.x+signX*size, y:drag.startDisp.y+signY*size};
          r = normRect(drag.startDisp, ep);
        } else {
          r = normRect(drag.startDisp, drag.curDisp);
        }
        if(shapeKind==="rect"){
          vctx.lineWidth=currentStrokeNatural()*scale; vctx.strokeStyle=strokeColorCurrent; vctx.strokeRect(r.x,r.y,r.w,r.h);
        } else {
          const cx=r.x+r.w/2, cy=r.y+r.h/2;
          drawCircleShape(vctx, cx, cy, r.w/2, r.h/2, currentStrokeNatural()*scale, strokeColorCurrent);
        }
      } else if(activeTool==="arrow"){
        vctx.globalAlpha=0.45;
        applyDash(vctx, dashedCurrent, currentStrokeNatural()*scale);
        drawArrowShape(vctx, drag.startDisp.x, drag.startDisp.y, drag.curDisp.x, drag.curDisp.y, currentStrokeNatural()*scale, strokeColorCurrent);
      } else if(activeTool==="line"){
        vctx.globalAlpha=0.45;
        drawObjectOnCtx(vctx, {type:"line",
          x1:dispToNat(drag.startDisp).x,y1:dispToNat(drag.startDisp).y,
          x2:dispToNat(drag.curDisp).x,y2:dispToNat(drag.curDisp).y,
          strokePx:strokePxCurrent,color:strokeColorCurrent,dashed:dashedCurrent}, scale);
      }
      vctx.restore();
    }

    // 가림 범위를 놓은 직후, 실제로 인식된 얼굴 중심을 잠깐 파란 점으로 보여준다.
    if(faceDebugPoints.length){
      vctx.save();
      faceDebugPoints.forEach(p=>{
        const x=p.x*scale, y=p.y*scale;
        vctx.beginPath(); vctx.arc(x,y,6,0,Math.PI*2);
        vctx.fillStyle="#0a84ff"; vctx.fill();
        vctx.lineWidth=2; vctx.strokeStyle="rgba(255,255,255,.95)"; vctx.stroke();
      });
      vctx.restore();
    }
  }

  function effectBounds(eff){
    const rs = eff.faceRects && eff.faceRects.length ? eff.faceRects : [eff.rect];
    const x1=Math.min(...rs.map(r=>r.x)), y1=Math.min(...rs.map(r=>r.y));
    const x2=Math.max(...rs.map(r=>r.x+r.w)), y2=Math.max(...rs.map(r=>r.y+r.h));
    return {x:x1,y:y1,w:x2-x1,h:y2-y1};
  }

  function effectCenter(eff){ const b=effectBounds(eff);return {x:b.x+b.w/2,y:b.y+b.h/2}; }
  function effectRotatedPoint(eff,x,y){ return rotatePoint({x,y},effectCenter(eff),eff.rotation||0); }

  function effectClosePoint(eff){
    const b=effectBounds(eff);
    const x=b.x*scale,y=b.y*scale,w=b.w*scale,h=b.h*scale;
    const m=closeButtonMetrics(w,h);
    // 작은 얼굴에서는 X 자체도 작아지고, 우상단 모서리 안쪽에 비례해서 붙는다.
    if(eff.rotation){
      const p=effectRotatedPoint(eff,b.x+b.w-m.inset/scale,b.y+m.inset/scale);
      return {x:clamp(p.x*scale,m.r+3,dispW-m.r-3),y:clamp(p.y*scale,m.r+3,dispH-m.r-3),...m};
    }
    return {x:clamp(x+w-m.inset,m.r+3,dispW-m.r-3), y:clamp(y+m.inset,m.r+3,dispH-m.r-3), ...m};
  }
  function drawEffectGuide(ctx, eff){
    const rs=eff.faceRects&&eff.faceRects.length?eff.faceRects:[eff.rect];
    ctx.save();
    ctx.setLineDash([4,3]);
    ctx.lineWidth=1.05;
    ctx.strokeStyle='rgba(255,255,255,.42)';
    rs.forEach(r=>{
      const c={x:r.x+r.w/2,y:r.y+r.h/2};
      ctx.save();ctx.translate(c.x*scale,c.y*scale);ctx.rotate(eff.rotation||0);

  function effectSideHandlePointsDisplay(eff){
    const b=effectBounds(eff);

      {px:b.x+b.w/2,py:b.y+b.h,k:'s'},{px:b.x,py:b.y+b.h/2,k:'w'}

  }

  function effectRotateHandleDisplay(eff){
    const b=effectBounds(eff),c=effectCenter(eff),a=eff.rotation||0;
    const edge=effectRotatedPoint(eff,b.x+b.w,b.y+b.h/2);
    return {x:edge.x*scale+Math.cos(a)*26,y:edge.y*scale+Math.sin(a)*26,edgeX:edge.x*scale,edgeY:edge.y*scale,k:'rotate'};

  function findEffectHandleAt(dp){

    if(Math.hypot(dp.x-rp.x,dp.y-rp.y)<=14) return {effect:eff,handle:'rotate'};
    for(const p of effectSideHandlePointsDisplay(eff)){

  function findEffectAt(dp){
    // 모바일 재선택 여유는 주되, 타원형 가림의 빈 모서리까지 잡히지는 않게 한다.
    const tolPx = 18, x=dp.x/scale, y=dp.y/scale;
    for(let i=effects.length-1;i>=0;i--){
      const e=effects[i];
      const rs=e.faceRects&&e.faceRects.length?e.faceRects:[e.rect];
      for(const r of rs){
        const c={x:r.x+r.w/2,y:r.y+r.h/2};
        const unrot=rotatePoint({x:dp.x/scale,y:dp.y/scale},c,-(e.rotation||0));
        if((e.shape||"ellipse")==="ellipse"){
          const rx=Math.max(1,r.w*scale/2+tolPx), ry=Math.max(1,r.h*scale/2+tolPx);
          const cx=(r.x+r.w/2)*scale, cy=(r.y+r.h/2)*scale;
          const dx=(unrot.x*scale-cx)/rx, dy=(unrot.y*scale-cy)/ry;
          if(dx*dx+dy*dy<=1) return e;
        }else{
          const t=tolPx/Math.max(scale,.001);
          if(unrot.x>=r.x-t&&unrot.x<=r.x+r.w+t&&unrot.y>=r.y-t&&unrot.y<=r.y+r.h+t) return e;
        }
      }
    }
    return null;
  }

  // ---------------- hit testing ----------------
  function distToSegment(px,py,x1,y1,x2,y2){
    const dx=x2-x1, dy=y2-y1;
    const len2 = dx*dx+dy*dy;
    let t = len2===0?0:((px-x1)*dx+(py-y1)*dy)/len2;
    t = clamp(t,0,1);
    const cx = x1+t*dx, cy = y1+t*dy;
    return Math.hypot(px-cx, py-cy);
  }

  function findHandleAt(dispPt){

    if(rp && Math.hypot(dispPt.x-rp.x,dispPt.y-rp.y)<=14) return {obj:o,handle:"rotate"};
    const pts = handlePointsDisplay(o, scale);
    for(const p of pts){
      if(Math.hypot(dispPt.x-p.x, dispPt.y-p.y) <= HANDLE_SCREEN_SIZE){
        return {obj:o, handle:p.k};
      }
    }
    return null;
  }

  function findObjectAt(dispPt){
    for(let i=objects.length-1;i>=0;i--){
      const o = objects[i];
      if(o.type==="arrow" || o.type==="line"){
        const d = distToSegment(dispPt.x,dispPt.y, o.x1*scale,o.y1*scale, o.x2*scale,o.y2*scale);
        if(d<=HIT_TOLERANCE) return o;
      } else if(o.type==="circle"){
        // 타원도 네모와 동일하게 내부 아무 곳이나 잡아 선택/이동한다.
        // 화면상 약간의 터치 여유를 더해 모바일에서도 잡기 쉽게 한다.
        const cx=o.cx*scale, cy=o.cy*scale, rx=Math.max(1,o.rx*scale), ry=Math.max(1,o.ry*scale);
        const ex=rx+HIT_TOLERANCE, ey=ry+HIT_TOLERANCE;
        const q=((dispPt.x-cx)/ex)**2+((dispPt.y-cy)/ey)**2;
        if(q<=1) return o;

        const c=rectCenter(o), nat={x:dispPt.x/scale,y:dispPt.y/scale};

        const inside=local.x>=o.x-t&&local.x<=o.x+o.w+t&&local.y>=o.y-t&&local.y<=o.y+o.h+t;
        if(inside) return o;
      }
    }
    return null;
  }

  function positionReplacementMenu(menu){
    const mobile=window.matchMedia("(max-width:640px)").matches;

    menu.style.width=mobile?(menu===lineToolMenu?'106px':'72px'):(menu===lineToolMenu?'96px':'62px');

      const selected=menu.querySelector('[aria-checked="true"]');

      const checkRect=check?.getBoundingClientRect();
      const checkOffset=checkRect ? checkRect.left+checkRect.width/2-menuRect.left : width/2;

  function buildOptionsBar(){

      optionsBar.classList.add("hidden");
    }

    decorateOptionIcons();
    arrangeMobileOptions();
    // Align synchronously before the browser paints the rebuilt option panel.
    // This preserves measured final positions without a one-frame label jump.
    if(mobileLayoutQuery.matches) alignMobileOptionLabels();
  }

  // Rebuild the option wrappers when orientation crosses the mobile/desktop breakpoint.
  // Shared breakpoint for layout updates and toolbar rendering.
  const mobileLayoutQuery=window.matchMedia("(max-width:640px)");
  const refreshOptionsLayout=()=>{if(activeTool || selectedId!==null) buildOptionsBar();};
  if(mobileLayoutQuery.addEventListener) mobileLayoutQuery.addEventListener("change",refreshOptionsLayout);
  else if(mobileLayoutQuery.addListener) mobileLayoutQuery.addListener(refreshOptionsLayout);

  // ---------------- native zoom guard ----------------
  // iOS Safari의 더블탭/페이지 확대는 편집 좌표와 어긋나므로 앱 안에서는 막고,
  // 사진 확대/축소는 아래의 두 손가락 커스텀 제스처만 사용한다.
  let lastTouchEndInfo = null;
  document.addEventListener("touchend", function(e){
    if(!e.changedTouches || !e.changedTouches.length) return;
    const t=e.changedTouches[0], now=Date.now();
    if(lastTouchEndInfo){
      const dt=now-lastTouchEndInfo.time;
      const dd=Math.hypot(t.clientX-lastTouchEndInfo.x, t.clientY-lastTouchEndInfo.y);
      if(dt>0 && dt<320 && dd<28){
        e.preventDefault();
        // 확대된 사진에서의 더블탭은 원래 보기로 복귀만 시킨다.
        if(naturalW && viewZoom>1.001){ resetView(); redraw(); }
        lastTouchEndInfo=null;
        return;
      }
    }
    lastTouchEndInfo={time:now,x:t.clientX,y:t.clientY};
  }, {passive:false});
  document.addEventListener("dblclick", function(e){
    if(!e.target.closest || !e.target.closest("#app")) return;
    e.preventDefault();
    if(naturalW && viewZoom>1.001){ resetView(); redraw(); }
  }, {passive:false});

  // ---------------- pointer interaction ----------------
  // 한 손가락/좌클릭 = 편집, 두 손가락 = 보기(핀치 확대 + 이동).
  // 두 손가락 제스처 중에는 마킹 생성/선택/이동을 절대 실행하지 않는다.
  viewCanvas.addEventListener("pointerdown", function(e){
    // 핀치 중 손가락이 확대된 캔버스 바깥으로 나가도 move/up 이벤트를 계속 받는다.
    try{ viewCanvas.setPointerCapture && viewCanvas.setPointerCapture(e.pointerId); }catch(_){ }
    activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
    if(e.pointerType==="touch" && activePointers.size>=2){
      e.preventDefault();
      drag=null; // 첫 손가락으로 시작됐던 편집 동작도 즉시 취소
      waitForAllTouchesUp = true;
      const pts=[...activePointers.values()].slice(0,2);
      const dx=pts[1].x-pts[0].x, dy=pts[1].y-pts[0].y;
      pinchGesture={
        startDist:Math.max(1,Math.hypot(dx,dy)), startZoom:viewZoom,
        startMid:{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2},

    }
    if(!pinchGesture && !waitForAllTouchesUp) onPointerDown(e);
  });
  viewCanvas.addEventListener("pointermove", function(e){
    if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
    if(pinchGesture){
      e.preventDefault();
      const a=activePointers.get(pinchGesture.ids[0]), b=activePointers.get(pinchGesture.ids[1]);
      if(a&&b){
        const dist=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y));
        const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
        const nextZoom=clamp(pinchGesture.startZoom*(dist/pinchGesture.startDist),MIN_VIEW_ZOOM,MAX_VIEW_ZOOM);
        // 제스처 시작 중점 아래의 사진 위치를 고정한 채 확대/축소한다.
        // 단순히 pan에 중점 이동량만 더하면 확대 후 축소할 때 원래 위치로 복귀하지 못한다.
        const wa=workarea.getBoundingClientRect();
        const centerX=wa.left+wa.width/2, centerY=wa.top+wa.height/2;
        const anchorX=pinchGesture.startMid.x-centerX-pinchGesture.startPanX;
        const anchorY=pinchGesture.startMid.y-centerY-pinchGesture.startPanY;
        const ratio=nextZoom/Math.max(0.0001,pinchGesture.startZoom);
        viewZoom=nextZoom;
        viewPanX=pinchGesture.startPanX + (mid.x-pinchGesture.startMid.x) + anchorX*(1-ratio);
        viewPanY=pinchGesture.startPanY + (mid.y-pinchGesture.startMid.y) + anchorY*(1-ratio);
        // fit 크기 근처에서는 정확히 원래 보기로 스냅한다.
        if(viewZoom<=1.025){ viewZoom=1; viewPanX=0; viewPanY=0; }
        clampView(); applyViewTransform();
      }
      return;
    }
    if(!waitForAllTouchesUp) onPointerMove(e);
  });
  function finishPointer(e){
    const wasSuppressed=suppressPointerUp.has(e.pointerId);
    activePointers.delete(e.pointerId);
    suppressPointerUp.delete(e.pointerId);
    if(waitForAllTouchesUp && activePointers.size===0) waitForAllTouchesUp=false;
    if(pinchGesture){
      if(activePointers.size<2){
        pinchGesture.ids.forEach(id=>suppressPointerUp.add(id));
        pinchGesture=null;
        if(viewZoom<=1.025){ viewZoom=1; viewPanX=0; viewPanY=0; }
        clampView(); applyViewTransform();
      }
      return;
    }
    if(wasSuppressed || waitForAllTouchesUp || e.type==="pointercancel") {

  // PC: 마우스 휠은 보기 확대/축소 전용. 편집 기능과 연결하지 않는다.
  viewCanvas.addEventListener("wheel", function(e){
    if(!naturalW) return;
    e.preventDefault();
    const factor=Math.exp(-e.deltaY*0.0015);
    setViewZoom(viewZoom*factor,e.clientX,e.clientY);
  },{passive:false});

  function onPointerDown(e){
    if(!naturalW) return;
    e.preventDefault();
    viewCanvas.setPointerCapture && viewCanvas.setPointerCapture(e.pointerId);
    const dp = getDispPoint(e);

    // 기존 항목 선택이 언제나 새 마킹 생성보다 우선한다.
    const selectedEffect = effects.find(x=>x.id===selectedId);
    if(selectedEffect && effectCloseHit(dp, selectedEffect)){ deleteSelected(); return; }
    const selectedObject = objects.find(x=>x.id===selectedId);
    if(selectedObject && objectCloseHit(dp, selectedObject)){ deleteSelected(); return; }
    const effectHandleHit=findEffectHandleAt(dp);
    if(effectHandleHit){
      const eff=effectHandleHit.effect,c=effectCenter(eff),nat=dispToNat(dp);
      if(effectHandleHit.handle==='rotate'){
        drag={mode:'effectRotate',effect:eff,center:c,startAngle:Math.atan2(nat.y-c.y,nat.x-c.x),startRotation:eff.rotation||0};
      }else{
        drag={mode:'effectResize',effect:eff,handle:effectHandleHit.handle,snapshot:deepCloneObjects([eff])[0],bounds:effectBounds(eff)};
      }
      redraw();return;
    }
    const handleHit = findHandleAt(dp);
    if(handleHit){
      selectedId=handleHit.obj.id;
      if(handleHit.handle==="rotate"){
        const c=rectCenter(handleHit.obj), nat=dispToNat(dp);
        drag={mode:"rotate",obj:handleHit.obj,center:c,startAngle:Math.atan2(nat.y-c.y,nat.x-c.x),startRotation:handleHit.obj.rotation||0};
      }else drag={mode:"resize",obj:handleHit.obj,handle:handleHit.handle,startNat:dispToNat(dp),snapshot:Object.assign({},handleHit.obj)};
      buildOptionsBar(); redraw(); return;
    }
    const objHit = findObjectAt(dp);
    if(objHit){ selectedId=objHit.id; strokeMultCurrent=objHit.strokeMult||1; strokePxCurrent=objHit.strokePx||2; dashedCurrent=!!objHit.dashed; drag={mode:"move",obj:objHit,last:dispToNat(dp),snapshot:Object.assign({},objHit)}; buildOptionsBar(); redraw(); return; }
    const eh=findEffectAt(dp);
    if(eh){
      selectedId=eh.id;
      intensity=Number.isFinite(eh.intensity)?eh.intensity:intensity;
      feather=Number.isFinite(eh.feather)?eh.feather:feather;
      blurMode=eh.mode||blurMode;
      blurShape = eh.autoFace || eh.shape==="ellipse" ? "face" : "rect";
      // 블러/모자이크도 생성 후 영역 안을 드래그해 자유롭게 이동한다.
      drag={mode:"effectMove",effect:eh,last:dispToNat(dp)};
      buildOptionsBar(); redraw(); return;
    }

    // 기존 항목이 없는 곳을 누르면 먼저 선택을 해제한다.
    if(selectedId!=null){ selectedId=null; buildOptionsBar(); redraw(); }
    if(activeTool==="blur"){
      drag = {mode:"create", startDisp:dp, curDisp:dp}; redraw(); return;
    }

    if(activeTool==="circle" || activeTool==="arrow" || activeTool==="line"){
      selectedId = null;
      drag = {mode:"create", startDisp:dp, curDisp:dp};
      redraw();
      return;
    }

    // 빈 곳 클릭 -> 선택 해제
    if(selectedId!=null){
      selectedId = null;
      buildOptionsBar();
      redraw();
    }
    drag = null;
  }

  function onPointerMove(e){
    if(!drag) return;
    const dp = getDispPoint(e);
    if(drag.mode==="create"){
      drag.curDisp = dp;
      redraw();
    } else if(drag.mode==="move"){
      const nat = dispToNat(dp);
      const dx = nat.x-drag.last.x, dy = nat.y-drag.last.y;
      const o = drag.obj;
      if(o.type==="circle"){ o.cx+=dx; o.cy+=dy; }
      else if(o.type==="rect"){ o.x+=dx; o.y+=dy; }
      else { o.x1+=dx; o.y1+=dy; o.x2+=dx; o.y2+=dy; }
      drag.last = nat;
      redraw();
    } else if(drag.mode==="effectMove"){
      const nat=dispToNat(dp);
      const dx=nat.x-drag.last.x, dy=nat.y-drag.last.y;
      const eff=drag.effect;
      const b=effectBounds(eff);
      // 효과 전체가 사진 밖으로 사라지지 않도록 이동량을 제한한다.
      const mdx=clamp(dx,-b.x,naturalW-(b.x+b.w));
      const mdy=clamp(dy,-b.y,naturalH-(b.y+b.h));
      eff.rect.x+=mdx; eff.rect.y+=mdy;
      if(eff.faceRects&&eff.faceRects.length) eff.faceRects.forEach(r=>{r.x+=mdx;r.y+=mdy;});

      const nat=dispToNat(dp),snap=drag.snapshot,b=drag.bounds,c={x:b.x+b.w/2,y:b.y+b.h/2},a=snap.rotation||0;
      const local=rotatePoint(nat,c,-a);
      let factor;
      if(drag.handle==='e') factor=(local.x-b.x)/Math.max(1,b.w);
      else if(drag.handle==='w') factor=(b.x+b.w-local.x)/Math.max(1,b.w);
      else if(drag.handle==='s') factor=(local.y-b.y)/Math.max(1,b.h);
      else factor=(b.y+b.h-local.y)/Math.max(1,b.h);
      factor=clamp(factor,Math.max(0.08,4/Math.max(4,Math.min(b.w,b.h))),12);

      const anchorLocal=drag.handle==='e'?{x:b.x,y:c.y}:drag.handle==='w'?{x:b.x+b.w,y:c.y}:drag.handle==='s'?{x:c.x,y:b.y}:{x:c.x,y:b.y+b.h};
      const anchorWorld=rotatePoint(anchorLocal,c,a);
      const centerOffset=drag.handle==='e'?{x:b.w*factor/2,y:0}:drag.handle==='w'?{x:-b.w*factor/2,y:0}:drag.handle==='s'?{x:0,y:b.h*factor/2}:{x:0,y:-b.h*factor/2};
      const newCenter=rotatePoint({x:anchorWorld.x+centerOffset.x,y:anchorWorld.y+centerOffset.y},anchorWorld,a);
      const scaleRect=(src)=>{
        const srcCenter={x:src.x+src.w/2,y:src.y+src.h/2};
        const rel={x:(srcCenter.x-c.x)*factor,y:(srcCenter.y-c.y)*factor};
        return {x:newCenter.x+rel.x-src.w*factor/2,y:newCenter.y+rel.y-src.h*factor/2,w:src.w*factor,h:src.h*factor};
      };
