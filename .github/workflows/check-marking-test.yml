name: Marking production static checks

on:
  push:
    paths:
      - 'index.html'
      - 'src/**'
      - 'scripts/check-test.mjs'
      - '.github/workflows/check-marking-test.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'scripts/check-test.mjs'
      - '.github/workflows/check-marking-test.yml'
  workflow_dispatch:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production index.html syntax and editor structure
        run: node scripts/check-test.mjs
