name: MARKING browser regression

on:
  push:
    paths:
      - 'test.html'
      - 'index.html'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/marking-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify extracted modules and helper behavior
        run: node tests/unit.cjs
      - name: Verify production markup parity
        run: node tests/production-parity.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Start local app server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/marking-server.log 2>&1 &
          echo $! > /tmp/marking-server.pid
      - name: Wait for local app server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/test.html; then
              echo "Local app server ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/marking-server.log
          exit 1
      - name: Run Chromium regression on all screen sizes
        run: node tests/run-browser-regression.cjs
      - name: Run WebKit regression on all screen sizes
        if: always()
        env:
          MARKING_BROWSER: webkit
        run: node tests/run-browser-regression.cjs
      - name: Upload failure screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marking-browser-regression
          path: test-results/
          if-no-files-found: warn
