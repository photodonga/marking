name: MARKING browser regression

on:
  push:
    paths:
      - 'index.html'
      - 'test.html'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/marking-regression.yml'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch main for fixture merge-base
        run: git fetch origin main
      - name: Verify extracted modules and helper behavior
        run: npm test
      - name: Reproduce no-ff merge and verify fixture CI check
        if: github.event_name == 'pull_request'
        run: |
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          git worktree add -b ci-merge-simulation /tmp/marking-merge origin/main
          git -C /tmp/marking-merge -c user.name=CI -c user.email=ci@example.invalid merge --no-ff -m "CI merge simulation" "$PR_HEAD"
          (cd /tmp/marking-merge && CI=1 node tests/check-ui-fixtures.cjs)
          git worktree remove --force /tmp/marking-merge
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false
          npx playwright install --with-deps chromium webkit
      - name: Start local app server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/marking-server.log 2>&1 &
          echo $! > /tmp/marking-server.pid
      - name: Wait for local app server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/index.html; then
              echo "Local app server ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/marking-server.log
          exit 1
      - name: Run Chromium regression on all screen sizes
        run: node tests/run-browser-regression.cjs
      - name: Run WebKit regression on all screen sizes
        if: always()
        env:
          MARKING_BROWSER: webkit
        run: node tests/run-browser-regression.cjs
      - name: Upload failure screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marking-browser-regression
          path: test-results/
          if-no-files-found: warn

  baseline-fixtures:
    # One-time PR run to regenerate and audit the reviewed main baseline; revert to manual after artifact capture.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser tooling
        run: |
          npm install --no-save --package-lock=false
          npx playwright install --with-deps chromium webkit
      - name: Checkout reviewed main SHA as detached worktree
        run: |
          git fetch origin main
          git worktree add --detach /tmp/marking-main 5c05e979af54c1e1f4f3e58ea032163f2147f826
          test "$(git -C /tmp/marking-main rev-parse HEAD)" = "5c05e979af54c1e1f4f3e58ea032163f2147f826"
      - name: Run reviewed main in Linux for baseline collection
        run: |
          cd /tmp/marking-main
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/marking-baseline-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/index.html; then break; fi
            sleep 1
          done
          MARKING_COLLECT_BASELINE=1 MARKING_BASELINE_SHA=5c05e979af54c1e1f4f3e58ea032163f2147f826 node "$GITHUB_WORKSPACE/tests/run-browser-regression.cjs"
          MARKING_BROWSER=webkit MARKING_COLLECT_BASELINE=1 MARKING_BASELINE_SHA=5c05e979af54c1e1f4f3e58ea032163f2147f826 node "$GITHUB_WORKSPACE/tests/run-browser-regression.cjs"
          node "$GITHUB_WORKSPACE/scripts/generate-ui-baseline.cjs" 5c05e979af54c1e1f4f3e58ea032163f2147f826
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-main-browser-fixtures
          path: /tmp/marking-main/tests/fixtures/browser-main.json
          if-no-files-found: error
