<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마킹 v0.8</title>

<style>
  :root{
    --bg-1:#e9edf5;
    --bg-2:#dfe6f5;
    --bg-3:#eef1fb;
    --ink:#1b2233;
    --ink-soft:#5b6478;
    --ink-faint:#8a92a3;
    --accent:#0a6cff;
    --accent-ink:#ffffff;
    --accent-soft:rgba(10,108,255,0.12);
    --glass:rgba(255,255,255,0.58);
    --glass-strong:rgba(255,255,255,0.78);
    --glass-border:rgba(255,255,255,0.75);
    --glass-shadow:rgba(31,41,64,0.14);
    --chip-bg:rgba(255,255,255,0.55);
    --chip-border:rgba(27,34,51,0.10);
    --danger:#ff453a;
    --radius-lg:24px;
    --radius-md:16px;
    --radius-sm:12px;
    --canvas-bg:#1c1c1e;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-1:#14151c; --bg-2:#1b1f2e; --bg-3:#101319;
      --ink:#eef0f6; --ink-soft:#a7adbd; --ink-faint:#6b7182;
      --accent:#3d8bff; --accent-soft:rgba(61,139,255,0.18);
      --glass:rgba(36,40,54,0.55); --glass-strong:rgba(40,44,58,0.78);
      --glass-border:rgba(255,255,255,0.08); --glass-shadow:rgba(0,0,0,0.4);
      --chip-bg:rgba(255,255,255,0.07); --chip-border:rgba(255,255,255,0.10);
      --canvas-bg:#1c1c1e;
    }
  }
  :root[data-theme="dark"]{
    --bg-1:#14151c; --bg-2:#1b1f2e; --bg-3:#101319;
    --ink:#eef0f6; --ink-soft:#a7adbd; --ink-faint:#6b7182;
    --accent:#3d8bff; --accent-soft:rgba(61,139,255,0.18);
    --glass:rgba(36,40,54,0.55); --glass-strong:rgba(40,44,58,0.78);
    --glass-border:rgba(255,255,255,0.08); --glass-shadow:rgba(0,0,0,0.4);
    --chip-bg:rgba(255,255,255,0.07); --chip-border:rgba(255,255,255,0.10);
    --canvas-bg:#1c1c1e;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--canvas-bg);
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    user-select:none;
  }
  #app{
    position:relative;
    height:100%;
    overflow:hidden;
    padding-left:var(--safe-l);
    padding-right:var(--safe-r);
  }

  /* ---------- floating glass chrome ---------- */
  #chrome{
    position:absolute;
    top:calc(12px + var(--safe-t));
    left:12px;
    right:12px;
    z-index:20;
    display:flex;
    flex-direction:column;
    gap:8px;
    pointer-events:none;
  }
  #toolbar, #options-bar{ pointer-events:auto; }

  #toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    background:linear-gradient(135deg, rgba(255,255,255,.72), rgba(255,255,255,.48));
    backdrop-filter:blur(28px) saturate(190%);
    -webkit-backdrop-filter:blur(28px) saturate(190%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-lg);
    box-shadow:0 12px 34px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.55);
    overflow-x:auto;
    scrollbar-width:none;
  }
  #toolbar::-webkit-scrollbar{display:none;}
  .brand{
    font-size:17px;
    font-weight:750;
    letter-spacing:-0.01em;
    white-space:nowrap;
    padding:0 8px 0 8px;
    color:var(--ink);
  }
  .tools{display:flex;align-items:center;gap:4px;flex:1;min-width:0;}
  .sep{width:1px;height:20px;background:var(--chip-border);margin:0 4px;flex:0 0 auto;}
  .tool-btn{
    display:flex;align-items:center;gap:6px;
    border:1px solid transparent;
    background:transparent;
    color:var(--ink);
    font-size:13.5px;
    font-family:inherit;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .tool-btn .glyph{font-size:14px;line-height:1;}
  .tool-btn:hover{background:var(--chip-bg);border-color:var(--chip-border);}
  .tool-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .icon-btn{
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--chip-border);
    background:var(--chip-bg);
    color:var(--ink-soft);
    font-size:15px;
    border-radius:50%;
    cursor:pointer;
    flex:0 0 auto;
  }
  .icon-btn:hover{background:var(--accent-soft);color:var(--accent);}
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn:disabled{opacity:.32;cursor:default;}
  .icon-btn:disabled:hover{background:var(--chip-bg);color:var(--ink-soft);}
  .save-group{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  #format-select{
    border:1px solid var(--chip-border);
    background:var(--chip-bg);
    color:var(--ink);
    font-size:13px;
    font-family:inherit;
    padding:7px 9px;
    border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .save-btn{
    border:none;
    background:linear-gradient(135deg, var(--accent), #5aa2ff);
    color:#fff;
    font-size:13.5px;
    font-weight:650;
    font-family:inherit;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 8px 20px rgba(10,108,255,0.30);
  }
  .save-btn:hover{filter:brightness(1.05);}
  .save-btn:disabled{opacity:.35;cursor:default;filter:none;box-shadow:none;}
  .save-btn:active{transform:scale(0.98);}

  /* ---------- options bar ---------- */
  #options-bar{
    display:flex;
    align-items:center;
    gap:18px;
    padding:9px 16px;
    background:var(--glass);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-md);
    box-shadow:0 8px 22px var(--glass-shadow);
    font-size:12.5px;
    color:var(--ink-soft);
    overflow-x:auto;
    scrollbar-width:none;
  }
  #options-bar::-webkit-scrollbar{display:none;}
  #options-bar.hidden{display:none;}
  .opt-group{display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .seg{
    display:flex;
    background:var(--chip-bg);
    border:1px solid var(--chip-border);
    border-radius:var(--radius-sm);
    padding:3px;
    gap:3px;
  }
  .seg button{
    border:none;background:transparent;color:var(--ink-soft);
    font-family:inherit;font-size:12.5px;font-weight:600;
    padding:6px 12px;cursor:pointer;
    border-radius:9px;
  }
  .seg button.active{background:var(--accent);color:var(--accent-ink);}
  input[type="range"]{
    -webkit-appearance:none;appearance:none;
    width:110px;height:3px;border-radius:2px;
    background:var(--chip-border);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    border:2px solid var(--glass-strong);
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  input[type="range"]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:2px solid var(--glass-strong);
  }
  input[type="color"]{
    -webkit-appearance:none;appearance:none;
    width:26px;height:26px;
    padding:0;
    border:1px solid var(--chip-border);
    border-radius:var(--radius-sm);
    cursor:pointer;
    background:none;
  }
  input[type="color"]::-webkit-color-swatch-wrapper{padding:3px;}
  input[type="color"]::-webkit-color-swatch{border:none;border-radius:8px;}
  input[type="color"]::-moz-color-swatch{border:none;border-radius:8px;}
  .check-opt{cursor:pointer;}
  .check-opt input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;}

  /* ---------- work area ---------- */
  #workarea{
    position:absolute;
    inset:0;
    background:var(--canvas-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:none;
  }
  #placeholder{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    color:#8a8a90;
    cursor:pointer;
  }
  #placeholder .ph-icon{
    width:56px;height:56px;border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:1.5px solid rgba(255,255,255,0.18);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#b7b7bc;
  }
  #placeholder p{margin:0;font-size:14px;letter-spacing:.2px;}
  #placeholder .ph-sub{margin:0;font-size:12.5px;color:#6f6f76;letter-spacing:.1px;}
  #placeholder.hidden{display:none;}
  #placeholder.dragover .ph-icon{border-color:var(--accent);color:var(--accent);background:rgba(61,139,255,0.10);}
  #placeholder.dragover p{color:var(--accent);}

  #view-canvas{
    display:none;
    touch-action:none;
    max-width:100%;
    max-height:100%;
  }
  #view-canvas.ready{display:block;}

  #toast{
    position:absolute;
    bottom:calc(24px + var(--safe-b));
    left:50%;
    transform:translateX(-50%) translateY(6px);
    background:rgba(20,22,30,0.9);
    color:#fff;
    font-size:13px;
    font-weight:600;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    white-space:nowrap;
    z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- desktop: toolbar + tool options in one glass row ---------- */
  @media (min-width:641px){
    #chrome{gap:0;}
    #toolbar{overflow-x:auto;}
    #toolbar #options-bar{
      flex:0 1 auto;
      min-width:0;
      gap:12px;
      padding:0 4px;
      margin-left:2px;
      background:transparent;
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
      border:0;
      border-radius:0;
      box-shadow:none;
      overflow:visible;
    }
    #toolbar #options-bar:not(.hidden){display:flex;}
    #toolbar #options-bar .opt-group{gap:6px;}
    #toolbar #options-bar .seg{padding:2px;gap:2px;}
    #toolbar #options-bar .seg button{padding:5px 9px;font-size:12px;}
    #toolbar #options-bar input[type="range"]{width:86px;}
    #toolbar .save-group{margin-left:auto;}
  }

  /* Wide desktop: keep the controls together instead of stretching them edge-to-edge.
     Medium/tablet layouts keep the flexible behavior above so nothing gets crushed. */
  @media (min-width:900px){
    #toolbar{
      justify-content:center;
    }
    #toolbar .tools{
      flex:0 0 auto;
      min-width:max-content;
    }
    #toolbar #options-bar{
      flex:0 1 auto;
    }
    #toolbar .save-group{
      margin-left:8px;
      flex:0 0 auto;
    }
  }

  @media (max-width:640px){
    #chrome{top:calc(6px + var(--safe-t));left:6px;right:6px;gap:4px;}
    .brand{display:none;}
    #toolbar{gap:4px;padding:5px 6px;border-radius:20px;}
    .tools{gap:2px;}
    .tool-btn{padding:6px 8px;font-size:12px;}
    .tool-btn .label{display:none;}
    .icon-btn{width:31px;height:31px;}
    .save-group{gap:5px;}
    #format-select{padding:6px 7px;font-size:12px;}
    .save-btn{padding:7px 12px;font-size:12.5px;}
    #options-bar{gap:10px;padding:6px 9px;border-radius:14px;font-size:11.5px;}
    #options-bar .opt-group{gap:5px;}
    #options-bar .seg{padding:2px;gap:2px;}
    #options-bar .seg button{padding:5px 9px;font-size:11.5px;}
    #options-bar input[type="range"]{width:78px;}
  }
  /* ---------- footer notice ---------- */
  #footer-note{
    position:absolute;
    left:50%;
    bottom:calc(10px + var(--safe-b));
    transform:translateX(-50%);
    z-index:12;
    width:min(94vw, 980px);
    text-align:center;
    color:rgba(255,255,255,.50);
    font-size:10.5px;
    line-height:1.55;
    letter-spacing:-.01em;
    pointer-events:none;
  }
  #footer-note .guide{margin-bottom:2px;}
  #footer-note .shortcut{color:rgba(255,255,255,.40);}
  #footer-note .privacy{margin-top:2px;color:rgba(255,255,255,.40);}
  #footer-note .copyright{color:rgba(255,255,255,.30);}
  /* Wide desktop: keep the controls together instead of stretching them edge-to-edge.
     Medium/tablet layouts keep the flexible behavior above so nothing gets crushed. */
  @media (min-width:900px){
    #toolbar{
      justify-content:center;
    }
    #toolbar .tools{
      flex:0 0 auto;
      min-width:max-content;
    }
    #toolbar #options-bar{
      flex:0 1 auto;
    }
    #toolbar .save-group{
      margin-left:8px;
      flex:0 0 auto;
    }
  }

  @media (max-width:640px){
    #footer-note{bottom:calc(6px + var(--safe-b));font-size:9.5px;line-height:1.45;width:96vw;}
    #footer-note .desktop-guide{display:none;}
  }

</style>
</head>
<body>
<div id="app">
  <div id="chrome">
    <header id="toolbar">
      <div class="brand">마킹</div>
      <div class="tools">
        <button class="tool-btn" data-tool="blur" id="btn-blur"><span class="glyph">▦</span><span class="label">가림</span></button>
        <button class="tool-btn" data-tool="circle" id="btn-circle"><span class="glyph">◇</span><span class="label">도형</span></button>
        <button class="tool-btn" data-tool="arrow" id="btn-arrow"><span class="glyph">→</span><span class="label">화살표</span></button>
        <span class="sep"></span>
        <button class="icon-btn" id="btn-undo" title="실행 취소 (Ctrl+Z)" disabled>↶</button>
        <button class="icon-btn" id="btn-redo" title="다시 실행 (Ctrl+Shift+Z)" disabled>↷</button>
        <button class="icon-btn" id="btn-clear-photo" title="사진 지우기" disabled>⌫</button>
      </div>
      <div class="save-group">
        <select id="format-select">
          <option value="jpeg">JPEG</option>
          <option value="png">PNG</option>
        </select>
        <button class="save-btn" id="btn-save" disabled>저장</button>
      </div>
    </header>

    <div id="options-bar" class="hidden"></div>
  </div>

  <main id="workarea">
    <div id="placeholder">
      <div class="ph-icon">＋</div>
      <p>클릭하거나 사진을 놓아주세요</p>
      <p class="ph-sub">가리고 · 표시하고 · 바로 저장</p>
    </div>
    <canvas id="view-canvas"></canvas>
    <div id="toast"></div>
  </main>


  <div id="footer-note" aria-hidden="true">
    <div class="privacy">사진은 서버에 업로드되지 않고 이 기기에서만 처리됩니다.</div>
    <div class="copyright">Copyright by 송은석. All Rights Reserved.</div>
  </div>

  <input type="file" id="file-input" accept="image/png,image/jpeg,image/jpg" hidden>
</div>

<script>
(function(){
  "use strict";

  // ---------------- constants ----------------
  const STROKE_RATIO = 0.0037;      // 선 굵기 = 긴 변 * 0.37%
  const HANDLE_SCREEN_SIZE = 9;      // 화면상 핸들 크기(px, 스케일 무관)
  const HIT_TOLERANCE = 10;          // 화면상 클릭 허용 오차(px)
  const MAX_HISTORY = 40;
  const DEFAULT_COLOR = "#e0402f";

  // ---------------- state ----------------
  let naturalW = 0, naturalH = 0;
  let rasterCanvas = document.createElement("canvas");
  let rasterCtx = rasterCanvas.getContext("2d");

  let objects = [];          // {id,type:'circle'|'arrow', ...coords, strokeMult}
  let effects = [];          // 비파괴 가림 효과 {id,type:'effect',rect,faceRects,autoFace,mode,shape,intensity,feather}
  let selectedId = null;
  let nextObjId = 1;

  let activeTool = null;     // 'blur' | 'circle' | 'arrow' | null(선택모드)
  let blurMode = "blur";     // 'blur' | 'mosaic'
  let blurShape = "ellipse"; // 기본 가림은 소프트 타원형
  let intensity = 50;        // 0-100
  let feather = 72;          // 0-100, 기본은 경계가 드러나지 않는 강한 페더
  let pendingEffect = null;  // 아직 확정되지 않은 가림 효과: {rect, canvas, sx, sy}
  let strokeMultCurrent = 1; // 새 객체 생성 시 두께 배율
  let strokeColorCurrent = DEFAULT_COLOR; // 새 객체 생성 시 색상
  let circleLocked = false;  // true면 도형을 항상 1:1로 생성/조절
  let shapeKind = "circle";    // circle | rect

  let scale = 1;             // base display / natural (export coordinates are unaffected)
  let dispW = 0, dispH = 0;

  // 보기 전용 확대/이동. 편집 좌표와 저장 해상도에는 영향을 주지 않는다.
  let viewZoom = 1;
  let viewPanX = 0, viewPanY = 0;
  const MIN_VIEW_ZOOM = 1, MAX_VIEW_ZOOM = 6;
  const activePointers = new Map();
  let pinchGesture = null;
  let suppressPointerUp = new Set();

  let rasterStates = [];     // dataURL 배열
  let history = [];          // {rasterStateIndex, objects:[...]}
  let historyIndex = -1;

  let drag = null;           // 진행중인 포인터 상호작용 상태
  let faceDebugPoints = [];  // 얼굴 인식 중심점 표시용(원본 좌표)
  let faceDebugTimer = null;

  let rafPending = false;

  // ---------------- dom ----------------
  const workarea = document.getElementById("workarea");
  const placeholder = document.getElementById("placeholder");
  const viewCanvas = document.getElementById("view-canvas");
  const vctx = viewCanvas.getContext("2d");
  const fileInput = document.getElementById("file-input");
  const optionsBar = document.getElementById("options-bar");
  const toolbarEl = document.getElementById("toolbar");
  const saveGroupEl = toolbarEl.querySelector(".save-group");
  const chromeEl = document.getElementById("chrome");

  // PC에서는 도구 옵션을 메인 툴바 안에 합치고, 모바일에서는 기존 2단 구조를 유지한다.
  function syncOptionsBarLayout(){
    const desktop = window.matchMedia("(min-width: 641px)").matches;
    if(desktop){
      if(optionsBar.parentElement !== toolbarEl) toolbarEl.insertBefore(optionsBar, saveGroupEl);
    }else{
      if(optionsBar.parentElement !== chromeEl) chromeEl.appendChild(optionsBar);
    }
  }
  syncOptionsBarLayout();
  window.addEventListener("resize", syncOptionsBarLayout, {passive:true});
  const btnUndo = document.getElementById("btn-undo");
  const btnRedo = document.getElementById("btn-redo");
  const btnClearPhoto = document.getElementById("btn-clear-photo");
  const btnSave = document.getElementById("btn-save");
  const formatSelect = document.getElementById("format-select");
  const toastEl = document.getElementById("toast");

  const toolButtons = {
    blur: document.getElementById("btn-blur"),
    circle: document.getElementById("btn-circle"),
    arrow: document.getElementById("btn-arrow"),
  };

  // ---------------- utils ----------------
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function longSide(){ return Math.max(naturalW, naturalH); }
  function strokeWidthNatural(mult){ return longSide() * STROKE_RATIO * (mult||1); }
  // 가림 강도는 사진 전체 크기가 아니라 현재 가림 영역 크기를 기준으로 계산한다.
  // 0은 거의 변화 없음, 50은 일반적인 익명화, 100은 강한 익명화가 되도록 비선형 매핑.
  function blurRadiusNatural(rect){
    // 익명화용 블러: 낮은 슬라이더 값에서도 이목구비가 남지 않도록 최소 강도를 확보한다.
    // 기준은 사진 전체가 아니라 가림 영역의 짧은 변. 10≈6.5%, 50≈11%, 100≈17%.
    const base = Math.max(8, Math.min(rect.w, rect.h));
    const t = clamp(intensity/100, 0, 1);
    if(t<=0) return 0;
    return base * (0.052 + 0.118*Math.pow(t, 0.82));
  }
  function mosaicBlockNatural(rect){
    const base = Math.max(8, Math.min(rect.w, rect.h));
    const t = clamp(intensity/100, 0, 1);
    if(t<=0) return 1;
    return Math.max(2, base * (0.008 + 0.12*Math.pow(t, 1.25)));
  }
  function deepCloneObjects(arr){ return arr.map(o=>Object.assign({},o, o.faceRects ? {faceRects:o.faceRects.map(r=>Object.assign({},r))} : {})); }
  function genId(){ return nextObjId++; }
  function showToast(msg, ms){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toastEl.classList.remove("show"), ms||2200);
  }

  // ---------------- history ----------------
  function pushHistory(newRaster){
    let rasterStateIndex;
    if(newRaster){
      rasterStates.push(rasterCanvas.toDataURL("image/png"));
      rasterStateIndex = rasterStates.length - 1;
      if(rasterStates.length > MAX_HISTORY){
        // 오래된 항목은 유지하되(참조 인덱스 보존을 위해) 정리는 생략 - 사진 편집 세션은 짧으므로 메모리 여유 내에서 동작
      }
    } else {
      rasterStateIndex = history[historyIndex] ? history[historyIndex].rasterStateIndex : 0;
    }
    history = history.slice(0, historyIndex+1);
    history.push({ rasterStateIndex, objects: deepCloneObjects(objects), effects: deepCloneObjects(effects) });
    if(history.length > MAX_HISTORY){ history.shift(); }
    historyIndex = history.length - 1;
    updateHistoryButtons();
  }

  function restoreHistoryEntry(entry, cb){
    const dataUrl = rasterStates[entry.rasterStateIndex];
    const img = new Image();
    img.onload = function(){
      naturalW = img.naturalWidth; naturalH = img.naturalHeight;
      rasterCanvas.width = naturalW; rasterCanvas.height = naturalH;
      rasterCtx.clearRect(0,0,naturalW,naturalH);
      rasterCtx.drawImage(img,0,0);
      objects = deepCloneObjects(entry.objects);
      effects = deepCloneObjects(entry.effects || []);
      selectedId = null;
      fitCanvas();
      redraw();
      if(cb) cb();
    };
    img.src = dataUrl;
  }

  function undo(){
    if(pendingEffect){ discardPendingEffect(); redraw(); return; }
    if(historyIndex<=0) return;
    historyIndex--;
    restoreHistoryEntry(history[historyIndex]);
    updateHistoryButtons();
  }
  function redo(){
    discardPendingEffect();
    if(historyIndex>=history.length-1) return;
    historyIndex++;
    restoreHistoryEntry(history[historyIndex]);
    updateHistoryButtons();
  }
  function updateHistoryButtons(){
    btnUndo.disabled = historyIndex<=0;
    btnRedo.disabled = historyIndex>=history.length-1;
  }

  // ---------------- image loading ----------------
  function loadImageFile(file){
    if(!file || !/^image\/(png|jpe?g)$/i.test(file.type)) return;
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        discardPendingEffect();
        naturalW = img.naturalWidth;
        naturalH = img.naturalHeight;
        rasterCanvas.width = naturalW;
        rasterCanvas.height = naturalH;
        rasterCtx.clearRect(0,0,naturalW,naturalH);
        rasterCtx.drawImage(img,0,0);
        objects = [];
        effects = [];
        selectedId = null;
        rasterStates = [];
        history = [];
        historyIndex = -1;
        pushHistory(true);
        placeholder.classList.add("hidden");
        viewCanvas.classList.add("ready");
        btnSave.disabled = false;
        btnClearPhoto.disabled = false;
        setActiveTool(null);
        resetView();
        fitCanvas();
        redraw();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  placeholder.addEventListener("click", ()=> fileInput.click());
  fileInput.addEventListener("change", ()=>{
    if(fileInput.files && fileInput.files[0]) loadImageFile(fileInput.files[0]);
    fileInput.value = "";
  });
  ["dragenter","dragover"].forEach(ev=>{
    workarea.addEventListener(ev, e=>{
      e.preventDefault();
      placeholder.classList.add("dragover");
    });
  });
  ["dragleave","drop"].forEach(ev=>{
    workarea.addEventListener(ev, e=>{
      e.preventDefault();
      placeholder.classList.remove("dragover");
    });
  });
  workarea.addEventListener("drop", e=>{
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) loadImageFile(f);
  });

  // ---------------- layout ----------------
  function applyViewTransform(){
    // CSS transform만 사용하므로 원본/마킹 좌표와 JPEG·PNG 결과는 변하지 않는다.
    viewCanvas.style.transformOrigin = "50% 50%";
    viewCanvas.style.transform = `translate(${viewPanX}px, ${viewPanY}px) scale(${viewZoom})`;
  }
  function resetView(){
    viewZoom=1; viewPanX=0; viewPanY=0;
    applyViewTransform();
  }
  function clampView(){
    if(viewZoom<=1.001){ viewZoom=1; viewPanX=0; viewPanY=0; return; }
    // 사진이 화면에서 완전히 사라지지 않을 정도로 이동 범위를 제한한다.
    const maxX=Math.max(0,(dispW*viewZoom-workarea.clientWidth)/2 + workarea.clientWidth*0.42);
    const maxY=Math.max(0,(dispH*viewZoom-workarea.clientHeight)/2 + workarea.clientHeight*0.42);
    viewPanX=clamp(viewPanX,-maxX,maxX);
    viewPanY=clamp(viewPanY,-maxY,maxY);
  }
  function setViewZoom(nextZoom, clientX, clientY){
    const old=viewZoom;
    nextZoom=clamp(nextZoom,MIN_VIEW_ZOOM,MAX_VIEW_ZOOM);
    if(Math.abs(nextZoom-old)<0.0001) return;
    // 포인터 아래의 사진 위치가 가능한 한 그대로 남도록 pan을 보정한다.
    const wa=workarea.getBoundingClientRect();
    const cx=clientX==null ? wa.left+wa.width/2 : clientX;
    const cy=clientY==null ? wa.top+wa.height/2 : clientY;
    const centerX=wa.left+wa.width/2, centerY=wa.top+wa.height/2;
    const localX=cx-centerX-viewPanX, localY=cy-centerY-viewPanY;
    const ratio=nextZoom/old;
    viewPanX += localX*(1-ratio);
    viewPanY += localY*(1-ratio);
    viewZoom=nextZoom;
    clampView(); applyViewTransform();
  }
  function fitCanvas(){
    if(!naturalW) return;
    const wrapW = workarea.clientWidth - 24;
    const wrapH = workarea.clientHeight - 24;
    let s = Math.min(wrapW/naturalW, wrapH/naturalH);
    s = Math.min(s, 1);
    if(!isFinite(s) || s<=0) s = 1;
    scale = s;
    dispW = Math.round(naturalW*scale);
    dispH = Math.round(naturalH*scale);
    const dpr = window.devicePixelRatio || 1;
    viewCanvas.width = Math.round(dispW*dpr);
    viewCanvas.height = Math.round(dispH*dpr);
    viewCanvas.style.width = dispW+"px";
    viewCanvas.style.height = dispH+"px";
    vctx.setTransform(dpr,0,0,dpr,0,0);
    clampView(); applyViewTransform();
  }
  window.addEventListener("resize", ()=>{ fitCanvas(); redraw(); });

  // ---------------- drawing helpers ----------------
  function drawArrowShape(ctx, x1,y1,x2,y2, sw, color){
    const angle = Math.atan2(y2-y1, x2-x1);
    const arrowLen = Math.hypot(x2-x1, y2-y1);
    // 화살촉 크기는 현재 그려지는 선 굵기와 화살표 길이를 기준으로 계산한다.
    // 화면 미리보기에서도 원본 사진의 natural size를 참조하지 않아 과도하게 커지지 않는다.
    const headLen = Math.min(Math.max(sw*4.2, arrowLen*0.055), arrowLen*0.14);
    const headHalfAngle = Math.PI/7.2; // 약 25°: 작고 날렵한 화살촉
    const shortenX = Math.cos(angle)*headLen*0.62;
    const shortenY = Math.sin(angle)*headLen*0.62;
    ctx.lineWidth = sw;
    ctx.strokeStyle = color;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2-shortenX, y2-shortenY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-headLen*Math.cos(angle-headHalfAngle), y2-headLen*Math.sin(angle-headHalfAngle));
    ctx.lineTo(x2-headLen*Math.cos(angle+headHalfAngle), y2-headLen*Math.sin(angle+headHalfAngle));
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }
  function drawCircleShape(ctx, cx,cy,rx,ry, sw, color){
    ctx.lineWidth = sw;
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.ellipse(cx,cy,Math.max(1,rx),Math.max(1,ry),0,0,Math.PI*2);
    ctx.stroke();
  }

  function objectBoundsNatural(o){
    if(o.type==="circle") return {x:o.cx-o.rx, y:o.cy-o.ry, w:o.rx*2, h:o.ry*2};
    if(o.type==="rect") return {x:o.x, y:o.y, w:o.w, h:o.h};
    return {x:Math.min(o.x1,o.x2), y:Math.min(o.y1,o.y2), w:Math.abs(o.x2-o.x1), h:Math.abs(o.y2-o.y1)};
  }

  function drawObjectOnCtx(ctx, o, s){
    const sw = strokeWidthNatural(o.strokeMult) * s;
    const col = o.color || DEFAULT_COLOR;
    if(o.type==="circle"){
      drawCircleShape(ctx, o.cx*s, o.cy*s, o.rx*s, o.ry*s, sw, col);
    } else if(o.type==="rect"){
      ctx.save(); ctx.lineWidth=sw; ctx.strokeStyle=col; ctx.lineJoin="round";
      ctx.strokeRect(o.x*s,o.y*s,o.w*s,o.h*s); ctx.restore();
    } else {
      drawArrowShape(ctx, o.x1*s, o.y1*s, o.x2*s, o.y2*s, sw, col);
    }
  }

  function drawHandles(ctx, o, s){
    ctx.save();
    const hs = HANDLE_SCREEN_SIZE;
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = var_accent_blue();
    ctx.lineWidth = 1.5;
    const pts = handlePointsDisplay(o, s);
    pts.forEach(p=>{
      ctx.beginPath();
      ctx.rect(p.x-hs/2, p.y-hs/2, hs, hs);
      ctx.fill();
      ctx.stroke();
    });
    ctx.restore();
  }
  function objectClosePoint(o){
    // 크기 조절점과 삭제 X가 겹치지 않도록 X는 선택 영역 바깥에 둔다.
    // 화살표는 긴 바운딩박스 모서리보다 화살촉 근처가 훨씬 직관적이다.
    const margin=17;
    if(o.type==="arrow"){
      const x1=o.x1*scale,y1=o.y1*scale,x2=o.x2*scale,y2=o.y2*scale;
      const dx=x2-x1,dy=y2-y1,len=Math.max(1,Math.hypot(dx,dy));
      let cx=x2 + (-dy/len)*margin, cy=y2 + (dx/len)*margin;
      cx=clamp(cx,13,dispW-13); cy=clamp(cy,13,dispH-13);
      return {x:cx,y:cy};
    }
    const b=objectBoundsNatural(o), x=(b.x+b.w)*scale, y=b.y*scale;
    return {x:clamp(x+margin,13,dispW-13), y:clamp(y-margin,13,dispH-13)};
  }
  function drawObjectSelection(ctx,o){
    const b=objectBoundsNatural(o), x=b.x*scale,y=b.y*scale,w=b.w*scale,h=b.h*scale;
    ctx.save(); ctx.setLineDash([6,5]); ctx.lineWidth=1.2; ctx.strokeStyle='rgba(255,255,255,.9)';
    ctx.strokeRect(x,y,w,h); ctx.setLineDash([]);
    const r=11,cp=objectClosePoint(o),cx=cp.x,cy=cp.y; ctx.fillStyle='rgba(28,28,30,.92)'; ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(cx-4,cy-4);ctx.lineTo(cx+4,cy+4);ctx.moveTo(cx+4,cy-4);ctx.lineTo(cx-4,cy+4);ctx.stroke();ctx.restore();
  }
  function objectCloseHit(dp,o){ const cp=objectClosePoint(o); return Math.hypot(dp.x-cp.x,dp.y-cp.y)<=20; }

  function var_accent_blue(){ return getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#0a6cff"; }

  function handlePointsDisplay(o, s){
    if(o.type==="circle" || o.type==="rect"){
      const b = objectBoundsNatural(o);
      return [
        {x:b.x*s, y:b.y*s, k:"nw"},
        {x:(b.x+b.w)*s, y:b.y*s, k:"ne"},
        {x:b.x*s, y:(b.y+b.h)*s, k:"sw"},
        {x:(b.x+b.w)*s, y:(b.y+b.h)*s, k:"se"},
      ];
    } else {
      return [
        {x:o.x1*s, y:o.y1*s, k:"p1"},
        {x:o.x2*s, y:o.y2*s, k:"p2"},
      ];
    }
  }

  function redraw(){
    if(rafPending) return;
    rafPending = true;
    requestAnimationFrame(()=>{
      rafPending = false;
      doRedraw();
    });
  }

  function doRedraw(){
    if(!naturalW) return;
    vctx.clearRect(0,0,dispW,dispH);
    vctx.drawImage(rasterCanvas, 0,0,naturalW,naturalH, 0,0,dispW,dispH);

    // 저장 전까지 가림 효과는 원본에 합치지 않고 비파괴 객체로 렌더링한다.
    effects.forEach(eff=>{
      const rendered = renderEffectObject(eff);
      if(rendered && rendered.canvas){
        vctx.drawImage(rendered.canvas, 0,0,rendered.canvas.width,rendered.canvas.height,
          rendered.sx*scale, rendered.sy*scale, rendered.canvas.width*scale, rendered.canvas.height*scale);
      }
      if(eff.id===selectedId) drawEffectSelection(vctx, eff);
    });

    if(pendingEffect && pendingEffect.canvas){
      const pc = pendingEffect.canvas;
      vctx.drawImage(pc, 0,0,pc.width,pc.height,
        pendingEffect.sx*scale, pendingEffect.sy*scale, pc.width*scale, pc.height*scale);
      const r = pendingEffect.rect;
      vctx.save();
      vctx.setLineDash([5,4]);
      vctx.lineWidth = 1.5;
      vctx.strokeStyle = "rgba(255,255,255,0.85)";
      vctx.strokeRect(r.x*scale, r.y*scale, r.w*scale, r.h*scale);
      vctx.restore();
    }

    objects.forEach(o=>{
      drawObjectOnCtx(vctx, o, scale);
      if(o.id===selectedId){
        drawObjectSelection(vctx,o);
        drawHandles(vctx, o, scale);
      }
    });

    // 진행중인 미리보기
    if(drag && drag.mode==="create"){
      vctx.save();
      if(activeTool==="blur"){
        const r = normRect(drag.startDisp, drag.curDisp);
        vctx.setLineDash([5,4]);
        vctx.lineWidth = 1.5;
        vctx.strokeStyle = "#ffffff";
        vctx.fillStyle = "rgba(255,255,255,0.10)";
        if(blurShape==="ellipse"){
          vctx.beginPath();
          vctx.ellipse(r.x+r.w/2, r.y+r.h/2, r.w/2, r.h/2, 0,0,Math.PI*2);
          vctx.fill(); vctx.stroke();
        } else {
          vctx.fillRect(r.x,r.y,r.w,r.h);
          vctx.strokeRect(r.x,r.y,r.w,r.h);
        }
      } else if(activeTool==="circle"){
        let r;
        if(circleLocked){
          const ddx = drag.curDisp.x-drag.startDisp.x, ddy = drag.curDisp.y-drag.startDisp.y;
          const size = Math.max(Math.abs(ddx),Math.abs(ddy));
          const signX = ddx>=0?1:-1, signY = ddy>=0?1:-1;
          const ep = {x:drag.startDisp.x+signX*size, y:drag.startDisp.y+signY*size};
          r = normRect(drag.startDisp, ep);
        } else {
          r = normRect(drag.startDisp, drag.curDisp);
        }
        if(shapeKind==="rect"){
          vctx.lineWidth=strokeWidthNatural(strokeMultCurrent)*scale; vctx.strokeStyle=strokeColorCurrent; vctx.strokeRect(r.x,r.y,r.w,r.h);
        } else {
          const cx=r.x+r.w/2, cy=r.y+r.h/2;
          drawCircleShape(vctx, cx, cy, r.w/2, r.h/2, strokeWidthNatural(strokeMultCurrent)*scale, strokeColorCurrent);
        }
      } else if(activeTool==="arrow"){
        drawArrowShape(vctx, drag.startDisp.x, drag.startDisp.y, drag.curDisp.x, drag.curDisp.y, strokeWidthNatural(strokeMultCurrent)*scale, strokeColorCurrent);
      }
      vctx.restore();
    }

    // 가림 범위를 놓은 직후, 실제로 인식된 얼굴 중심을 잠깐 파란 점으로 보여준다.
    if(faceDebugPoints.length){
      vctx.save();
      faceDebugPoints.forEach(p=>{
        const x=p.x*scale, y=p.y*scale;
        vctx.beginPath(); vctx.arc(x,y,6,0,Math.PI*2);
        vctx.fillStyle="#0a84ff"; vctx.fill();
        vctx.lineWidth=2; vctx.strokeStyle="rgba(255,255,255,.95)"; vctx.stroke();
      });
      vctx.restore();
    }
  }

  function effectBounds(eff){
    const rs = eff.faceRects && eff.faceRects.length ? eff.faceRects : [eff.rect];
    const x1=Math.min(...rs.map(r=>r.x)), y1=Math.min(...rs.map(r=>r.y));
    const x2=Math.max(...rs.map(r=>r.x+r.w)), y2=Math.max(...rs.map(r=>r.y+r.h));
    return {x:x1,y:y1,w:x2-x1,h:y2-y1};
  }

  function effectClosePoint(eff){
    const b=effectBounds(eff), margin=17;
    return {x:clamp((b.x+b.w)*scale+margin,13,dispW-13), y:clamp(b.y*scale-margin,13,dispH-13)};
  }
  function drawEffectSelection(ctx, eff){
    const b=effectBounds(eff), x=b.x*scale,y=b.y*scale,w=b.w*scale,h=b.h*scale;
    ctx.save(); ctx.setLineDash([6,5]); ctx.lineWidth=1.5; ctx.strokeStyle='rgba(255,255,255,.95)';
    ctx.strokeRect(x,y,w,h); ctx.setLineDash([]);
    const r=11, cp=effectClosePoint(eff), cx=cp.x, cy=cp.y;
    ctx.fillStyle='rgba(28,28,30,.92)'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(cx-4,cy-4);ctx.lineTo(cx+4,cy+4);ctx.moveTo(cx+4,cy-4);ctx.lineTo(cx-4,cy+4);ctx.stroke();
    ctx.restore();
  }

  function effectCloseHit(dp, eff){
    const cp=effectClosePoint(eff);
    return Math.hypot(dp.x-cp.x,dp.y-cp.y)<=20;
  }

  function findEffectAt(dp){
    // 모바일 재선택 여유는 주되, 타원형 가림의 빈 모서리까지 잡히지는 않게 한다.
    const tolPx = 18, x=dp.x/scale, y=dp.y/scale;
    for(let i=effects.length-1;i>=0;i--){
      const e=effects[i];
      const rs=e.faceRects&&e.faceRects.length?e.faceRects:[e.rect];
      for(const r of rs){
        if((e.shape||"ellipse")==="ellipse"){
          const rx=Math.max(1,r.w*scale/2+tolPx), ry=Math.max(1,r.h*scale/2+tolPx);
          const cx=(r.x+r.w/2)*scale, cy=(r.y+r.h/2)*scale;
          const dx=(dp.x-cx)/rx, dy=(dp.y-cy)/ry;
          if(dx*dx+dy*dy<=1) return e;
        }else{
          const t=tolPx/Math.max(scale,.001);
          if(x>=r.x-t&&x<=r.x+r.w+t&&y>=r.y-t&&y<=r.y+r.h+t) return e;
        }
      }
    }
    return null;
  }

  function deleteSelected(){
    if(selectedId==null) return false;
    const before=objects.length+effects.length;
    objects=objects.filter(o=>o.id!==selectedId);
    effects=effects.filter(o=>o.id!==selectedId);
    if(objects.length+effects.length===before) return false;
    selectedId=null; pushHistory(false); buildOptionsBar(); redraw();
    showToast('선택 항목을 삭제했습니다.',900); return true;
  }

  function normRect(a,b){
    const x = Math.min(a.x,b.x), y = Math.min(a.y,b.y);
    return {x, y, w:Math.abs(b.x-a.x), h:Math.abs(b.y-a.y)};
  }

  // ---------------- pointer coordinate helpers ----------------
  function getDispPoint(e){
    const rect = viewCanvas.getBoundingClientRect();
    // CSS 확대/이동 뒤의 화면 좌표를 base canvas 좌표로 역변환한다.
    const rw=rect.width||dispW, rh=rect.height||dispH;
    return {
      x: clamp((e.clientX-rect.left)*(dispW/rw),0,dispW),
      y: clamp((e.clientY-rect.top)*(dispH/rh),0,dispH)
    };
  }
  function dispToNat(p){ return { x:p.x/scale, y:p.y/scale }; }

  // ---------------- hit testing ----------------
  function distToSegment(px,py,x1,y1,x2,y2){
    const dx=x2-x1, dy=y2-y1;
    const len2 = dx*dx+dy*dy;
    let t = len2===0?0:((px-x1)*dx+(py-y1)*dy)/len2;
    t = clamp(t,0,1);
    const cx = x1+t*dx, cy = y1+t*dy;
    return Math.hypot(px-cx, py-cy);
  }

  function findHandleAt(dispPt){
    if(selectedId==null) return null;
    const o = objects.find(x=>x.id===selectedId);
    if(!o) return null;
    const pts = handlePointsDisplay(o, scale);
    for(const p of pts){
      if(Math.hypot(dispPt.x-p.x, dispPt.y-p.y) <= HANDLE_SCREEN_SIZE){
        return {obj:o, handle:p.k};
      }
    }
    return null;
  }

  function findObjectAt(dispPt){
    for(let i=objects.length-1;i>=0;i--){
      const o = objects[i];
      if(o.type==="arrow"){
        const d = distToSegment(dispPt.x,dispPt.y, o.x1*scale,o.y1*scale, o.x2*scale,o.y2*scale);
        if(d<=HIT_TOLERANCE) return o;
      } else if(o.type==="circle"){
        // 타원도 네모와 동일하게 내부 아무 곳이나 잡아 선택/이동한다.
        // 화면상 약간의 터치 여유를 더해 모바일에서도 잡기 쉽게 한다.
        const cx=o.cx*scale, cy=o.cy*scale, rx=Math.max(1,o.rx*scale), ry=Math.max(1,o.ry*scale);
        const ex=rx+HIT_TOLERANCE, ey=ry+HIT_TOLERANCE;
        const q=((dispPt.x-cx)/ex)**2+((dispPt.y-cy)/ey)**2;
        if(q<=1) return o;
      } else if(o.type==="rect"){
        // 네모는 테두리뿐 아니라 내부를 눌러도 선택/이동할 수 있게 한다.
        const b=objectBoundsNatural(o), x=b.x*scale,y=b.y*scale,w=b.w*scale,h=b.h*scale;
        const inside=dispPt.x>=x-HIT_TOLERANCE&&dispPt.x<=x+w+HIT_TOLERANCE&&dispPt.y>=y-HIT_TOLERANCE&&dispPt.y<=y+h+HIT_TOLERANCE;
        if(inside) return o;
      }
    }
    return null;
  }

  }

        del.onclick=()=>{
          objects=objects.filter(o=>o.id!==selectedId); selectedId=null; pushHistory(false); buildOptionsBar(); redraw(); showToast("선택 항목을 삭제했습니다.",1000);

  // ---------------- pointer interaction ----------------
  // 한 손가락/좌클릭 = 편집, 두 손가락 = 보기(핀치 확대 + 이동).
  // 두 손가락 제스처 중에는 마킹 생성/선택/이동을 절대 실행하지 않는다.
  viewCanvas.addEventListener("pointerdown", function(e){
    activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
    if(e.pointerType==="touch" && activePointers.size>=2){
      e.preventDefault();
      drag=null; // 첫 손가락으로 시작됐던 편집 동작도 즉시 취소
      const pts=[...activePointers.values()].slice(0,2);
      const dx=pts[1].x-pts[0].x, dy=pts[1].y-pts[0].y;
      pinchGesture={
        startDist:Math.max(1,Math.hypot(dx,dy)), startZoom:viewZoom,
        startMid:{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2},
        startPanX:viewPanX,startPanY:viewPanY, ids:[...activePointers.keys()].slice(0,2)
      };
      pinchGesture.ids.forEach(id=>suppressPointerUp.add(id));
      redraw(); return;
    }
    if(!pinchGesture) onPointerDown(e);
  });
  viewCanvas.addEventListener("pointermove", function(e){
    if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
    if(pinchGesture){
      e.preventDefault();
      const a=activePointers.get(pinchGesture.ids[0]), b=activePointers.get(pinchGesture.ids[1]);
      if(a&&b){
        const dist=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y));
        const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
        viewZoom=clamp(pinchGesture.startZoom*(dist/pinchGesture.startDist),MIN_VIEW_ZOOM,MAX_VIEW_ZOOM);
        viewPanX=pinchGesture.startPanX+(mid.x-pinchGesture.startMid.x);
        viewPanY=pinchGesture.startPanY+(mid.y-pinchGesture.startMid.y);
        clampView(); applyViewTransform();
      }
      return;
    }
    onPointerMove(e);
  });
  function finishPointer(e){
    const wasSuppressed=suppressPointerUp.has(e.pointerId);
    activePointers.delete(e.pointerId);
    suppressPointerUp.delete(e.pointerId);
    if(pinchGesture){
      if(activePointers.size<2){
        pinchGesture.ids.forEach(id=>suppressPointerUp.add(id));
        pinchGesture=null;
        clampView(); applyViewTransform();
      }
      return;
    }
    if(wasSuppressed) return;
    onPointerUp(e);
  }
  window.addEventListener("pointerup", finishPointer);
  window.addEventListener("pointercancel", finishPointer);

  // PC: 마우스 휠은 보기 확대/축소 전용. 편집 기능과 연결하지 않는다.
  viewCanvas.addEventListener("wheel", function(e){
    if(!naturalW) return;
    e.preventDefault();
    const factor=Math.exp(-e.deltaY*0.0015);
    setViewZoom(viewZoom*factor,e.clientX,e.clientY);
  },{passive:false});

  function onPointerDown(e){
    if(!naturalW) return;
    e.preventDefault();
    viewCanvas.setPointerCapture && viewCanvas.setPointerCapture(e.pointerId);
    const dp = getDispPoint(e);

    // 기존 항목 선택이 언제나 새 마킹 생성보다 우선한다.
    const selectedEffect = effects.find(x=>x.id===selectedId);
    if(selectedEffect && effectCloseHit(dp, selectedEffect)){ deleteSelected(); return; }
    const selectedObject = objects.find(x=>x.id===selectedId);
    if(selectedObject && objectCloseHit(dp, selectedObject)){ deleteSelected(); return; }
    const handleHit = findHandleAt(dp);
    if(handleHit){ selectedId=handleHit.obj.id; drag={mode:"resize",obj:handleHit.obj,handle:handleHit.handle,startNat:dispToNat(dp)}; buildOptionsBar(); redraw(); return; }
    const objHit = findObjectAt(dp);
    if(objHit){ selectedId=objHit.id; strokeMultCurrent=objHit.strokeMult||1; drag={mode:"move",obj:objHit,last:dispToNat(dp),snapshot:Object.assign({},objHit)}; buildOptionsBar(); redraw(); return; }
    const eh=findEffectAt(dp);
    if(eh){
      selectedId=eh.id;
      intensity=Number.isFinite(eh.intensity)?eh.intensity:intensity;
      feather=Number.isFinite(eh.feather)?eh.feather:feather;
      blurMode=eh.mode||blurMode;
      if(!eh.autoFace) blurShape=eh.shape||blurShape;
      // 블러/모자이크도 생성 후 영역 안을 드래그해 자유롭게 이동한다.
      drag={mode:"effectMove",effect:eh,last:dispToNat(dp)};
      buildOptionsBar(); redraw(); return;
    }

    // 기존 항목이 없는 곳을 누르면 먼저 선택을 해제한다.
    if(selectedId!=null){ selectedId=null; buildOptionsBar(); redraw(); }
    if(activeTool==="blur"){
      if(pendingEffect) commitPendingEffect();
      drag = {mode:"create", startDisp:dp, curDisp:dp}; redraw(); return;
    }

    if(activeTool==="circle" || activeTool==="arrow"){
      selectedId = null;
      drag = {mode:"create", startDisp:dp, curDisp:dp};
      redraw();
      return;
    }

    // 빈 곳 클릭 -> 선택 해제
    if(selectedId!=null){
      selectedId = null;
      buildOptionsBar();
      redraw();
    }
    drag = null;
  }

  function onPointerMove(e){
    if(!drag) return;
    const dp = getDispPoint(e);
    if(drag.mode==="create"){
      drag.curDisp = dp;
      redraw();
    } else if(drag.mode==="move"){
      const nat = dispToNat(dp);
      const dx = nat.x-drag.last.x, dy = nat.y-drag.last.y;
      const o = drag.obj;
      if(o.type==="circle"){ o.cx+=dx; o.cy+=dy; }
      else if(o.type==="rect"){ o.x+=dx; o.y+=dy; }
      else { o.x1+=dx; o.y1+=dy; o.x2+=dx; o.y2+=dy; }
      drag.last = nat;
      redraw();
    } else if(drag.mode==="effectMove"){
      const nat=dispToNat(dp);
      const dx=nat.x-drag.last.x, dy=nat.y-drag.last.y;
      const eff=drag.effect;
      const b=effectBounds(eff);
      // 효과 전체가 사진 밖으로 사라지지 않도록 이동량을 제한한다.
      const mdx=clamp(dx,-b.x,naturalW-(b.x+b.w));
      const mdy=clamp(dy,-b.y,naturalH-(b.y+b.h));
      eff.rect.x+=mdx; eff.rect.y+=mdy;
      if(eff.faceRects&&eff.faceRects.length) eff.faceRects.forEach(r=>{r.x+=mdx;r.y+=mdy;});
      drag.last={x:nat.x-(dx-mdx),y:nat.y-(dy-mdy)};
      redraw();
    } else if(drag.mode==="resize"){
      const nat = dispToNat(dp);
      const o = drag.obj;
      if(o.type==="circle" || o.type==="rect"){
        const b = objectBoundsNatural(o);
        const x0=b.x, y0=b.y, x1=b.x+b.w, y1=b.y+b.h;
        let ax, ay, mx=nat.x, my=nat.y;
        if(drag.handle==="nw"){ ax=x1; ay=y1; }
        else if(drag.handle==="ne"){ ax=x0; ay=y1; }
        else if(drag.handle==="sw"){ ax=x1; ay=y0; }
        else { ax=x0; ay=y0; } // se
        let mvx=mx, mvy=my;
        if(circleLocked){
          const size = Math.max(Math.abs(mx-ax), Math.abs(my-ay), 4);
          const signX = mx>=ax?1:-1, signY = my>=ay?1:-1;
          mvx = ax+signX*size; mvy = ay+signY*size;
        }
        const nx = Math.min(ax,mvx), ny=Math.min(ay,mvy);
        const nw = Math.max(4,Math.abs(mvx-ax)), nh = Math.max(4,Math.abs(mvy-ay));
        if(o.type==="circle"){ o.cx = nx+nw/2; o.cy = ny+nh/2; o.rx = nw/2; o.ry = nh/2; }
        else { o.x=nx; o.y=ny; o.w=nw; o.h=nh; }
      } else {
        if(drag.handle==="p1"){ o.x1=nat.x; o.y1=nat.y; }
        else { o.x2=nat.x; o.y2=nat.y; }
      }
      redraw();
    }
  }

  function onPointerUp(e){
    if(!drag) return;
    const finishedDrag = drag;
    drag = null;

    if(finishedDrag.mode==="create"){
      const dp0 = finishedDrag.startDisp, dp1 = finishedDrag.curDisp;
      const moved = Math.hypot(dp1.x-dp0.x, dp1.y-dp0.y) > 3;

      if(activeTool==="blur"){
        if(moved){
          const r = normRect(dispToNat(dp0), dispToNat(dp1));
          if(r.w>2 && r.h>2){
            const toolAtDrag = activeTool;
            runFaceDetectionInBox(r, function(faces, points){
              if(activeTool!==toolAtDrag) return;
              faceDebugPoints = points || [];
              clearTimeout(faceDebugTimer);
              faceDebugTimer = setTimeout(()=>{ faceDebugPoints=[]; redraw(); }, 1100);
              // 조건을 통과한 얼굴만 이목구비 중심으로 자동 가림한다. 조건을 못 넘으면 사용자가 그린 위치를 그대로 가린다.
              // MediaPipe가 반환한 눈·코·입 랜드마크 기반 영역을 그대로 사용한다.
              const faceRects=(faces||[]).map(face=>({x:face.x,y:face.y,w:face.w,h:face.h}));
              pendingEffect = faceRects.length
                ? { rect: faceRects[0], faceRects, autoFace:true }
                : { rect:r, autoFace:false };
              recomputePendingPreview();
              if(faceRects.length) showToast("얼굴 위치 보정",1000);
              else showToast("지정한 영역 그대로 가림",1100);
            });
          }
        }
        redraw();
        return;
      }

      if(activeTool==="circle"){
        if(moved){
          const n0 = dispToNat(dp0), n1 = dispToNat(dp1);
          let r;
          if(circleLocked){
            const size = Math.max(Math.abs(n1.x-n0.x), Math.abs(n1.y-n0.y));
            const signX = n1.x>=n0.x?1:-1, signY = n1.y>=n0.y?1:-1;
            r = normRect(n0, {x:n0.x+signX*size, y:n0.y+signY*size});
          } else {
            r = normRect(n0, n1);
          }
          if(r.w>3 && r.h>3){
            const obj = shapeKind==="rect"
              ? {id:genId(), type:"rect", x:r.x, y:r.y, w:r.w, h:r.h, strokeMult:strokeMultCurrent, color:strokeColorCurrent}
              : {id:genId(), type:"circle", cx:r.x+r.w/2, cy:r.y+r.h/2, rx:r.w/2, ry:r.h/2, strokeMult:strokeMultCurrent, color:strokeColorCurrent};
            objects.push(obj);
            selectedId = obj.id;
            pushHistory(false);
            buildOptionsBar();
          }
        }
        redraw();
        return;
      }

      if(activeTool==="arrow"){
        if(moved){
          const n0 = dispToNat(dp0), n1 = dispToNat(dp1);
          const obj = {id:genId(), type:"arrow", x1:n0.x, y1:n0.y, x2:n1.x, y2:n1.y, strokeMult:strokeMultCurrent, color:strokeColorCurrent};
          objects.push(obj);
          selectedId = obj.id;
          pushHistory(false);
          buildOptionsBar();
        }
        redraw();
        return;
      }
    } else if(finishedDrag.mode==="move" || finishedDrag.mode==="resize" || finishedDrag.mode==="effectMove"){
      pushHistory(false);
    }
  }

  // ---------------- 박스 안 얼굴 자동 인식 ----------------
  // MediaPipe Face Landmarker로 눈·코·입 랜드마크를 찾는다.
  // 자동 인식은 위치를 새로 결정하지 않고, 사용자가 그린 범위 안에서만 이목구비 영역을 미세 보정한다.
  let faceLandmarkerPromise = null;
  function ensureFaceLandmarker(){
    if(faceLandmarkerPromise) return faceLandmarkerPromise;
    faceLandmarkerPromise = (async()=>{
      try{
        const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm");
        const fileset = await vision.FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
        );
        return await vision.FaceLandmarker.createFromOptions(fileset,{
          baseOptions:{
            modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate:"GPU"
          },
          runningMode:"IMAGE",
          numFaces:4,
          minFaceDetectionConfidence:0.60,
          minFacePresenceConfidence:0.60,
          minTrackingConfidence:0.55,
          outputFaceBlendshapes:false,
          outputFacialTransformationMatrixes:false
        });
      }catch(err){
        console.warn("Face Landmarker unavailable; manual region will be used.", err);
        return null;
      }
    })();
    return faceLandmarkerPromise;
  }

  function runFaceDetectionInBox(natRect, cb){
    (async()=>{
      // 얼굴 일부만 드래그해도 눈/입이 crop 경계에 잘리지 않도록 탐지용 crop만 넉넉히 확장한다.
      // 최종 후보 판정은 아래에서 원래 사용자가 그린 natRect를 기준으로 하므로 다른 얼굴로 점프하지 않는다.
      const marginX=natRect.w*0.35, marginY=natRect.h*0.35;
      const sx=clamp(Math.floor(natRect.x-marginX),0,naturalW), sy=clamp(Math.floor(natRect.y-marginY),0,naturalH);
      const ex=clamp(Math.ceil(natRect.x+natRect.w+marginX),0,naturalW), ey=clamp(Math.ceil(natRect.y+natRect.h+marginY),0,naturalH);
      const cw=Math.max(1,ex-sx), ch=Math.max(1,ey-sy);
      if(cw<24||ch<24){ cb([],[]); return; }

      const detectMax=1024, ds=Math.min(1,detectMax/Math.max(cw,ch));
      const dw=Math.max(24,Math.round(cw*ds)), dh=Math.max(24,Math.round(ch*ds));
      const crop=document.createElement("canvas"); crop.width=dw; crop.height=dh;
      const cctx=crop.getContext("2d"); cctx.imageSmoothingEnabled=true; cctx.imageSmoothingQuality="high";
      cctx.drawImage(rasterCanvas,sx,sy,cw,ch,0,0,dw,dh);

      const landmarker=await ensureFaceLandmarker();
      if(!landmarker){ cb([],[]); return; }
      let result;
      try{ result=landmarker.detect(crop); }catch(err){ console.warn(err); cb([],[]); return; }
      const faces=(result&&result.faceLandmarks)||[];
      if(!faces.length){ cb([],[]); return; }

      // 눈·코·입의 대표 랜드마크. 머리/귀가 아니라 실제 이목구비를 기준으로 가림 영역을 만든다.
      const featureIdx=[33,133,159,145,362,263,386,374,1,2,98,327,61,291,13,14,78,308];
      const selCx=natRect.x+natRect.w/2, selCy=natRect.y+natRect.h/2;
      const selDiag=Math.max(1,Math.hypot(natRect.w,natRect.h));
      const candidates=[];
      for(const lm of faces){
        const pts=featureIdx.map(i=>lm[i]).filter(Boolean).map(pt=>({x:sx+pt.x*cw,y:sy+pt.y*ch}));
        if(pts.length<8) continue;
        let x1=Math.min(...pts.map(p=>p.x)), y1=Math.min(...pts.map(p=>p.y));
        let x2=Math.max(...pts.map(p=>p.x)), y2=Math.max(...pts.map(p=>p.y));
        const fw=Math.max(8,x2-x1), fh=Math.max(8,y2-y1);
        // 랜드마크 자체보다 약간 넓혀 눈썹·입 주변까지 자연스럽게 포함한다.
        // 보도사진 익명화 기준: 눈·코·입은 확실히 덮되 머리카락/턱 전체까지 과도하게 먹지 않도록 한다.
        const padX=fw*0.30, padTop=fh*0.30, padBottom=fh*0.30;
        x1-=padX; x2+=padX; y1-=padTop; y2+=padBottom;
        const cx=(x1+x2)/2, cy=(y1+y2)/2;
        const centerInside=cx>=natRect.x&&cx<=natRect.x+natRect.w&&cy>=natRect.y&&cy<=natRect.y+natRect.h;
        const centerNear=Math.hypot(cx-selCx,cy-selCy)<=selDiag*0.34;
        if(!centerInside||!centerNear) continue;
        const ix1=Math.max(x1,natRect.x), iy1=Math.max(y1,natRect.y);
        const ix2=Math.min(x2,natRect.x+natRect.w), iy2=Math.min(y2,natRect.y+natRect.h);
        const overlap=Math.max(0,ix2-ix1)*Math.max(0,iy2-iy1);
        const featureArea=Math.max(1,(x2-x1)*(y2-y1));
        if(overlap/featureArea<0.58) continue;
        candidates.push({x:clamp(x1,0,naturalW),y:clamp(y1,0,naturalH),w:Math.min(x2-x1,naturalW-clamp(x1,0,naturalW)),h:Math.min(y2-y1,naturalH-clamp(y1,0,naturalH)),cx,cy});
      }
      candidates.sort((a,b)=>Math.hypot(a.cx-selCx,a.cy-selCy)-Math.hypot(b.cx-selCx,b.cy-selCy));
      const chosen=candidates[0];
      if(!chosen){ cb([],[]); return; }
      cb([{x:chosen.x,y:chosen.y,w:chosen.w,h:chosen.h}],[{x:chosen.cx,y:chosen.cy}]);
    })();
  }

  // ---------------- blur / mosaic engine ----------------
  // ctx.filter="blur()"는 일부 렌더링 환경에서 적용되지 않을 수 있어,
  // 축소→확대(다운스케일→업스케일)를 반복하는 방식으로 흐림 효과를 직접 구현한다.
  function boxBlurCanvas(srcCanvas, radiusPx){
    const w = srcCanvas.width, h = srcCanvas.height;
    if(!(radiusPx>0.5)){
      const c0 = document.createElement("canvas"); c0.width=w; c0.height=h;
      c0.getContext("2d").drawImage(srcCanvas,0,0);
      return c0;
    }
    // 최신 브라우저에서는 Canvas 2D의 실제 blur 필터를 우선 사용한다.
    // 단순 축소→확대보다 얼굴 피부/안경/글자 경계가 훨씬 균일하게 흐려져 익명화 품질이 좋다.
    // 지원하지 않는 환경에서는 아래의 고품질 다단계 리샘플링으로 자동 폴백한다.
    const nativeOut = document.createElement("canvas"); nativeOut.width=w; nativeOut.height=h;
    const nctx = nativeOut.getContext("2d");
    if(nctx && "filter" in nctx){
      try{
        // 두 번의 중간 강도 Gaussian pass가 한 번의 과도한 blur보다
        // 얼굴색을 희게 번지게 하지 않으면서 눈·코·입 디테일을 안정적으로 제거한다.
        const passRadius = Math.max(0.6, radiusPx * 0.72);
        const tmp = document.createElement("canvas"); tmp.width=w; tmp.height=h;
        const tctx = tmp.getContext("2d");
        tctx.filter = `blur(${passRadius}px)`;
        tctx.drawImage(srcCanvas,0,0);
        tctx.filter = "none";
        nctx.filter = `blur(${passRadius}px)`;
        nctx.drawImage(tmp,0,0);
        nctx.filter = "none";
        return nativeOut;
      }catch(_e){}
    }

    // 폴백: 전체적으로 줄여야 하는 배율(강도에 비례). 한 번에 과도하게 축소하면
    // 얼룩/줄무늬가 생기므로 단계별 최대 축소량을 제한한다.
    const totalFactor = Math.max(1.3, radiusPx/3.2);
    const passes = Math.max(1, Math.min(8, Math.ceil(Math.log2(totalFactor))));
    const perStep = Math.pow(totalFactor, 1/passes);
    let curW = w, curH = h, cur = srcCanvas;
    for(let i=0;i<passes;i++){
      const nw = Math.max(1, Math.round(curW/perStep));
      const nh = Math.max(1, Math.round(curH/perStep));
      const small = document.createElement("canvas"); small.width=nw; small.height=nh;
      const sctx = small.getContext("2d");
      sctx.imageSmoothingEnabled = true;
      sctx.imageSmoothingQuality = "high";
      sctx.drawImage(cur, 0,0,curW,curH, 0,0,nw,nh);
      cur = small; curW = nw; curH = nh;
    }
    const out = document.createElement("canvas"); out.width=w; out.height=h;
    const octx = out.getContext("2d");
    octx.imageSmoothingEnabled = true;
    octx.imageSmoothingQuality = "high";
    octx.drawImage(cur, 0,0,curW,curH, 0,0,w,h);
    return out;
  }

  // natRect 영역에 대해 현재 shape/mode/intensity 기준으로 처리된 결과 조각을 계산만 하고,
  // 원본 rasterCanvas에는 아직 반영하지 않는다 (실시간 미리보기/재조정을 위해 분리).
  function computeEffectRegion(natRect, shape, mode){
    const radiusOrBlock = mode==="blur" ? blurRadiusNatural(natRect) : mosaicBlockNatural(natRect);
    const base = Math.max(8, Math.min(natRect.w, natRect.h));
    const ft = clamp(feather/100,0,1);
    // 페더는 익명화 강도를 낮추지 않고 가장자리 전환에만 쓴다.
    // 기존 24%는 얼굴 전체가 반투명해 보일 정도로 과했다. 최대 약 8%로 제한한다.
    const featherPx = feather>0 ? base * 0.08 * Math.pow(ft,1.15) : 0;
    const pad = Math.ceil((mode==="blur" ? radiusOrBlock*2.6 : 2) + featherPx*2 + 8);
    const sx = clamp(Math.floor(natRect.x-pad),0,naturalW);
    const sy = clamp(Math.floor(natRect.y-pad),0,naturalH);
    const ex = clamp(Math.ceil(natRect.x+natRect.w+pad),0,naturalW);
    const ey = clamp(Math.ceil(natRect.y+natRect.h+pad),0,naturalH);
    const sw = Math.max(1, ex-sx), sh = Math.max(1, ey-sy);

    const src = document.createElement("canvas"); src.width=sw; src.height=sh;
    const sctx = src.getContext("2d");
    sctx.drawImage(rasterCanvas, sx,sy,sw,sh, 0,0,sw,sh);

    let processed;
    if(mode==="blur"){
      processed = boxBlurCanvas(src, radiusOrBlock);
    } else {
      const blockSize = radiusOrBlock;
      const smallW = Math.max(1, Math.round(sw/blockSize));
      const smallH = Math.max(1, Math.round(sh/blockSize));
      const small = document.createElement("canvas"); small.width=smallW; small.height=smallH;
      const smctx = small.getContext("2d");
      smctx.imageSmoothingEnabled = true;
      smctx.drawImage(src,0,0,sw,sh,0,0,smallW,smallH);
      const out = document.createElement("canvas"); out.width=sw; out.height=sh;
      const octx = out.getContext("2d");
      octx.imageSmoothingEnabled = false;
      octx.drawImage(small,0,0,smallW,smallH,0,0,sw,sh);
      processed = out;
    }

    // 마스크 생성 (선택 영역 모양 + 블러는 가장자리 페더)
    const mask = document.createElement("canvas"); mask.width=sw; mask.height=sh;
    const mctx = mask.getContext("2d");
    const rx0 = natRect.x-sx, ry0 = natRect.y-sy;
    mctx.fillStyle = "#fff";
    if(shape==="ellipse"){
      // 얼굴 중앙은 항상 100% 효과. 페더는 외곽의 얇은 링에서만 작동한다.
      // 타원은 원형 radialGradient를 비율 변환해서 정확한 타원 그라데이션으로 만든다.
      const cx=rx0+natRect.w/2, cy=ry0+natRect.h/2;
      const rx=Math.max(1,natRect.w/2), ry=Math.max(1,natRect.h/2);
      const edgeFrac = featherPx>0 ? clamp(featherPx/Math.max(1,Math.min(rx,ry)),0.02,0.28) : 0;
      mctx.save();
      mctx.translate(cx,cy); mctx.scale(rx,ry);
      if(edgeFrac>0){
        const g=mctx.createRadialGradient(0,0,0,0,0,1);
        g.addColorStop(0,"rgba(255,255,255,1)");
        g.addColorStop(Math.max(0,1-edgeFrac),"rgba(255,255,255,1)");
        g.addColorStop(1,"rgba(255,255,255,0)");
        mctx.fillStyle=g;
      }
      mctx.beginPath(); mctx.arc(0,0,1,0,Math.PI*2); mctx.fill();
      mctx.restore();
    } else {
      mctx.fillRect(rx0, ry0, natRect.w, natRect.h);
    }
    let finalMask = mask;
    // 사각형만 기존 방식의 좁은 경계 페더를 사용한다. 타원은 위에서 불투명 중심을 보장했다.
    if(shape!=="ellipse" && featherPx>0.5){
      const fm=document.createElement("canvas"); fm.width=sw; fm.height=sh;
      const fctx=fm.getContext("2d");
      if("filter" in fctx){
        fctx.filter=`blur(${featherPx}px)`; fctx.drawImage(mask,0,0); fctx.filter="none"; finalMask=fm;
      }else finalMask=boxBlurCanvas(mask, featherPx);
    }

    const pctx = processed.getContext("2d");
    pctx.globalCompositeOperation = "destination-in";
    pctx.drawImage(finalMask,0,0);
    pctx.globalCompositeOperation = "source-over";

    return { canvas: processed, sx, sy };
  }

  function renderEffectObject(eff){
    const oldI=intensity, oldF=feather; intensity=eff.intensity; feather=eff.feather;
    const rs=eff.faceRects&&eff.faceRects.length?eff.faceRects:[eff.rect];
    let result;
    if(rs.length===1){ result=computeEffectRegion(rs[0], eff.autoFace?'ellipse':eff.shape, eff.mode); }
    else {
      const overlay=document.createElement('canvas'); overlay.width=naturalW; overlay.height=naturalH;
      const oc=overlay.getContext('2d'); rs.forEach(r=>{const z=computeEffectRegion(r,'ellipse',eff.mode);oc.drawImage(z.canvas,z.sx,z.sy);});
      result={canvas:overlay,sx:0,sy:0};
    }
    intensity=oldI; feather=oldF; return result;
  }

  // 아직 확정되지 않은 가림 효과의 미리보기를 현재 강도/모드/모양으로 다시 계산
  function recomputePendingPreview(){
    if(!pendingEffect) return;
    try{
      const rects = pendingEffect.faceRects && pendingEffect.faceRects.length ? pendingEffect.faceRects : [pendingEffect.rect];
      if(rects.length===1){
        const effectShape = pendingEffect.autoFace ? "ellipse" : blurShape;
        const region = computeEffectRegion(rects[0], effectShape, blurMode);
        pendingEffect.canvas = region.canvas;
        pendingEffect.sx = region.sx;
        pendingEffect.sy = region.sy;
      } else {
        // 여러 얼굴을 한 번에 선택했을 때 각 얼굴만 독립적으로 가린다.
        const overlay = document.createElement("canvas"); overlay.width=naturalW; overlay.height=naturalH;
        const octx=overlay.getContext("2d");
        rects.forEach(rr=>{
          const region=computeEffectRegion(rr, "ellipse", blurMode);
          octx.drawImage(region.canvas, region.sx, region.sy);
        });
        pendingEffect.canvas=overlay; pendingEffect.sx=0; pendingEffect.sy=0;
      }
      redraw();
    }catch(err){
      showToast("가림 효과 계산 중 오류: "+(err&&err.message?err.message:err));
      pendingEffect = null;
      redraw();
    }
  }

  // 확정: 미리보기 결과를 실제 rasterCanvas 픽셀에 합성하고 히스토리에 기록
  function commitPendingEffect(){
    if(!pendingEffect) return;
    const eff={
      id:genId(), type:'effect', rect:Object.assign({},pendingEffect.rect),
      faceRects:(pendingEffect.faceRects||[]).map(r=>Object.assign({},r)),
      autoFace:!!pendingEffect.autoFace, mode:blurMode, shape:pendingEffect.autoFace?'ellipse':blurShape,
      intensity:intensity, feather:feather
    };
    effects.push(eff); selectedId=eff.id; pendingEffect=null;
    pushHistory(false); buildOptionsBar(); redraw();
  }

  // 취소: 확정하지 않고 미리보기를 버림
  function discardPendingEffect(){
    pendingEffect = null;
  }

  // ---------------- undo/redo buttons ----------------
  btnUndo.addEventListener("click", undo);
  btnRedo.addEventListener("click", redo);

  // ---------------- photo / selection delete ----------------
  function clearPhoto(){
    if(!naturalW) return;
    if(!confirm("현재 사진과 모든 마킹을 지울까요?")) return;
    discardPendingEffect(); naturalW=0; naturalH=0; objects=[]; effects=[]; selectedId=null; drag=null;
    rasterCanvas=document.createElement("canvas"); rasterCtx=rasterCanvas.getContext("2d");
    rasterStates=[]; history=[]; historyIndex=-1;
    viewCanvas.width=1; viewCanvas.height=1; viewCanvas.classList.remove("ready");
    placeholder.classList.remove("hidden"); btnSave.disabled=true; btnClearPhoto.disabled=true;
    setActiveTool(null); updateHistoryButtons();
  }
  btnClearPhoto.addEventListener("click", clearPhoto);

  // ---------------- keyboard shortcuts ----------------
  window.addEventListener("keydown", (e)=>{
    const meta = e.ctrlKey || e.metaKey;
    if(meta && e.key.toLowerCase()==="o"){
      e.preventDefault();
      fileInput.click();
      return;
    }
    if(meta && !e.shiftKey && e.key.toLowerCase()==="z"){
      e.preventDefault(); undo(); return;
    }
    if(meta && e.shiftKey && e.key.toLowerCase()==="z"){
      e.preventDefault(); redo(); return;
    }
    if((e.key==="Delete" || e.key==="Backspace") && selectedId!=null){
      const tag = document.activeElement && document.activeElement.tagName;
      if(tag==="INPUT" || tag==="SELECT") return;
      e.preventDefault();
      deleteSelected();
      return;
    }
    if(e.key==="Escape"){
      if(pendingEffect){ discardPendingEffect(); redraw(); return; }
      if(drag){ drag=null; redraw(); return; }
      if(selectedId!=null){ selectedId=null; buildOptionsBar(); redraw(); return; }
      if(activeTool){ setActiveTool(null); }
    }
  });

  // ---------------- save ----------------
  let claudeDownloadsPromise = null;
  function getDownloads(){
    if(!claudeDownloadsPromise){
      claudeDownloadsPromise = (window.claude && typeof window.claude.use === "function")
        ? window.claude.use("downloads").catch(()=>null)
        : Promise.resolve(null);
    }
    return claudeDownloadsPromise;
  }

  btnSave.addEventListener("click", async ()=>{
    if(!naturalW) return;
    if(pendingEffect) commitPendingEffect();
    const format = formatSelect.value;
    const outCanvas = document.createElement("canvas");
    outCanvas.width = naturalW; outCanvas.height = naturalH;
    const octx = outCanvas.getContext("2d");
    octx.drawImage(rasterCanvas,0,0);
    effects.forEach(eff=>{ const r=renderEffectObject(eff); if(r&&r.canvas) octx.drawImage(r.canvas,r.sx,r.sy); });
    objects.forEach(o=> drawObjectOnCtx(octx, o, 1));

    const mime = format==="png" ? "image/png" : "image/jpeg";
    const quality = format==="png" ? undefined : 0.92;
    const ext = format==="png" ? "png" : "jpg";
    const filename = "마킹_" + Date.now() + "." + ext;

    outCanvas.toBlob(async (blob)=>{
      if(!blob){ showToast("저장에 실패했습니다."); return; }
      const downloads = await getDownloads();
      if(!downloads){
        // Claude 아티팩트 환경이 아닐 때(예: 독립 실행, GitHub Pages)는
        // 표준 브라우저 다운로드 방식으로 저장한다.
        try{
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(()=>URL.revokeObjectURL(url), 5000);
          showToast("저장되었습니다.");
        }catch(err){
          showToast("저장할 수 없습니다.");
        }
        return;
      }
      try{
        const res = await downloads.save({ filename, data: blob });
        if(res && res.status==="saved"){ showToast("저장되었습니다."); }
        else { showToast("전달되었습니다."); }
      }catch(err){
        const code = err && err.code;
        if(code==="declined"){ /* 조용히 무시 */ }
        else if(code==="too_large"){ showToast("파일이 너무 큽니다."); }
        else if(code==="rate_limited"){ showToast("잠시 후 다시 시도해주세요."); }
        else { showToast("저장할 수 없습니다."); }
      }
    }, mime, quality);
  });

  // ---------------- init ----------------
  fitCanvas();
})();
</script>
</body>
